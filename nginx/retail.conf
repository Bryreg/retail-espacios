# ─────────────────────────────────────────────────────────────────────────────
# nginx/retail.conf — reverse proxy para retail-espacios
# Copiar a /etc/nginx/sites-available/retail en el VPS
# Luego: ln -s /etc/nginx/sites-available/retail /etc/nginx/sites-enabled/retail
# nginx -t && nginx -s reload
# ─────────────────────────────────────────────────────────────────────────────

upstream retail_prod {
    server retail_prod:8000;
    keepalive 16;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name retail.tudominio.com;
    return 301 https://$host$request_uri;
}

# ── PRODUCCIÓN: retail.tudominio.com ─────────────────────────────────────────
server {
    listen 443 ssl;
    server_name retail.tudominio.com;

    # Certificados SSL (certbot: certbot --nginx -d retail.tudominio.com)
    ssl_certificate     /etc/letsencrypt/live/retail.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail.tudominio.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # API calls → backend (strip /api/ prefix)
    location /api/ {
        proxy_pass         http://retail_prod/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Todo lo demás → SPA (el backend sirve el index.html)
    location / {
        proxy_pass         http://retail_prod;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 10s;
    }
}
