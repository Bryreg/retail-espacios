databases:
  - name: retail-db
    databaseName: retail_espacios
    user: retail_user

services:
  - type: web
    name: retail-espacios
    runtime: docker
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retail-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Identidad (Fase 1): login con Google/correo vía Firebase Auth.
      # Es la ÚNICA puerta: sin FIREBASE_PROJECT_ID el endpoint /api/auth/oauth
      # responde 503 y nadie entra (la clave compartida está apagada, ver
      # LOGIN_LEGADO abajo). Las VITE_* son config PÚBLICA del cliente (no son
      # secretos) pero Vite las hornea EN EL BUILD: tienen que estar definidas
      # cuando corre el build del Docker, no solo en runtime.
      # Valores del proyecto Firebase "recabra":
      #   FIREBASE_PROJECT_ID=recabra
      #   VITE_FIREBASE_API_KEY=<apiKey de la consola>
      #   VITE_FIREBASE_AUTH_DOMAIN=recabra.firebaseapp.com
      #   VITE_FIREBASE_PROJECT_ID=recabra
      # Y en Firebase: Authentication → Settings → dominios autorizados debe
      # incluir retail-espacios.onrender.com o el popup de Google se rechaza.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      # Fase 2: correos (separados por coma) de los operadores de plataforma —
      # quienes mueven el estado de cuenta de los clientes desde el panel.
      # Solo aplica a cuentas con sub (el login legado jamás es operador).
      - key: OPERADOR_EMAILS
        sync: false
      # El acceso por clave compartida (POST /api/auth/login) está APAGADO
      # desde 2026-10-01: se entra sólo con Google/correo. LOGIN_LEGADO=1 lo
      # prende, sólo como emergencia si Firebase no deja entrar a nadie — con
      # él prendido, quien sepa ADMIN_PASSWORD entra como admin a cualquier
      # supermercado fundado por el alta. No se declara acá a propósito.
      # Correo. DOS caminos, y en el plan gratuito de Render sólo sirve el segundo:
      # el plan gratuito bloquea la salida SMTP y connect() devuelve
      # "[Errno 101] Network is unreachable" antes de intentar autenticarse, así
      # que ninguna credencial de Gmail funciona ahí. El puerto 443 sí sale.
      #
      #   Por HTTPS (recomendado acá): EMAIL_PROVIDER=brevo|sendgrid,
      #   EMAIL_API_KEY y MAIL_FROM. Los dos proveedores permiten verificar una
      #   dirección suelta como remitente, sin dominio propio.
      #
      #   Por SMTP (necesita salida SMTP abierta): SMTP_USER y SMTP_PASSWORD,
      #   más SMTP_HOST y SMTP_PORT si no es Gmail en 587.
      #
      # Todas se definen en el dashboard de Render, no acá:
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: MAIL_FROM
      #   sync: false
