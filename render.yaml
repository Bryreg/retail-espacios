databases:
  - name: retail-db
    databaseName: retail_espacios
    user: retail_user

services:
  - type: web
    name: retail-espacios
    runtime: docker
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retail-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
