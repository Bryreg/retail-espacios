databases:
  - name: retail-db
    databaseName: retail_espacios
    user: retail_user

# Plan: el gratuito, hasta justo antes del lanzamiento comercial (decisión del
# dueño, 2026-10-30). No se declara `plan:` a propósito: el servicio se creó a
# mano en el panel y un `plan:` acá, al sincronizar el Blueprint, lo cambiaría.
# Lo que se prepara para el plan pago está comentado más abajo, con su porqué.
# Staging: `render.staging.yaml` (otro Blueprint, plan gratuito; ver
# docs/operacion.md). Operación diaria —respaldo, mantenimiento, restaurar—:
# docs/operacion.md.

services:
  - type: web
    name: retail-espacios
    runtime: docker
    branch: main
    # Producción espera al CI (auditoría P1-1): Render despliega un commit de
    # `main` sólo cuando TODOS sus checks de GitHub pasaron (deploy.yml:
    # frontend y backend; el job del VPS se saltea). Con `commit` —el valor por
    # defecto— desplegaba antes de que terminara pytest (~25 min), y un commit
    # en rojo llegaba igual a producción. Ojo: en un servicio creado a mano el
    # Blueprint puede no estar sincronizado; el mismo ajuste está en el panel,
    # Settings → Build & Deploy → Auto-Deploy → «After CI Checks Pass».
    autoDeployTrigger: checksPass
    # Readiness (auditoría P1-3): `SELECT 1` contra el registro. Una instancia
    # nueva que no llega a la base no recibe tráfico y la anterior sigue
    # atendiendo. `/api/health` queda como liveness (no toca la base).
    healthCheckPath: /api/health/ready
    # Migraciones (auditoría P1-8). El pre-deploy es de los planes PAGOS: en el
    # gratuito las corre el arranque, antes de atender, con un advisory lock
    # (`app/migraciones.py`). Al pasar a un plan pago, descomentar: el arranque
    # encuentra todo al día y no hace nada.
    # preDeployCommand: python -m app.migraciones
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retail-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      # La firma de las sesiones. UNA verdad (auditoría P3-13): se pone A MANO
      # en el panel de Render (Environment), con un valor aleatorio de 32 bytes
      # o más (`openssl rand -base64 48`), y no viene del Blueprint. Antes decía
      # `generateValue: true`, que sólo genera al CREAR el servicio desde el
      # Blueprint —este se creó a mano— y contradecía a docs/ESTADO.md.
      # Cambiarla cierra todas las sesiones abiertas.
      - key: JWT_SECRET
        sync: false
      # El cron de mantenimiento (auditoría P1-5): el mismo valor que el secret
      # MANTENIMIENTO_TOKEN del repo en GitHub. Sin ella, el endpoint
      # `POST /api/interno/mantenimiento` no existe (404) y el mantenimiento
      # corre sólo en el hilo de la app, mientras esté despierta.
      - key: MANTENIMIENTO_TOKEN
        sync: false
      # Observabilidad (auditoría P1-3), las dos opcionales: SENTRY_DSN manda
      # los errores a Sentry (sin la variable, nada); LOG_LEVEL (INFO por
      # defecto) y LOG_FORMAT=texto si se quiere el log sin JSON.
      - key: SENTRY_DSN
        sync: false
      # La cuota de la base en MB (auditoría P2-6): el mantenimiento avisa con
      # un WARNING desde el 70 %. 1024 es la base gratuita de Render; poné la
      # del plan contratado al cambiarlo.
      - key: CUOTA_BASE_MB
        value: "1024"
      # El tope de cada consulta en Postgres, en segundos (auditoría P2-10).
      # 30 por defecto; 0 lo apaga.
      - key: STATEMENT_TIMEOUT_S
        value: "30"
      # Identidad (Fase 1): login con Google/correo vía Firebase Auth.
      # Es la ÚNICA puerta: sin FIREBASE_PROJECT_ID el endpoint /api/auth/oauth
      # responde 503 y nadie entra (la clave compartida está apagada, ver
      # LOGIN_LEGADO abajo). Las VITE_* son config PÚBLICA del cliente (no son
      # secretos) pero Vite las hornea EN EL BUILD: tienen que estar definidas
      # cuando corre el build del Docker, no solo en runtime.
      # Valores del proyecto Firebase "recabra":
      #   FIREBASE_PROJECT_ID=recabra
      #   VITE_FIREBASE_API_KEY=<apiKey de la consola>
      #   VITE_FIREBASE_AUTH_DOMAIN=recabra.firebaseapp.com
      #   VITE_FIREBASE_PROJECT_ID=recabra
      # Y en Firebase: Authentication → Settings → dominios autorizados debe
      # incluir retail-espacios.onrender.com o el popup de Google se rechaza.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      # Fase 2: correos (separados por coma) de los operadores de plataforma —
      # quienes mueven el estado de cuenta de los clientes desde el panel.
      # Solo aplica a cuentas con sub (el login legado jamás es operador).
      - key: OPERADOR_EMAILS
        sync: false
      # Cobro de la suscripción (C2). COBRANZA_AUTOMATICA prende la escalera
      # automática (avisos por correo y sólo lectura a los 30 días de vencida la
      # cuenta de cobro —nunca antes de 10 días después del aviso formal
      # entregado—, nunca suspensión): vacía, en 0 o con cualquier valor que no
      # sea 1/true/sí/on, cada pasada sólo ENSAYA y deja en el log una línea con
      # lo que haría. Se prende con 1. Ver docs/ESTADO.md, «Cobro de la
      # suscripción (2026-10-13)».
      # COBRO_INSTRUCCIONES_TRANSFERENCIA es el texto con los datos para
      # transferir (banco, tipo y número de cuenta, titular, NIT) que ven la
      # dueña de un supermercado CON suscripción y los correos de cobranza: un
      # dato bancario no se escribe en el repo. Sin ella, la pantalla dice que se
      # comuniquen con RECABRA.
      - key: COBRANZA_AUTOMATICA
        sync: false
      - key: COBRO_INSTRUCCIONES_TRANSFERENCIA
        sync: false
      # El acceso por clave compartida (POST /api/auth/login) está APAGADO
      # desde 2026-10-01: se entra sólo con Google/correo. LOGIN_LEGADO=1 lo
      # prende, sólo como emergencia si Firebase no deja entrar a nadie — con
      # él prendido, quien sepa ADMIN_PASSWORD entra como admin a cualquier
      # supermercado fundado por el alta. No se declara acá a propósito.
      # Correo. DOS caminos, y en el plan gratuito de Render sólo sirve el segundo:
      # el plan gratuito bloquea la salida SMTP y connect() devuelve
      # "[Errno 101] Network is unreachable" antes de intentar autenticarse, así
      # que ninguna credencial de Gmail funciona ahí. El puerto 443 sí sale.
      #
      #   Por HTTPS (recomendado acá): EMAIL_PROVIDER=brevo|sendgrid,
      #   EMAIL_API_KEY y MAIL_FROM. Los dos proveedores permiten verificar una
      #   dirección suelta como remitente, sin dominio propio.
      #
      #   Por SMTP (necesita salida SMTP abierta): SMTP_USER y SMTP_PASSWORD,
      #   más SMTP_HOST y SMTP_PORT si no es Gmail en 587.
      #
      # Todas se definen en el dashboard de Render, no acá:
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: MAIL_FROM
      #   sync: false
