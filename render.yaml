# Preview Environments (Blueprint): cada PR con la etiqueta `render-preview` o
# `[render preview]` en el título levanta una copia completa — servicio + una
# Postgres NUEVA Y VACÍA (la de producción no se toca) — con URL propia, que se
# destruye sola al mergear/cerrar el PR. Requiere workspace Pro; en el plan
# gratuito este bloque es inerte. OJO: esto NO es el toggle "Pull Request
# Previews" de la pestaña Previews del servicio — ESE copia DATABASE_URL de
# producción tal cual y no hay que activarlo.
previews:
  generation: manual
  expireAfterDays: 7

databases:
  - name: retail-db
    databaseName: retail_espacios
    user: retail_user
    # Plan de la Postgres de cada preview (prorrateada por segundo mientras
    # viva; la libre puede chocar con el límite de una gratuita por workspace).
    previewPlan: basic-256mb

services:
  - type: web
    name: retail-espacios
    runtime: docker
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retail-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Sólo para previews: la base nace vacía y una instalación nueva inventa
      # las claves al azar — con esto todo preview entra con claves conocidas.
      # En producción estas dos siguen viniendo del dashboard (sync: false).
      - key: ADMIN_PASSWORD
        sync: false
        previewValue: preview-admin
      - key: WORKER_PASSWORD
        sync: false
        previewValue: preview-worker
      # Correo. DOS caminos, y en el plan gratuito de Render sólo sirve el segundo:
      # el plan gratuito bloquea la salida SMTP y connect() devuelve
      # "[Errno 101] Network is unreachable" antes de intentar autenticarse, así
      # que ninguna credencial de Gmail funciona ahí. El puerto 443 sí sale.
      #
      #   Por HTTPS (recomendado acá): EMAIL_PROVIDER=brevo|sendgrid,
      #   EMAIL_API_KEY y MAIL_FROM. Los dos proveedores permiten verificar una
      #   dirección suelta como remitente, sin dominio propio.
      #
      #   Por SMTP (necesita salida SMTP abierta): SMTP_USER y SMTP_PASSWORD,
      #   más SMTP_HOST y SMTP_PORT si no es Gmail en 587.
      #
      # Todas se definen en el dashboard de Render, no acá:
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: MAIL_FROM
      #   sync: false
