databases:
  - name: retail-db
    databaseName: retail_espacios
    user: retail_user

services:
  - type: web
    name: retail-espacios
    runtime: docker
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retail-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Notificaciones — descomentar y definir los valores en el dashboard de Render:
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: MAIL_FROM
      #   sync: false
