<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RECABRA · El tablero de asesoría</title>
<style>
/* ===========================================================================
   RECABRA · Plataforma — opción B «El tablero de asesoría»
   Tokens copiados literalmente de frontend/src/tema.css (capa 2, semánticos).
   Se agregan DOS tokens nuevos y sólo dos: --dato y --dato-tenue, la tinta de
   dato. Ver README §4 para la corrida del validador que los sostiene.
   =========================================================================== */
:root{
  /* superficies */
  --bg:#EFF1ED; --surface:#FFFFFF; --surface-2:#F7F8F5; --surface-3:#E4E7E1;
  /* líneas */
  --line-soft:#F0F1F1; --line:#DDDEDE; --line-strong:#BBBCBE;
  /* tinta de texto (ink-4 #68788A NO se usa como texto: 3,98:1 sobre el papel) */
  --ink-1:#0A1014; --ink-2:#4A5B65; --ink-3:#54646E;
  /* acción principal — un solo amarillo por pantalla */
  --signal:#F2B300; --on-signal:#120E00; --signal-ink:#8A6100; --signal-borde:#A87C00;
  /* los cuatro estados del espacio */
  --libre:#00805A;   --libre-suave:#E0F0EB;   --libre-borde:#9ECFC0;   --libre-txt:#006B4C;
  --entra:#CE8A0A;   --entra-suave:#F9F1E2;   --entra-borde:#ECD3A2;   --entra-txt:#8A5A06;
  --ocupado:#D8342E; --ocupado-suave:#FAE7E6; --ocupado-borde:#F0B2B0; --ocupado-txt:#B32720;
  --resto:#AAB3BE;   --resto-suave:#ECEEF1;   --resto-borde:#D5D9DF;
  /* tinta de dato (nueva) */
  --dato:#2E63C8; --dato-tenue:#7FA8EC; --dato-suave:#EAF0FB;
  /* tipografía */
  --f-display:"Helvetica Neue","Segoe UI Variable Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --f-text:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --t-3xs:10px; --t-2xs:11.5px; --t-xs:12.5px; --t-sm:13.5px; --t-base:15px;
  --t-md:17.5px; --t-lg:21px; --t-xl:30px; --t-hero:48px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(16,21,30,.07);
  --sh-2:0 10px 28px -14px rgba(16,21,30,.24), 0 2px 6px rgba(16,21,30,.05);
  color-scheme:light;
}
html[data-tema="oscuro"]{
  --bg:#04070A; --surface:#0B1116; --surface-2:#101820; --surface-3:#16212A;
  --line-soft:#1A1F24; --line:#262B30; --line-strong:#3E4347;
  --ink-1:#EDF3F2; --ink-2:#9DAEB6; --ink-3:#788A94;
  --signal:#FFD028; --on-signal:#0A0C06; --signal-ink:#FFD028; --signal-borde:transparent;
  --libre:#00BE86;   --libre-suave:#092D28;   --libre-borde:#065A45;   --libre-txt:#00BE86;
  --entra:#F5A524;   --entra-suave:#302918;   --entra-borde:#6D4F1C;   --entra-txt:#F5A524;
  --ocupado:#F4544E; --ocupado-suave:#301C1F; --ocupado-borde:#6D2D2E; --ocupado-txt:#F4544E;
  --resto:#33414F;   --resto-suave:#1B242D;   --resto-borde:#293541;
  --dato:#4C89E8; --dato-tenue:#2F5EA6; --dato-suave:#131E2E;
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 12px 34px -14px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink-1);
  font:var(--t-sm)/1.45 var(--f-text);
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
h1,h2,h3,h4,p,ul,ol,figure,table{margin:0}
ul,ol{padding:0; list-style:none}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
a{color:inherit}
table{border-collapse:collapse; width:100%}
:focus-visible{outline:2px solid var(--signal-ink); outline-offset:2px; border-radius:var(--r-xs)}

/* ---------- utilidades tipográficas ---------- */
.rotulo{font-size:var(--t-3xs); letter-spacing:.10em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
.cifra{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.cifra-suelta{font-family:var(--f-text); font-variant-numeric:proportional-nums; letter-spacing:-.02em}
.muted{color:var(--ink-3)}
.sec{color:var(--ink-2)}
.xs{font-size:var(--t-xs)} .xxs{font-size:var(--t-2xs)} .sm{font-size:var(--t-sm)}
.tachado{text-decoration:line-through; text-decoration-thickness:1px; color:var(--ink-3)}
.nowrap{white-space:nowrap}

/* ---------- barra superior ---------- */
.barra{
  flex:0 0 auto; height:52px; display:flex; align-items:center; gap:var(--s4);
  padding:0 var(--s5); background:var(--surface); border-bottom:1px solid var(--line);
  position:relative; z-index:5;
}
.marca{font-family:var(--f-display); font-weight:800; letter-spacing:.02em; font-size:var(--t-base)}
.marca span{font-weight:500; color:var(--ink-3); letter-spacing:0; margin-left:.4em; font-family:var(--f-text)}
.piezas{display:flex; gap:2px; background:var(--surface-3); padding:3px; border-radius:var(--r-pill)}
.piezas button{
  padding:5px 14px; border-radius:var(--r-pill); font-size:var(--t-xs); font-weight:600; color:var(--ink-2);
}
.piezas button[aria-current="true"]{background:var(--surface); color:var(--ink-1); box-shadow:var(--sh-1)}
.barra .der{margin-left:auto; display:flex; align-items:center; gap:var(--s3)}
.sel{
  font-size:var(--t-xs); padding:5px 8px; border:1px solid var(--line-strong); border-radius:var(--r-sm);
  background:var(--surface); color:var(--ink-1); font-family:var(--f-mono);
}
.chip-parcial{
  font-size:var(--t-2xs); font-weight:700; padding:3px 8px; border-radius:var(--r-pill);
  background:var(--surface-3); color:var(--ink-2); border:1px solid var(--line-strong);
}
.tema-btn{border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:5px 10px; font-size:var(--t-xs); color:var(--ink-2)}

/* ---------- estructura de piezas ---------- */
.pieza{flex:1 1 auto; min-height:0; display:none; flex-direction:column}
.pieza[data-activa="1"]{display:flex}

/* ---------- tarjeta / bloque ---------- */
.tarjeta{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:var(--s4); display:flex; flex-direction:column; gap:var(--s3); min-width:0;
}
.conclusion{font-size:var(--t-sm); line-height:1.5; color:var(--ink-1); max-width:104ch}
.conclusion b{font-weight:700}
.conclusion .n{font-family:var(--f-mono); font-weight:700; font-variant-numeric:tabular-nums}
.titulo-bloque{display:flex; align-items:baseline; gap:var(--s2); justify-content:space-between}
.tabla-equiv{font-size:var(--t-2xs); margin-top:var(--s1)}
.tabla-equiv summary{color:var(--ink-3); cursor:pointer; font-weight:600; padding:2px 0; width:max-content}
.tabla-equiv summary:hover{color:var(--ink-1)}
.tabla-equiv table{margin-top:var(--s2); font-size:var(--t-2xs)}
.tabla-equiv th,.tabla-equiv td{text-align:right; padding:3px 6px; border-bottom:1px solid var(--line-soft); white-space:nowrap}
.tabla-equiv th:first-child,.tabla-equiv td:first-child{text-align:left}
.tabla-equiv thead th{color:var(--ink-3); font-weight:700; border-bottom:1px solid var(--line)}
.tabla-equiv td.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.tabla-equiv .cont{max-height:220px; overflow:auto}

/* ---------- cifras ---------- */
.hero{font-family:var(--f-display); font-weight:800; font-size:var(--t-hero); line-height:1;
      letter-spacing:-.025em; font-variant-numeric:proportional-nums}
.tile{display:flex; flex-direction:column; gap:2px; min-width:0}
.tile .v{font-family:var(--f-display); font-weight:800; font-size:var(--t-lg); line-height:1.1; letter-spacing:-.02em}
.tile .contra{font-size:var(--t-2xs); color:var(--ink-2); line-height:1.35}
.delta{font-family:var(--f-mono); font-weight:700; font-variant-numeric:tabular-nums}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s4)}
.kpis>*{padding-left:var(--s4); border-left:1px solid var(--line)}
.kpis>*:first-child{padding-left:0; border-left:0}

/* ---------- chips de estado / señal ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; font-size:var(--t-2xs); font-weight:700;
      padding:2px 8px; border-radius:var(--r-pill); border:1px solid var(--line); color:var(--ink-2); background:var(--surface-2)}
.chip .punto{width:8px; height:8px; border-radius:2px; flex:0 0 auto}
.chip.libre{background:var(--libre-suave); border-color:var(--libre-borde); color:var(--libre-txt)}
.chip.entra{background:var(--entra-suave); border-color:var(--entra-borde); color:var(--entra-txt)}
.chip.ocupado{background:var(--ocupado-suave); border-color:var(--ocupado-borde); color:var(--ocupado-txt)}
.chip.resto{background:var(--resto-suave); border-color:var(--resto-borde); color:var(--ink-2)}
.chip.dato{background:var(--dato-suave); border-color:var(--dato-tenue); color:var(--ink-2)}

/* ---------- botón de acción principal (UN amarillo por pantalla) ---------- */
.accion{
  background:var(--signal); color:var(--on-signal); border:1px solid var(--signal-borde);
  font-weight:700; font-size:var(--t-xs); padding:7px 14px; border-radius:var(--r-sm);
  display:inline-flex; align-items:center; gap:6px; box-shadow:var(--sh-1);
}
.accion:hover{filter:brightness(1.04)}
.accion-2{border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:6px 12px;
          font-size:var(--t-xs); font-weight:600; color:var(--ink-1); background:var(--surface)}
.accion-2:hover{background:var(--surface-2)}

/* ---------- gráficos: piezas comunes ---------- */
svg{display:block; overflow:visible}
.fila-graf{display:grid; align-items:center; gap:var(--s3); min-width:0}
.fila-graf .et{font-size:var(--t-xs); color:var(--ink-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fila-graf .val{font-family:var(--f-mono); font-size:var(--t-2xs); font-variant-numeric:tabular-nums;
                text-align:right; white-space:nowrap; color:var(--ink-2)}
.leyenda{display:flex; flex-wrap:wrap; gap:var(--s3); font-size:var(--t-2xs); color:var(--ink-2)}
.leyenda span{display:inline-flex; align-items:center; gap:5px}
.leyenda i{width:10px; height:10px; border-radius:2px; display:inline-block}
.eje-meses{display:grid; grid-template-columns:repeat(12,1fr); font-size:var(--t-3xs); color:var(--ink-3);
           font-family:var(--f-mono); text-align:center; margin-top:2px}
.eje-meses span{overflow:hidden}
.eje-meses .act{color:var(--ink-1); font-weight:700}
.nota-graf{font-size:var(--t-2xs); color:var(--ink-3)}
.anot{position:absolute; font-size:var(--t-2xs); line-height:1.25; background:var(--surface);
      border:1px solid var(--line); border-left:2px solid var(--dato); border-radius:var(--r-xs);
      padding:2px 6px; color:var(--ink-2); max-width:190px; box-shadow:var(--sh-1)}
.anot b{color:var(--ink-1)}
.plot{position:relative}

/* ---------- unidades (una marca por espacio) ---------- */
.unid-fila{display:grid; grid-template-columns:96px 1fr auto; gap:var(--s3); align-items:center}
.unid-caja{display:flex; flex-wrap:wrap; gap:2px; align-content:center}
.u{border-radius:1.5px}
.u.ocupado{background:var(--ocupado)}
.u.libre{background:var(--libre)}
.u.se_libera{background:var(--entra)}

/* ---------- CARTERA ---------- */
.cartera-grid{
  flex:1 1 auto; min-height:0; display:grid; gap:var(--s3); padding:var(--s3) var(--s5) var(--s3);
  grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"titular titular" "cola lado";
}
.a-titular{grid-area:titular} .a-cola{grid-area:cola} .a-lado{grid-area:lado}
.a-cola,.a-lado{min-height:0; overflow:auto}
.a-cola{gap:10px}
.a-lado{display:flex; flex-direction:column; gap:var(--s3); background:transparent; border:0; padding:0}
.titular-band{display:grid; grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr) minmax(0,1.3fr);
               gap:var(--s5); align-items:start}
.titular-band>*+*{padding-left:var(--s5); border-left:1px solid var(--line)}
.correccion{display:grid; grid-template-columns:auto auto auto; gap:2px var(--s4); font-size:var(--t-2xs);
            border-top:1px solid var(--line-soft); padding-top:var(--s2); margin-top:var(--s2)}
.correccion .h{color:var(--ink-3); font-weight:700}
.correccion .v{font-family:var(--f-mono); font-variant-numeric:tabular-nums; text-align:right}

.cola-lista{display:flex; flex-direction:column}
.cola-fila{
  display:grid; grid-template-columns:22px minmax(190px,1fr) minmax(0,1.5fr) 162px;
  gap:var(--s3); align-items:center; padding:7px var(--s2); border-top:1px solid var(--line-soft);
}
.cola-fila:hover{background:var(--surface-2)}
.cola-fila .puesto{font-family:var(--f-mono); font-size:var(--t-md); font-weight:700; color:var(--ink-3); text-align:right}
.cola-fila.p1 .puesto{color:var(--ink-1)}
.cola-fila .nom{display:grid; grid-template-columns:auto auto; gap:2px 8px; align-items:center; justify-content:start}
.cola-fila .nom .nb{font-weight:700; font-size:var(--t-sm)}
.cola-fila .nom .xxs{grid-column:1 / -1; line-height:1.3}
.cola-fila .razon{font-size:var(--t-xs); color:var(--ink-2); line-height:1.35}
.cola-fila .acc-col{display:flex; flex-direction:column; align-items:flex-end; gap:5px}
.cola-fila .plata{text-align:right; font-family:var(--f-mono); font-size:var(--t-xs); font-variant-numeric:tabular-nums}
.cola-fila .plata em{display:block; font-style:normal; font-size:var(--t-3xs); color:var(--ink-3); font-family:var(--f-text)}
.regla-orden{font-size:var(--t-2xs); color:var(--ink-2); background:var(--surface-2);
             border:1px solid var(--line); border-radius:var(--r-sm); padding:6px 10px}

/* ---------- SESIÓN ---------- */
.sesion{flex:1 1 auto; min-height:0; display:grid; grid-template-columns:216px minmax(0,1fr)}
.rail{
  border-right:1px solid var(--line); background:var(--surface); padding:var(--s3);
  display:flex; flex-direction:column; gap:var(--s3); overflow:auto;
}
.rail .quien{display:flex; flex-direction:column; gap:6px; padding-bottom:var(--s3); border-bottom:1px solid var(--line)}
.rail .quien .nb{font-size:var(--t-md); font-weight:800; letter-spacing:-.01em}
.caps{display:flex; flex-direction:column; gap:2px}
.caps button{
  display:grid; grid-template-columns:18px 1fr; gap:8px; align-items:baseline; text-align:left;
  padding:8px 10px; border-radius:var(--r-sm); color:var(--ink-2); font-size:var(--t-xs);
}
.caps button .k{font-family:var(--f-mono); font-size:var(--t-2xs); color:var(--ink-3)}
.caps button .t{font-weight:600}
.caps button .d{grid-column:2; font-size:var(--t-2xs); color:var(--ink-3); line-height:1.3}
.caps button:hover{background:var(--surface-2)}
.caps button[aria-current="true"]{background:var(--surface-3); color:var(--ink-1)}
.caps button[aria-current="true"] .k{color:var(--ink-1)}
.cap-pane{min-height:0; overflow:auto; padding:var(--s4) var(--s5) var(--s6); display:none; flex-direction:column; gap:var(--s3)}
.cap-pane[data-activa="1"]{display:flex}
.cap-cab{display:flex; align-items:baseline; gap:var(--s3); justify-content:space-between}
.cap-cab h2{font-size:var(--t-lg); font-weight:800; letter-spacing:-.02em}
.cols-2{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:var(--s3); align-items:start}
.cols-2b{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s3); align-items:start}

/* hallazgos */
.hall{display:grid; gap:var(--s3); grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.hall .ancho{grid-column:1 / -1}
.hall h3{font-size:var(--t-xs); font-weight:700; color:var(--ink-3); letter-spacing:.04em; text-transform:uppercase}
/* el aviso no usa el ámbar: el ámbar es el estado «se libera», y sólo eso */
.aviso{
  border:1px solid var(--line-strong); border-left:3px solid var(--ink-1); background:var(--surface-2);
  border-radius:var(--r-md); padding:var(--s3) var(--s4); display:flex; flex-direction:column; gap:6px;
}
.aviso h3{color:var(--ink-1)}

/* recomendaciones */
.grupo-prio{display:flex; flex-direction:column; gap:2px}
.grupo-prio>.cab{display:flex; align-items:baseline; gap:var(--s2); padding:var(--s3) 0 var(--s2)}
.grupo-prio>.cab .p{font-size:var(--t-xs); font-weight:800; letter-spacing:.06em; text-transform:uppercase}
.rec{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); overflow:hidden}
.rec+.rec{margin-top:6px}
.rec>summary{display:grid; grid-template-columns:22px minmax(0,1fr) 150px 16px; gap:var(--s3);
             align-items:center; padding:10px var(--s3); cursor:pointer; list-style:none}
.rec>summary::-webkit-details-marker{display:none}
.rec>summary:hover{background:var(--surface-2)}
.rec .idx{font-family:var(--f-mono); font-size:var(--t-2xs); color:var(--ink-3); text-align:right}
.rec .acc{font-size:var(--t-sm); font-weight:700; line-height:1.35}
.rec .ev{font-size:var(--t-2xs); color:var(--ink-2); line-height:1.35; margin-top:2px}
.rec .vale{text-align:right; font-family:var(--f-mono); font-weight:700; font-variant-numeric:tabular-nums; font-size:var(--t-sm)}
.rec .vale em{display:block; font-style:normal; font-weight:400; font-size:var(--t-3xs); color:var(--ink-3); font-family:var(--f-text)}
.rec .fl{color:var(--ink-3); transition:transform .14s}
.rec[open] .fl{transform:rotate(90deg)}
.rec .cuerpo{border-top:1px solid var(--line-soft); padding:var(--s3); display:flex; flex-direction:column; gap:var(--s3); background:var(--surface-2)}
.escalon{display:flex; flex-direction:column; gap:4px}
.escalon .et{font-size:var(--t-3xs); letter-spacing:.10em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
.cands{display:flex; flex-wrap:wrap; gap:6px}
.cand{border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm); padding:5px 9px; font-size:var(--t-2xs)}
.cand b{display:block; font-size:var(--t-xs)}
.cand.ojo{border-color:var(--line-strong); border-left:3px solid var(--ink-1); background:var(--surface-3); color:var(--ink-1)}
.codigos{display:flex; flex-direction:column; gap:4px}
.codigos details{border:1px solid var(--line); border-radius:var(--r-xs); background:var(--surface)}
.codigos summary{padding:5px 9px; font-size:var(--t-2xs); cursor:pointer; font-weight:600}
.codigos .lista{padding:4px 9px 8px; display:flex; flex-wrap:wrap; gap:3px; max-height:130px; overflow:auto}
.codigos code{font-family:var(--f-mono); font-size:var(--t-3xs); background:var(--surface-2);
              border:1px solid var(--line-soft); border-radius:3px; padding:1px 4px; color:var(--ink-2)}

/* datos detrás */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.tabs button{padding:7px 12px; font-size:var(--t-xs); font-weight:600; color:var(--ink-3); border-bottom:2px solid transparent; margin-bottom:-1px}
.tabs button[aria-current="true"]{color:var(--ink-1); border-bottom-color:var(--ink-1)}
.filtros{display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; padding:var(--s2) 0}
.filtros input,.filtros select{
  font:var(--t-xs)/1.4 var(--f-text); padding:5px 8px; border:1px solid var(--line-strong);
  border-radius:var(--r-sm); background:var(--surface); color:var(--ink-1);
}
.tabla-datos{font-size:var(--t-2xs)}
.tabla-datos th,.tabla-datos td{padding:5px 8px; border-bottom:1px solid var(--line-soft); text-align:left; white-space:nowrap}
.tabla-datos thead th{position:sticky; top:0; background:var(--surface); color:var(--ink-3); font-weight:700;
                      border-bottom:1px solid var(--line); z-index:1; text-align:left}
.tabla-datos td.num,.tabla-datos th.num{text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.tabla-datos tbody tr:hover{background:var(--surface-2)}
.caja-tabla{overflow:auto; max-height:min(56vh,520px); border:1px solid var(--line); border-radius:var(--r-sm)}

/* procedencia */
.proc{display:grid; grid-template-columns:170px minmax(0,1fr); gap:6px var(--s4); font-size:var(--t-xs)}
.proc dt{color:var(--ink-3); font-weight:700}
.proc dd{margin:0; color:var(--ink-1)}

/* ---------- INFORME ---------- */
.informe-wrap{flex:1 1 auto; min-height:0; overflow:auto; padding:var(--s5) var(--s4) var(--s7); background:var(--bg)}
.hoja{
  max-width:820px; margin:0 auto; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-md); padding:var(--s7) 56px var(--s6); display:flex; flex-direction:column; gap:var(--s5);
  box-shadow:var(--sh-2);
}
.hoja h1{font-family:var(--f-display); font-size:26px; font-weight:800; letter-spacing:-.02em}
.hoja h2{font-size:var(--t-base); font-weight:800; letter-spacing:-.01em; padding-bottom:6px; border-bottom:1px solid var(--line)}
.hoja .kicker{font-size:var(--t-2xs); letter-spacing:.10em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
.hoja section{display:flex; flex-direction:column; gap:var(--s3)}
.hoja .pie{border-top:1px solid var(--line); padding-top:var(--s3); font-size:var(--t-2xs); color:var(--ink-3); display:flex; flex-wrap:wrap; gap:var(--s4)}
.acciones-informe{display:flex; flex-direction:column; gap:var(--s2)}
.acc-inf{display:grid; grid-template-columns:20px minmax(0,1fr) 145px; gap:var(--s3); align-items:baseline;
         border-top:1px solid var(--line-soft); padding:9px 0}
.acc-inf .i{font-family:var(--f-mono); color:var(--ink-3); font-size:var(--t-xs)}
.acc-inf .q{font-size:var(--t-sm); font-weight:700}
.acc-inf .p{font-size:var(--t-2xs); color:var(--ink-2); margin-top:2px; line-height:1.4}
.acc-inf .v{text-align:right; font-family:var(--f-mono); font-weight:700; font-variant-numeric:tabular-nums}
.acc-inf .v em{display:block; font-style:normal; font-weight:400; font-size:var(--t-3xs); color:var(--ink-3); font-family:var(--f-text)}

/* ---------- responsive ---------- */
@media (max-width:1400px){
  .cartera-grid{padding:var(--s3) var(--s4); gap:10px}
  .cap-pane{padding:var(--s3) var(--s4) var(--s6)}
  :root{--t-hero:40px}
  .tarjeta{padding:14px; gap:10px}
  .titular-band{gap:var(--s4)}
  .titular-band>*+*{padding-left:var(--s4)}
}
@media (max-width:1120px){
  body{overflow:auto; height:auto; min-height:100%}
  .pieza[data-activa="1"]{display:block}
  .cartera-grid{grid-template-columns:1fr; grid-template-rows:none;
                grid-template-areas:"titular" "cola" "lado"}
  .a-cola,.a-lado{overflow:visible}
  .titular-band{grid-template-columns:1fr}
  .sesion{grid-template-columns:1fr}
  .rail{border-right:0; border-bottom:1px solid var(--line)}
  .cap-pane{overflow:visible}
  .cols-2,.cols-2b,.hall{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpis>*:nth-child(3){padding-left:0; border-left:0}
  .informe-wrap{overflow:visible}
}
@media (max-width:720px){
  .barra{height:auto; flex-wrap:wrap; padding:var(--s2) var(--s3); gap:var(--s2)}
  .cola-fila{grid-template-columns:22px minmax(0,1fr); grid-auto-flow:row}
  .cola-fila .razon,.cola-fila .plata,.cola-fila .senal,.cola-fila .ir{grid-column:2}
  .cola-fila .plata{text-align:left}
  .kpis{grid-template-columns:1fr}
  .kpis>*{padding-left:0; border-left:0}
  .hoja{padding:var(--s5) var(--s4)}
  .rec>summary{grid-template-columns:20px minmax(0,1fr); }
  .rec .vale{grid-column:2; text-align:left}
  .rec .fl{display:none}
  .unid-fila{grid-template-columns:80px 1fr; }
  .unid-fila .val{grid-column:2; text-align:left}
}
@media print{
  body{overflow:visible; height:auto; background:#fff}
  .barra,.piezas,.pieza:not([data-activa="1"]),.no-print{display:none !important}
  .informe-wrap{overflow:visible; padding:0; background:#fff}
  .hoja{box-shadow:none; border:0; max-width:none; padding:0}
  .hoja section{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}

/* ---------- marcas de gráfico hechas con cajas (escalan sin distorsión) ---- */
/* barra: <= 24px de grosor, extremo del dato redondeado, base recta */
.barra-pista{width:100%; background:var(--surface-3); border-radius:var(--r-xs); overflow:hidden}
.barra-total{height:100%; border-radius:0 var(--r-xs) var(--r-xs) 0; position:relative; min-width:2px}
.barra-rel{height:100%; border-radius:0; position:absolute; inset:0 auto 0 0}
/* 2px de aire del color de la superficie entre relleno y resto */
.barra-rel::after{content:""; position:absolute; right:-2px; top:0; bottom:0; width:2px; background:var(--surface)}

.plot-umbral{position:relative; display:flex; flex-direction:column; gap:5px; padding-top:14px}
.plot-umbral .umbral{position:absolute; top:14px; bottom:0; width:1px; background:var(--ink-1); opacity:.55}
.plot-umbral .umbral-et{position:absolute; top:0; font-size:var(--t-3xs); color:var(--ink-3);
                        font-weight:700; transform:translateX(-50%); white-space:nowrap}

.dumb{position:relative; height:16px}
.dumb::before{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--line); transform:translateY(-.5px)}
.dumb-linea{position:absolute; top:50%; height:3px; background:var(--dato-tenue); transform:translateY(-1.5px); border-radius:2px}
.dumb-pt{position:absolute; top:50%; width:11px; height:11px; border-radius:50%; transform:translate(-50%,-50%);
         box-shadow:0 0 0 2px var(--surface)}
.dumb-pt.cli{background:var(--dato)}
.dumb-pt.bench{background:var(--surface); border:2px solid var(--ink-1)}

.eje-cero{position:relative; height:16px}
.eje-cero::before{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--line)}
.eje-cero .cero{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--ink-1)}
.pt-dato{position:absolute; top:50%; width:11px; height:11px; border-radius:50%; background:var(--dato);
         transform:translate(-50%,-50%); box-shadow:0 0 0 2px var(--surface)}
.eje-num{position:relative; height:14px; font-size:var(--t-3xs); color:var(--ink-3); font-family:var(--f-mono)}
.eje-num>span{position:absolute; transform:translateX(-50%); top:0}

.riel{position:relative; padding-top:4px}
.riel-pista{position:relative; height:26px; background:var(--surface-3); border-radius:var(--r-xs)}
.riel-marca{position:absolute; top:4px; width:9px; height:18px; border-radius:2px; background:var(--dato-tenue); transform:translateX(-50%)}
.riel-marca.urg{background:var(--dato)}
.riel-corte{position:absolute; top:-3px; bottom:-3px; width:1px; background:var(--ink-1)}
.riel-et{position:relative; height:15px; margin-top:3px; font-size:var(--t-3xs); color:var(--ink-3); font-family:var(--f-mono)}
.riel-et>span{position:absolute; top:0; white-space:nowrap}
.riel-et>span:nth-child(2){transform:translateX(-50%)}

.medidor{position:relative; height:18px; background:var(--surface-3); border-radius:var(--r-xs); margin:6px 0 4px}
.medidor .rel{position:absolute; inset:0 auto 0 0; background:var(--dato); border-radius:var(--r-xs) 0 0 var(--r-xs)}
.medidor .ref{position:absolute; top:-5px; bottom:-5px; width:2px; background:var(--ink-1)}
.medidor-et{position:relative; height:14px; font-size:var(--t-3xs); color:var(--ink-3); font-family:var(--f-mono)}
.medidor-et>span{position:absolute; top:0; white-space:nowrap}

.mini-comp{position:relative; height:16px; margin:4px 0}
.mini-comp::before{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--line)}

/* ---------- piezas sueltas ------------------------------------------------ */
.corte-cola{position:relative; text-align:center; margin:10px 0 2px}
.corte-cola::before{content:""; position:absolute; left:0; right:0; top:50%; border-top:1px dashed var(--line-strong)}
.corte-cola span{position:relative; background:var(--surface); padding:0 10px; font-size:var(--t-3xs);
                 letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:700}

.adopcion-linea{display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; font-size:var(--t-2xs); color:var(--ink-2)}
.clase-cuenta{display:inline-flex; align-items:center; gap:4px}

.cambia-cli button{flex:1; padding:5px 6px; font-size:var(--t-2xs); font-weight:600; color:var(--ink-2); border-radius:var(--r-xs)}
.cambia-cli button[aria-current="true"]{background:var(--surface); color:var(--ink-1); box-shadow:var(--sh-1)}

.tres-cifras{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr); gap:var(--s4)}
.tres-cifras>*{padding-left:var(--s4); border-left:1px solid var(--line)}
.tres-cifras>*:first-child{padding-left:0; border-left:0}
.cifra-rot .v{font-family:var(--f-display); font-weight:800; font-size:26px; line-height:1.15; letter-spacing:-.02em; margin-top:2px}
.partes{margin-top:6px; display:flex; flex-direction:column; gap:2px; font-size:var(--t-2xs); color:var(--ink-2)}
.partes li{display:flex; gap:6px}
.partes li span{font-family:var(--f-mono); font-variant-numeric:tabular-nums; color:var(--ink-1); font-weight:600}

.venc-lista{display:flex; flex-direction:column; margin-top:6px}
.venc-fila{display:grid; grid-template-columns:60px minmax(0,1fr) 78px 116px; gap:var(--s3); align-items:baseline;
           padding:5px 0; border-top:1px solid var(--line-soft); font-size:var(--t-2xs)}
.venc-fila .d{font-weight:700; color:var(--ink-1); font-size:var(--t-xs)}

.venc-fila .v{text-align:right; font-weight:700; color:var(--ink-1)}
code{font-family:var(--f-mono); font-size:.92em}
@media (max-width:1120px){ .tres-cifras{grid-template-columns:1fr} .tres-cifras>*{padding-left:0; border-left:0} }

.anot-lista{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:var(--t-2xs); color:var(--ink-2); margin-top:4px}

.unid-fila{grid-template-columns:96px minmax(0,1fr) 132px}
@media (max-width:1120px){
  .barra{flex-wrap:wrap; height:auto; padding:8px 16px}

}

.anot{white-space:nowrap; max-width:none}
.eje-num>span:first-child{transform:none}

.riel-et>span:last-child{transform:translateX(-100%)}

<script>

'use strict';
const D = JSON.parse(document.getElementById('datos-json').textContent);

/* ---- las únicas cifras que NO están en el JSON: el agosto recompuesto ----
   El consolidado de agosto incluye a Mercado El Guadual y el de septiembre no.
   Para que el delta no mienta hay que compararlo contra agosto SIN Guadual, y

   va rotulado en pantalla como recálculo, nunca como dato del endpoint.        */
const GUION = {
  agostoComparable: { clientes: 5, espacios: 513, ocupacion_pct: 47.4, ingreso: 375100000 },
  fuente: 'guion.md §1.1 — recálculo del frontend, no lo devuelve /metricas'
};

/* ── formato ─────────────────────────────────────────────────────────────── */
const NF = new Intl.NumberFormat('es-CO');
const money = n => '$ ' + NF.format(Math.round(n));
const moneyM = n => '$ ' + (n / 1e6).toFixed(1).replace('.', ',') + ' M';
const dec = (n, d = 1) => n.toFixed(d).replace('.', ',');   /* para LEER */
const pn = (n, d = 1) => (Math.round(n * 10 ** d) / 10 ** d).toFixed(d);   /* para CSS y SVG: punto decimal */
const pc = (n, d = 1) => dec(n, d) + ' %';
const signo = n => (n < 0 ? '−' : '+');
const pcSig = (n, d = 1) => signo(n) + dec(Math.abs(n), d) + ' %';
const ptsSig = (n, d = 1) => signo(n) + dec(Math.abs(n), d) + ' pts';
const moneySig = n => signo(n) + ' $ ' + NF.format(Math.abs(Math.round(n)));
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const mesCorto = p => { const [a, m] = p.split('-'); return MESES[+m - 1] + ' ' + a.slice(2); };
const mesLargo = p => { const [a, m] = p.split('-'); return MESES[+m - 1] + '. ' + a; };
const fechaCorta = f => { const [a, m, d] = f.split('-'); return +d + ' ' + MESES[+m - 1]; };
const TIPO_ES = {
  gondola: 'cara de góndola', punta: 'punta de góndola', nevera_refrescos: 'nevera de bebidas',
  isla: 'isla', cross: 'exhibición de piso', robatope: 'robatope', batea: 'batea',
  fuera_del_plano: 'fuera del plano', stand_frutas: 'stand de frutas', isla_fria: 'isla fría',
  nevera_carnes: 'nevera de carnes', mueble: 'mueble', ristra: 'ristra', impulsador: 'impulsador'
};
const tipoEs = t => TIPO_ES[t] || t;
const tipoPl = (t, n) => {
  const s = tipoEs(t);
  if (n === 1) return s;
  return s.replace('cara', 'caras').replace('punta', 'puntas').replace('nevera', 'neveras')
          .replace('isla', 'islas').replace('exhibición', 'exhibiciones').replace('robatope', 'robatopes')
          .replace('batea', 'bateas').replace('stand', 'stands').replace('mueble', 'muebles');
};
const ESTADO_ES = { libre: 'libre', se_libera: 'se libera este mes', ocupado: 'ocupado' };
const CLASE_ES = { activa: 'activa', dormida: 'dormida', fantasma: 'fantasma', sin_cuentas: 'sin cuentas', nueva: 'nueva' };

/* ── plantillas seguras: todo ${x} va escapado (los nombres son dato) ────── */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const raw = html => ({ __raw: true, html });
function t(str, ...v) {
  return str.reduce((a, s, i) => {
    if (i >= v.length) return a + s;
    const x = v[i];
    if (x == null || x === false) return a + s;
    if (x && x.__raw) return a + s + x.html;
    if (Array.isArray(x)) return a + s + x.map(y => (y && y.__raw) ? y.html : esc(y)).join('');
    return a + s + esc(x);
  }, '');
}
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

/* ── bloque: la frase-conclusión SIEMPRE arriba, la tabla equivalente abajo ─ */
function bloque({ rotulo, conclusion, cuerpo, tabla, nota, clase = '' }) {
  return t`<section class="tarjeta ${raw(clase)}">
    ${rotulo ? raw(t`<div class="rotulo">${rotulo}</div>`) : ''}
    <p class="conclusion">${raw(conclusion)}</p>
    ${raw(cuerpo || '')}
    ${nota ? raw(t`<p class="nota-graf">${raw(nota)}</p>`) : ''}
    ${tabla ? raw(tablaEquiv(tabla)) : ''}
  </section>`;
}
function tablaEquiv({ titulo = 'Ver la tabla de este gráfico', cols, filas, alto }) {
  const th = cols.map(c => t`<th scope="col">${c}</th>`).join('');
  const tr = filas.map(f => '<tr>' + f.map((c, i) => {
    const v = (c && c.__raw) ? c.html : esc(c);
    return i === 0 ? t`<th scope="row" style="text-align:left;font-weight:600">${raw(v)}</th>`
                   : t`<td class="${raw(typeof f[i] === 'string' && /^[\s$−+\d.,% ]+$/.test(f[i]) ? 'num' : '')}">${raw(v)}</td>`;
  }).join('') + '</tr>').join('');
  return t`<details class="tabla-equiv"><summary>${titulo}</summary>
    <div class="cont" ${alto ? raw(`style="max-height:${alto}px"`) : ''}><table>
    <thead><tr>${raw(th)}</tr></thead><tbody>${raw(tr)}</tbody></table></div></details>`;
}

/* ══════════════ dibujos: se pintan al ancho real, y se repintan ═══════════ */
const DIBUJOS = {};                      /* clave -> function(ancho) -> html  */
function pintar() {
  $$('[data-dibujo]').forEach(el => {
    const f = DIBUJOS[el.dataset.dibujo];
    if (!f) return;
    const w = Math.round(el.clientWidth);
    if (w < 60) return;                    /* panel oculto: se pinta al abrirlo */
    if (el.dataset.w === String(w) && el.dataset.pintado === '1') return;
    el.innerHTML = f(w);
    el.dataset.w = String(w); el.dataset.pintado = '1';
  });
}
function repintarTodo() { $$('[data-dibujo]').forEach(el => { el.dataset.pintado = '0'; }); pintar(); }
let _rt; addEventListener('resize', () => { clearTimeout(_rt); _rt = setTimeout(repintarTodo, 140); });

/* ── primitivas SVG ──────────────────────────────────────────────────────── */
const SVG = (w, h, inner, label) =>
  t`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label || ''}">${raw(inner)}</svg>`;
const rejilla = (x0, x1, ys) => ys.map(y =>
  `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="var(--line-soft)" stroke-width="1"/>`).join('');
const txt = (x, y, s, o = {}) =>
  t`<text x="${x}" y="${y}" fill="${raw(o.fill || 'var(--ink-3)')}" font-size="${o.size || 10}"
     text-anchor="${raw(o.anchor || 'start')}" font-family="${raw(o.mono ? 'var(--f-mono)' : 'var(--f-text)')}"
     font-weight="${o.peso || 400}" style="font-variant-numeric:tabular-nums">${s}</text>`;

/* ── SVG sin viewBox: los % se resuelven contra el ancho real y los px siguen
      siendo px, así que el redondeo de 4 px del extremo nunca se deforma. ──── */
const svgPct = (h, inner, label) => label
  ? `<svg width="100%" height="${h}" role="img" aria-label="${esc(label)}">${inner}</svg>`
  : `<svg width="100%" height="${h}" aria-hidden="true" focusable="false">${inner}</svg>`;

/* barra: <=24 px de grosor, extremo del dato redondeado 4 px, base recta,
   y 2 px de aire del color de la superficie entre el relleno y el resto.
   pctRelleno se mide sobre la MISMA escala del gráfico, no sobre la barra.   */
function marcaBarra({ pctTotal, pctRelleno = 0, colorTotal, colorRelleno, h = 14, pista = true }) {
  let s = pista ? `<rect x="0" y="0" width="100%" height="${h}" rx="4" fill="var(--surface-3)"/>` : '';
  s += `<rect x="0" y="0" width="${pn(Math.max(pctTotal, .4), 2)}%" height="${h}" rx="4" fill="${colorTotal}"/>`;
  s += `<rect x="0" y="0" width="4" height="${h}" fill="${colorTotal}"/>`;
  if (pctRelleno > 0) {
    s += `<rect x="0" y="0" width="${pn(pctRelleno, 2)}%" height="${h}" fill="${colorRelleno}"/>`;
    s += `<rect x="${pn(pctRelleno, 2)}%" y="0" width="2" height="${h}" fill="var(--surface)"/>`;
  }
  return s;
}

/* ═════════════════════════ formas ════════════════════════════════════════
   Una sola escala por gráfico. Nunca dos ejes. El texto nunca lleva el color

   ═════════════════════════════════════════════════════════════════════════ */
const PADL = 54, PADR = 78;

/* ── eje de meses: una sola rejilla para los paneles que van apilados ────── */
function ejeMeses(serie) {

    const cls = p.parcial ? 'act' : '';
    const et = mesCorto(p.periodo);
    const sub = p.sin_dato ? 'sin dato' : (p.parcial ? 'parcial' : '');
    return t`<span class="${raw(cls)}">${et}${sub ? raw(`<br><em style="font-style:normal;font-size:9px">${sub}</em>`) : ''}</span>`;
  }).join('');
  return t`<div class="eje-meses" style="padding-left:${PADL}px;padding-right:${PADR}px">${raw(cel)}</div>`;
}

/* ── panel de líneas ─────────────────────────────────────────────────────
   serie: [{periodo, sin_dato, parcial, ...}] · lineas: [{campo,tinta,peso,fin}]
   anots: [{i, campo, texto, slot}] — la anotación va ESCRITA SOBRE el dato.   */
function panelLineas(w, { serie, lineas, alto, yMin, yMax, fmtY, ticks, anots = [], etiqueta }) {
  const anotInline = anots.length && w >= 640;
  const bandaAnot = anotInline ? 48 : 8;
  const H = alto - (anots.length && !anotInline ? 34 : 0), y0 = bandaAnot, y1 = H - 8;
  const step = (w - PADL - PADR) / serie.length;
  const X = i => PADL + step * (i + 0.5);
  const Y = v => y1 - (v - yMin) / (yMax - yMin) * (y1 - y0);
  const ALT = 22;
  const anchoDe = txtHtml => 14 + txtHtml.replace(/<[^>]+>/g, '').length * 5.75;
  let s = '';

  /* bandas honestas: el mes sin dato y el mes parcial se dibujan distintos */
  serie.forEach((p, i) => {
    if (p.sin_dato) s += `<rect x="${pn(X(i) - step / 2, 1)}" y="${y0}" width="${pn(step, 1)}" height="${pn(y1 - y0, 1)}" fill="var(--resto-suave)"/>`;
    else if (p.parcial) s += `<rect x="${pn(X(i) - step / 2, 1)}" y="${y0}" width="${pn(step, 1)}" height="${pn(y1 - y0, 1)}" fill="var(--surface-3)" opacity=".85"/>`;
  });
  s += rejilla(PADL, w - PADR, ticks.map(v => pn(Y(v), 1)));
  ticks.forEach(v => { s += txt(PADL - 8, pn(Y(v) + 3.5, 1), fmtY(v), { anchor: 'end', size: 10, mono: true }); });

  /* las líneas, con hueco donde no hay dato */
  const finales = [];
  lineas.forEach(L => {
    let d = '', abierto = false;
    serie.forEach((p, i) => {
      const v = L.campo(p);
      if (v == null) { abierto = false; return; }
      d += (abierto ? 'L' : 'M') + pn(X(i), 1) + ' ' + pn(Y(v), 1) + ' ';
      abierto = true;
    });
    s += `<path d="${d}" fill="none" stroke="${L.tinta}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const ult = serie.length - 1, v = L.campo(serie[ult]);
    if (v != null) finales.push({ y: Y(v), yReal: Y(v), x: X(ult), tinta: L.tinta, txt: L.fin(v) });
  });
  /* el valor del último mes, en el margen: nunca encima del dibujo, nunca apilado */
  finales.sort((a, b) => a.y - b.y);
  for (let i = 1; i < finales.length; i++)
    if (finales[i].y - finales[i - 1].y < 22) finales[i].y = finales[i - 1].y + 22;
  finales.forEach(f => {
    f.y = Math.min(Math.max(f.y, y0 + 10), y1 - 2);
    s += `<circle cx="${pn(f.x, 1)}" cy="${pn(f.yReal, 1)}" r="4.5" fill="${f.tinta}" stroke="var(--surface)" stroke-width="2"/>`;
    s += `<line x1="${pn(w - PADR + 6, 1)}" x2="${pn(w - PADR + 15, 1)}" y1="${pn(f.y, 1)}" y2="${pn(f.y, 1)}" stroke="${f.tinta}" stroke-width="2" stroke-linecap="round"/>`;
    s += txt(w - PADR + 20, pn(f.y + 4, 1), f.txt, { size: 11, mono: true, peso: 700, fill: 'var(--ink-1)' });
  });

  /* anotaciones: escritas sobre el dato cuando hay lugar; si no, listadas debajo */
  const ocupado = [];
  const cajas = anots.map(a => {
    const v = a.campo(serie[a.i]), yp = Y(v), xa = X(a.i);
    s += `<circle cx="${pn(xa, 1)}" cy="${pn(yp, 1)}" r="3.5" fill="var(--surface)" stroke="${a.tinta}" stroke-width="2"/>`;
    if (!anotInline) return '';
    const an = anchoDe(a.texto);
    const izq = Math.min(Math.max(xa - an / 2, 2), w - an - 2);
    let slot = 0;
    while (ocupado.some(o => o.slot === slot && !(izq + an + 8 <= o.izq || o.izq + o.an + 8 <= izq))) slot++;
    ocupado.push({ slot, izq, an });
    s += `<line x1="${pn(xa, 1)}" x2="${pn(xa, 1)}" y1="${slot * ALT + ALT - 3}" y2="${pn(yp - 6, 1)}" stroke="var(--line-strong)" stroke-width="1"/>`;
    return t`<div class="anot" style="left:${pn(izq, 0)}px;top:${slot * ALT}px">${raw(a.texto)}</div>`;
  }).join('');
  const lista = (anots.length && !anotInline)
    ? t`<ul class="anot-lista">${raw(anots.map(a => t`<li><b>${raw(mesCorto(serie[a.i].periodo))}</b> ${raw(a.texto)}</li>`).join(''))}</ul>`
    : '';
  return SVG(w, H, s, etiqueta) + cajas + lista;
}

/* ── unidades: una marca por espacio, agrupadas por sede ─────────────────── */
function unidadesPorSede(w, { sedes, espacios, modo = 'auto' }) {
  const filas = sedes.slice().sort((a, b) => a.ocupacion_pct - b.ocupacion_pct);
  const maxN = Math.max(...filas.map(f => f.espacios));
  const anchoCaja = Math.max(120, w - 96 - 12 - 132 - 12);
  let cell = Math.floor((anchoCaja + 2) / maxN) - 2;
  const agregado = modo === 'agregado' || cell < 4;
  cell = Math.min(Math.max(cell, 4), 9);
  const porSede = {};
  espacios.forEach(e => { (porSede[e.sede] = porSede[e.sede] || []).push(e); });
  const orden = { ocupado: 0, se_libera: 1, libre: 2 };
  return filas.map(f => {
    const lista = (porSede[f.sede] || []).slice().sort((a, b) => orden[a.estado] - orden[b.estado]);
    const seLibera = lista.filter(e => e.estado === 'se_libera').length;
    let caja;
    if (agregado) {
      caja = svgPct(14, marcaBarra({
        pctTotal: f.espacios / maxN * 100, pctRelleno: f.ocupados / maxN * 100,
        colorTotal: 'var(--libre)', colorRelleno: 'var(--ocupado)'
      }));
    } else {
      const paso = cell + 2;
      const marcas = lista.map((e, i) =>
        `<rect x="${i * paso}" y="0" width="${cell}" height="${cell}" rx="1.5" fill="var(--${e.estado === 'se_libera' ? 'entra' : e.estado})">`
        + `<title>${esc(e.codigo)} · ${ESTADO_ES[e.estado]}</title></rect>`).join('');
      caja = `<svg width="${lista.length * paso}" height="${cell}" aria-hidden="true" focusable="false">${marcas}</svg>`;
    }
    return t`<div class="unid-fila">
      <div class="et" style="font-weight:600">${f.sede}</div>
      ${raw(caja)}
      <div class="val">${f.ocupados}<span class="muted"> / ${raw(String(f.espacios))}</span> · ${raw(pc(f.ocupacion_pct))}
        ${seLibera ? raw(`<em style="font-style:normal;display:block;font-size:10px;color:var(--entra-txt)">${seLibera} se libera${seLibera > 1 ? 'n' : ''}</em>`) : ''}
      </div></div>`;
  }).join('') + (agregado && modo !== 'agregado'
    ? '<p class="nota-graf">A este ancho, ' + maxN + ' marcas quedarían de 2 px: por sede se agregan a una barra (largo = espacios, relleno = ocupados).</p>' : '');
}

/* ── barras horizontales: largo = conteo, relleno = ocupados ─────────────── */
function barrasConteo(filas, { max, etAncho = 132, valAncho = 150, colorRel = 'var(--ocupado)', colorResto = 'var(--libre)' }) {
  const M = max || Math.max(...filas.map(f => f.total));
  return filas.map(f => t`<div class="fila-graf" style="grid-template-columns:${raw(etAncho + 'px')} minmax(0,1fr) ${raw(valAncho + 'px')}">
    <div class="et">${f.etiqueta}</div>
    ${raw(svgPct(14, marcaBarra({ pctTotal: f.total / M * 100, pctRelleno: f.relleno / M * 100,
        colorTotal: f.colorResto || colorResto, colorRelleno: f.colorRel || colorRel })))}
    <div class="val">${raw(f.valor)}</div></div>`).join('');
}

/* ── participación de proveedores: top 5 + un solo bloque «otros» ────────── */
function proveedoresBarras(provs, totalContratos, ingresoTotal) {
  const top = provs.slice(0, 5);
  const restoN = provs.length - top.length;
  const restoContratos = totalContratos - top.reduce((a, p) => a + p.espacios, 0);
  const restoPct = 100 - top.reduce((a, p) => a + p.participacion_pct, 0);
  const fila = (nom, pct, contratos, canon, tinta, nota) => t`<div class="fila-graf" style="grid-template-columns:150px minmax(0,1fr) 132px">
      <div class="et">${nom}</div>
      ${raw(svgPct(14, marcaBarra({ pctTotal: pct, colorTotal: tinta })))}
      <div class="val">${raw(pc(pct))} · ${contratos} contr.${nota ? raw(`<em style="font-style:normal;display:block;font-size:10px">${nota}</em>`) : ''}</div>
    </div>`;
  const filas = top.map((p, i) => fila(p.nombre, p.participacion_pct, p.espacios, p.canon_total,
      i === 0 ? 'var(--dato)' : 'var(--dato-tenue)', '')).join('')
    + fila('otros ' + restoN + ' proveedores', restoPct, restoContratos, null, 'var(--resto)', '');
  return t`<div class="plot-umbral"><div class="umbral" style="left:calc(150px + (100% - 150px - 132px - 24px) * 0.40 + 12px)"></div>
      <div class="umbral-et" style="left:calc(150px + (100% - 150px - 132px - 24px) * 0.40 + 12px)">umbral 40 %</div>
      ${raw(filas)}</div>`;
}

/* ── dumbbell: cliente vs benchmark, por tipo, ordenado por brecha ───────── */
function dumbbell(filas) {
  const vals = filas.flatMap(f => [f.cliente, f.benchmark]).filter(v => v != null);
  const M = Math.max(...vals) * 1.04;
  return filas.map(f => {
    const pB = f.benchmark / M * 100;
    const pC = f.cliente != null ? f.cliente / M * 100 : null;
    let d = `<line x1="0" x2="100%" y1="9" y2="9" stroke="var(--line)" stroke-width="1"/>`;
    if (pC != null) d += `<rect x="${pn(Math.min(pB, pC), 2)}%" y="7.5" width="${pn(Math.abs(pB - pC), 2)}%" height="3" rx="1.5" fill="var(--dato-tenue)"/>`;
    d += `<circle cx="${pn(pB, 2)}%" cy="9" r="4.5" fill="var(--surface)" stroke="var(--ink-1)" stroke-width="2"><title>benchmark de la plataforma</title></circle>`;
    if (pC != null) d += `<circle cx="${pn(pC, 2)}%" cy="9" r="5.5" fill="var(--dato)" stroke="var(--surface)" stroke-width="2"><title>lo que cobra el cliente</title></circle>`;
    const pista = raw(svgPct(18, d));
    return t`<div class="fila-graf" style="grid-template-columns:132px minmax(0,1fr) 84px 148px">
      <div class="et">${tipoEs(f.tipo)}</div>
      ${pista}
      <div class="val" style="font-weight:700;color:var(--ink-1)">${raw(f.brecha == null ? '—' : pcSig(f.brecha))}</div>
      <div class="val">${raw(f.cliente == null ? '<em style="font-style:normal">sin contratos de este tipo</em>' : money(f.cliente) + ' vs ' + money(f.benchmark))}</div>
    </div>`;
  }).join('');
}

/* ── spread: puntos sobre un eje con el cero marcado ─────────────────────── */
function spreadPuntos(filas, { min = -20, max = 6 }) {
  const P = v => (v - min) / (max - min) * 100;
  const cero = P(0);
  const cuerpo = filas.map(f => t`<div class="fila-graf" style="grid-template-columns:150px minmax(0,1fr) 92px">
      <div class="et">${f.nombre}</div>
      ${raw(svgPct(18, `<line x1="0" x2="100%" y1="9" y2="9" stroke="var(--line)" stroke-width="1"/>`
        + `<line x1="${pn(cero, 2)}%" x2="${pn(cero, 2)}%" y1="1" y2="17" stroke="var(--ink-1)" stroke-width="1"/>`
        + `<circle cx="${pn(P(f.spread), 2)}%" cy="9" r="5.5" fill="var(--dato)" stroke="var(--surface)" stroke-width="2">`
        + `<title>${esc(dec(f.spread) + ' %')}</title></circle>`))}
      <div class="val" style="color:var(--ink-1);font-weight:700">${raw(pcSig(f.spread))}</div>
    </div>`).join('');
  return t`<div class="plot">${raw(cuerpo)}
    <div class="eje-num" style="padding-left:150px;padding-right:92px">
      <span style="left:0%">${raw(pc(min, 0))}</span><span style="left:${pn(cero, 2)}%">0 %</span><span style="left:100%">${raw(pcSig(max, 0))}</span>
    </div></div>`;
}

/* ── riel de 60 días: lo que se cae y cuándo ─────────────────────────────── */
function rielVencimientos(items, { hoy = 0, corteMes = 23, dias = 60 }) {
  const P = d => (d / dias) * 100;
  const marcas = items.map(i =>
    `<rect x="${pn(P(i.dias), 2)}%" y="4" width="9" height="18" rx="2" transform="translate(-4.5,0)"
       fill="var(--dato${i.dias <= corteMes ? '' : '-tenue'})"><title>${esc(i.codigo + ' · ' + fechaCorta(i.fin) + ' · ' + money(i.canon))}</title></rect>`).join('');
  const cuerpo = `<rect x="0" y="0" width="100%" height="26" rx="4" fill="var(--surface-3)"/>` + marcas
    + `<line x1="${pn(P(corteMes), 2)}%" x2="${pn(P(corteMes), 2)}%" y1="-3" y2="29" stroke="var(--ink-1)" stroke-width="1"/>`;
  return t`<div class="riel">
      ${raw(svgPct(26, cuerpo, 'Riel de 60 días con los ' + items.length + ' contratos que vencen, marcados por fecha.'))}
      <div class="riel-et"><span style="left:0%">hoy · 7 sep</span><span style="left:${pn(P(corteMes), 2)}%">fin del periodo · 30 sep</span><span style="left:100%;transform:translateX(-100%)">+60 días · 6 nov</span></div>
    </div>`;
}

/* ── movimientos: barras divergentes sobre el eje de meses, en plata ─────── */
/* extremo del dato redondeado 4 px, base recta sobre la línea del cero */
function barraSigno(x, yc, bw, h, arriba, color) {
  const r = Math.min(4, h / 2), X = +pn(x, 1), W = +pn(bw, 1), H = +pn(h, 1);
  const d = arriba
    ? `M${X} ${yc} L${X} ${pn(yc - H + r, 1)} Q${X} ${pn(yc - H, 1)} ${pn(X + r, 1)} ${pn(yc - H, 1)} L${pn(X + W - r, 1)} ${pn(yc - H, 1)} Q${pn(X + W, 1)} ${pn(yc - H, 1)} ${pn(X + W, 1)} ${pn(yc - H + r, 1)} L${pn(X + W, 1)} ${yc} Z`
    : `M${X} ${yc} L${X} ${pn(yc + H - r, 1)} Q${X} ${pn(yc + H, 1)} ${pn(X + r, 1)} ${pn(yc + H, 1)} L${pn(X + W - r, 1)} ${pn(yc + H, 1)} Q${pn(X + W, 1)} ${pn(yc + H, 1)} ${pn(X + W, 1)} ${pn(yc + H - r, 1)} L${pn(X + W, 1)} ${yc} Z`;
  return `<path d="${d}" fill="${color}"/>`;
}
function movimientosDivergentes(w, { movimientos, etiqueta }) {
  const filas = movimientos.map(m => ({
    mes: m.mes,
    ent: m.entradas.reduce((a, x) => a + x.canon_mensual, 0),
    sal: m.salidas.reduce((a, x) => a + x.canon_mensual, 0)
  }));
  const tope = Math.max(...filas.map(f => Math.max(f.ent, f.sal)));
  if (!tope) return '<p class="nota-graf">Doce meses sin un solo movimiento: este cliente no ha firmado ni perdido un contrato todavía.</p>';
  const M = tope * 1.15;
  const H = 148, yc = 74, alto = 58;
  const step = (w - PADL - PADR) / filas.length;
  const bw = Math.min(22, step * 0.52);
  const X = i => PADL + step * (i + 0.5);
  const Y = v => yc - (v / M) * alto;
  let s = `<line x1="${PADL}" x2="${w - PADR}" y1="${yc}" y2="${yc}" stroke="var(--line-strong)" stroke-width="1"/>`;
  const tick = M * 0.8;
  s += rejilla(PADL, w - PADR, [pn(Y(tick), 1), pn(yc + (yc - Y(tick)), 1)]);
  s += txt(PADL - 8, pn(Y(tick) + 3.5, 1), '+' + dec(tick / 1e6, 1) + ' M', { anchor: 'end', size: 10, mono: true });
  s += txt(PADL - 8, yc + 3.5, '0', { anchor: 'end', size: 10, mono: true });
  s += txt(PADL - 8, pn(yc + (yc - Y(tick)) + 3.5, 1), '−' + dec(tick / 1e6, 1) + ' M', { anchor: 'end', size: 10, mono: true });
  filas.forEach((f, i) => {
    const x = X(i) - bw / 2;
    const he = (f.ent / M) * alto, hs = (f.sal / M) * alto;
    s += barraSigno(x, yc, bw, Math.max(he, 1.5), true, 'var(--dato)');
    s += barraSigno(x, yc, bw, Math.max(hs, 1.5), false, 'var(--dato-tenue)');
  });
  /* saldo neto: una sola escala, la misma */
  let d = '';
  filas.forEach((f, i) => { d += (i ? 'L' : 'M') + pn(X(i), 1) + ' ' + pn(Y(f.ent - f.sal), 1) + ' '; });
  s += `<path d="${d}" fill="none" stroke="var(--ink-1)" stroke-width="1.5" stroke-dasharray="0" opacity=".55"/>`;
  /* se rotula sólo el extremo: mayo */
  const iMax = filas.reduce((b, f, i) => (f.sal > filas[b].sal ? i : b), 0);
  const iMaxE = filas.reduce((b, f, i) => (f.ent > filas[b].ent ? i : b), 0);
  const et = (i, v, arriba) => {
    const yb = arriba ? yc - (v / M) * alto - 7 : yc + (v / M) * alto + 14;
    const an = 52, izq = Math.min(Math.max(X(i) - an / 2, PADL), w - PADR - an);
    s += txt(izq + an / 2, pn(yb, 1), (arriba ? '+' : '−') + dec(v / 1e6) + ' M',
      { size: 10.5, mono: true, peso: 700, fill: 'var(--ink-1)', anchor: 'middle' });
  };
  et(iMaxE, filas[iMaxE].ent, true); et(iMax, filas[iMax].sal, false);
  return SVG(w, H, s, etiqueta);
}

/* ═══════════════════ PIEZA 1 · LA CARTERA ════════════════════════════════
   «¿Cómo va el negocio y a quién llamo primero?»
   ═════════════════════════════════════════════════════════════════════════ */
const CONS = D.cartera.consolidado;
const SERIE_C = D.tendencia_cartera.serie;
const AGO = SERIE_C[10], SEP = SERIE_C[11];
const ocupadas = p => (p.espacios_comercializables == null ? null : Math.round(p.espacios_comercializables * p.ocupacion_pct / 100));
const CLI = {}; D.cartera.clientes.forEach(c => CLI[c.slug] = c);
const ADO = {}; D.adopcion.clientes.forEach(c => ADO[c.slug] = c);
const DERC = D._derivado_frontend.cartera;
const DERM = D._derivado_frontend.mercamio;

/* ---------- 1.1 · el titular ---------------------------------------------- */
function pintaTitular() {
  const dCrudo = CONS.ingreso_contratado_mes - AGO.ingreso_contratado_mes;
  const dCrudoPts = CONS.ocupacion_pct - AGO.ocupacion_pct;
  const dComp = CONS.ingreso_contratado_mes - GUION.agostoComparable.ingreso;
  const dCompPct = dComp / GUION.agostoComparable.ingreso * 100;
  const dCompPts = CONS.ocupacion_pct - GUION.agostoComparable.ocupacion_pct;

  const conclusion = t`<b>La cartera factura <span class="n">${raw(money(CONS.ingreso_contratado_mes))}</span> este mes sobre
    <span class="n">${CONS.espacios_comercializables}</span> espacios en <span class="n">${CONS.sedes_con_plano}</span> sedes,
    al <span class="n">${raw(pc(CONS.ocupacion_pct))}</span> de ocupación. Contra agosto parece perder
    <span class="n">${raw(moneyM(Math.abs(dCrudo)))}</span> y <span class="n">${raw(dec(Math.abs(dCrudoPts)))}</span> puntos, y no perdió nada:
    Mercado El Guadual no se dejó leer y salió de las dos puntas de la cuenta. A igual composición, agosto fueron
    <span class="n">${raw(money(GUION.agostoComparable.ingreso))}</span> y <span class="n">${raw(pc(GUION.agostoComparable.ocupacion_pct))}</span>:
    el ingreso subió <span class="n">${raw(pc(dCompPct))}</span> y la ocupación quedó plana.</b>`;

  const filas = [
    ['clientes', String(AGO.clientes_incluidos), String(GUION.agostoComparable.clientes), SEP.clientes_incluidos + ' +1 s/d'],
    ['espacios', NF.format(AGO.espacios_comercializables), NF.format(GUION.agostoComparable.espacios), NF.format(CONS.espacios_comercializables)],
    ['ocupación', pc(AGO.ocupacion_pct), pc(GUION.agostoComparable.ocupacion_pct), pc(CONS.ocupacion_pct)],
    ['ingreso', money(AGO.ingreso_contratado_mes), money(GUION.agostoComparable.ingreso), money(CONS.ingreso_contratado_mes)]
  ];
  const tabla = t`<div class="tabla-equiv corr" style="margin-top:0">
    <div class="rotulo" style="margin-bottom:4px">Por qué el delta va contra la columna del medio</div><table>
    <thead><tr><th></th><th class="tachado">ago. publicado</th><th>ago. comparable</th><th>septiembre</th></tr></thead>
    <tbody>${raw(filas.map(f => t`<tr><th scope="row" style="text-align:left;font-weight:600">${f[0]}</th>

/* ---------- 1.3 · la cola de llamadas ------------------------------------- */
const SENAL_ES = {
  sin_dato: 'sin dato', fantasma: 'fantasma', spread_negativo: 'cobra por debajo',
  ocupacion_baja: 'ocupación baja', sin_tarifa: 'sin tarifa', nueva: 'nueva'
};
function plataDeLaFila(slug) {
  const m = CLI[slug].metricas;
  if (slug === 'mercado-el-guadual') return { v: '—', e: 'no hay cifra que mirar' };
  if (slug === 'tiendas-la-vereda') return { v: money(m.ingreso_contratado_mes) + '/mes', e: 'en riesgo · ' + pc(m.ingreso_contratado_mes / CONS.ingreso_contratado_mes * 100) + ' de la cartera' };
  if (slug === 'superandes') {
    const sin = Math.round((m.ingreso_contratado_mes / (1 + m.spread_pct / 100) - m.ingreso_contratado_mes) / 1e5) * 1e5;
    return { v: '≈ ' + money(sin) + '/mes', e: 'sin cobrar (aprox.: sobre ' + (74 - m.contratos_sin_tarifa) + ' de 74 contratos)' };
  }
  if (slug === 'mercamio') return { v: money(DERM.oportunidad_nueva) + '/mes', e: 'de oportunidad nueva' };
  if (slug === 'provisiones-tolima') return { v: 'sin referencia', e: m.contratos_sin_tarifa + ' de 24 contratos sin tarifa aplicable' };
  if (slug === 'almacenes-caribe') return { v: money(D.detalle_cliente_nuevo.recomendaciones[0].valor_estimado_mensual) + '/mes', e: 'al benchmark de la plataforma' };
  return { v: '—', e: '' };
}
