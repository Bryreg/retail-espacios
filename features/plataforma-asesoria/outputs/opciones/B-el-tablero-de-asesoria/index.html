/* ═══════════════ PIEZA 2 · LA SESIÓN DE ASESORÍA ═════════════════════════
   Una hoja de una pantalla, cinco capítulos, cada uno con su conclusión.
   ═════════════════════════════════════════════════════════════════════════ */
const SES = { slug: 'mercamio', cap: 1 };
const CAPS = [
  ['Dónde está', 'ocupación, ingreso y la historia de 12 meses'],
  ['Qué encontramos', 'los hallazgos, en orden de lo que pesa'],
  ['Qué proponemos', 'las acciones, con su valor'],
  ['Los datos detrás', 'espacios, contratos, proveedores, movimientos'],
  ['De dónde sale', 'periodo, cobertura, frontera y bitácora']
];
const det = () => SES.slug === 'mercamio' ? D.detalle_cliente : D.detalle_cliente_nuevo;
const esNuevo = () => SES.slug !== 'mercamio';

/* índice de espacios por código: para repartir por sede sin listar códigos */
function idxEspacios(dt) { const m = {}; dt.espacios.forEach(e => m[e.codigo] = e); return m; }
function repartoPorSede(dt, codigos) {
  const idx = idxEspacios(dt), g = {};
  codigos.forEach(c => {
    const e = idx[c]; const sede = e ? e.sede : (c.split('-')[0] || '—');
    g[sede] = g[sede] || { n: 0, libera: 0, cods: [] };
    g[sede].n++; g[sede].cods.push(c);
    if (e && e.estado === 'se_libera') g[sede].libera++;
  });
  return Object.entries(g).sort((a, b) => b[1].n - a[1].n);
}

/* ---------- capítulo 1 · dónde está --------------------------------------- */
function cap1() {
  const dt = det(), m = CLI[SES.slug].metricas;
  const conContrato = dt.espacios.filter(e => e.estado !== 'libre').length;
  const contratos = conContrato + dt.contratos_fuera_del_plano;
  const enOferta = dt.oportunidades.length;
  const valOferta = dt.oportunidades.reduce((a, o) => a + o.valor_estimado_mensual, 0);
  const seLibera = dt.espacios.filter(e => e.estado === 'se_libera').length;
  const libres = dt.espacios.filter(e => e.estado === 'libre').length;
  const serie = esNuevo() ? null : D.tendencia_cliente.serie;
  const ago = serie ? serie[10] : null;

  const conclusion = esNuevo()
    ? t`<b>${raw(dt.cliente.nombre)} se dio de alta hace <span class="n">12</span> días, ya cargó el plano de su única sede con
        <span class="n">${dt.sedes[0].espacios}</span> espacios comercializables y no tiene ni un contrato: al promedio de la
        plataforma esos ${dt.sedes[0].espacios} espacios valen <span class="n">${raw(money(valOferta))}</span> al mes.</b>`
    : t`<b>${raw(dt.cliente.nombre)} factura <span class="n">${raw(money(m.ingreso_contratado_mes))}</span> este mes con
        <span class="n">${contratos}</span> contratos sobre <span class="n">${m.espacios_comercializables}</span> espacios en
        <span class="n">${m.sedes_con_plano}</span> sedes: <span class="n">${raw(pc(m.ocupacion_pct))}</span> de ocupación,
        <span class="n">${raw(dec(Math.abs(m.ocupacion_pct - CONS.ocupacion_pct)))}</span> puntos por debajo de la cartera
        (${raw(pc(CONS.ocupacion_pct))}) y <span class="n">${raw(dec(Math.abs(m.ocupacion_pct - ago.ocupacion_pct)))}</span> puntos por debajo
        de agosto (${raw(pc(ago.ocupacion_pct))}). Los <span class="n">${enOferta}</span> espacios que puede vender hoy
        —${libres} libres y ${seLibera} que se liberan este mes— valen <span class="n">${raw(money(valOferta))}</span> mensuales
        al precio que él mismo cobra por cada tipo.</b>`;

  const tile = (rot, val, contra) => t`<div class="tile"><div class="rotulo">${rot}</div>
    <div class="v cifra-suelta">${raw(val)}</div><div class="contra">${raw(contra)}</div></div>`;
  const kpis = esNuevo()
    ? tile('Ingreso contratado', money(0), 'Sin contratos activos en el periodo.')
      + tile('Ocupación', pc(0, 0), '34 espacios cargados, ninguno vendido.')
      + tile('Canon promedio', 'sin referencia', 'No cobra todavía: el precio sugerido sale del benchmark de la plataforma.')
      + tile('Espacios en oferta', enOferta + ' de ' + dt.sedes[0].espacios, 'Valen ' + money(valOferta) + '/mes al benchmark.')
    : tile('Ingreso contratado', money(m.ingreso_contratado_mes),
        '<b class="delta">' + moneySig(m.ingreso_contratado_mes - ago.ingreso_contratado_mes) + '</b> · <b class="delta">'
        + pcSig((m.ingreso_contratado_mes - ago.ingreso_contratado_mes) / ago.ingreso_contratado_mes * 100)
        + '</b> contra agosto (' + money(ago.ingreso_contratado_mes) + '). El mes es parcial.')
      + tile('Ocupación', pc(m.ocupacion_pct),
        conContrato + ' con contrato hoy (' + (conContrato - seLibera) + ' ocupados + ' + seLibera + ' que se liberan) de '
        + m.espacios_comercializables + '.<br>Cartera ' + pc(CONS.ocupacion_pct) + ' · <b class="delta">'
        + ptsSig(m.ocupacion_pct - CONS.ocupacion_pct) + '</b> — agosto ' + pc(ago.ocupacion_pct) + ' · <b class="delta">'
        + ptsSig(m.ocupacion_pct - ago.ocupacion_pct) + '</b>')
      + tile('Canon promedio', money(m.canon_promedio_mensual),
        'Cartera ' + money(CONS.canon_promedio_mensual) + ' · <b class="delta">'
        + pcSig((m.canon_promedio_mensual / CONS.canon_promedio_mensual - 1) * 100) + '</b>: vende espacio más caro que el promedio.')
      + tile('Espacios en oferta', enOferta + ' de ' + m.espacios_comercializables,
        pc(enOferta / m.espacios_comercializables * 100) + ' del inventario sin vender. Valen <b>' + money(valOferta) + '</b>/mes al precio del propio cliente.');

  /* la ocupación dibujada: una marca por espacio, agrupada por sede, la peor arriba */
  DIBUJOS['ses-unidades'] = w => unidadesPorSede(w, { sedes: dt.sedes, espacios: dt.espacios });
  const blqUnid = bloque({
    rotulo: 'La ocupación, espacio por espacio · sedes ordenadas de peor a mejor',
    conclusion: esNuevo()
      ? t`<b>Las <span class="n">${dt.sedes[0].espacios}</span> caras de ${raw(dt.sedes[0].sede)} están libres: no hay una sola ocupada.</b>`
      : (() => { const peor = dt.sedes.slice().sort((a, b) => a.ocupacion_pct - b.ocupacion_pct)[0];
          return t`<b>De las <span class="n">${dt.sedes.length}</span> sedes, <b>${raw(peor.sede)}</b> concentra
            <span class="n">${peor.libres}</span> de los <span class="n">${libres}</span> espacios libres y está al
            <span class="n">${raw(pc(peor.ocupacion_pct))}</span>: el hueco de la ocupación tiene una dirección postal.</b>`; })(),
    cuerpo: '<div data-dibujo="ses-unidades"></div>' + t`<div class="leyenda" style="margin-top:8px">
        <span><i style="background:var(--ocupado)"></i>ocupado</span>
        <span><i style="background:var(--entra)"></i>se libera en el periodo</span>
        <span><i style="background:var(--libre)"></i>libre</span>
        <span class="muted">una marca = un espacio · ${raw(String(dt.espacios.length))} marcas</span></div>`,
    tabla: {
      titulo: 'Ver la tabla de sedes',
      cols: ['sede', 'espacios', 'ocupados', 'se liberan', 'libres', 'ocupación'],
      filas: dt.sedes.slice().sort((a, b) => a.ocupacion_pct - b.ocupacion_pct).map(s => {
        const sl = dt.espacios.filter(e => e.sede === s.sede && e.estado === 'se_libera').length;
        return [s.sede, String(s.espacios), String(s.ocupados - sl), String(sl), String(s.libres), pc(s.ocupacion_pct)];
      })
    }
  });

  let blqTend;
  if (esNuevo()) {
    blqTend = bloque({
      rotulo: 'Doce meses',
      conclusion: '<b>No hay historia todavía: el cliente se dio de alta el mes pasado. Doce meses de tendencia serían doce meses inventados.</b>',
      cuerpo: '<p class="nota-graf">/tendencia devuelve la serie del cliente desde su alta. Con un mes de vida no hay serie que dibujar; la habrá en noviembre.</p>'
    });
  } else {
    const may = serie[7], jun = serie[8];
    const mov05 = dt.movimientos.find(x => x.mes === '2026-05');
    const cancel = mov05.salidas.filter(s => s.motivo === 'cancelacion');
    const cancelPlata = cancel.reduce((a, s) => a + s.canon_mensual, 0);
    DIBUJOS['ses-conteos'] = w => panelLineas(w, {
      serie, alto: 150, yMin: 0, yMax: 285, ticks: [0, 100, 200],
      fmtY: v => NF.format(v), etiqueta: 'Espacios comercializables y ocupados de Mercamío, doce meses.',
      lineas: [
        { campo: p => p.espacios_comercializables, tinta: 'var(--dato-tenue)', etiqueta: 'comercializables', fin: v => NF.format(v) },
        { campo: p => ocupadas(p), tinta: 'var(--dato)', etiqueta: 'ocupados', fin: v => NF.format(v) }
      ],
      anots: [{ i: 8, campo: p => p.espacios_comercializables, tinta: 'var(--dato-tenue)', slot: 0,
                texto: '<b>+108 caras</b> · plano de TERRÓN' }]
    });
    DIBUJOS['ses-ingreso'] = w => panelLineas(w, {
      serie, alto: 144, yMin: 155e6, yMax: 215e6, ticks: [160e6, 200e6],
      fmtY: v => (v / 1e6).toFixed(0) + ' M', etiqueta: 'Ingreso contratado de Mercamío, doce meses.',
      lineas: [{ campo: p => p.ingreso_contratado_mes, tinta: 'var(--dato)', etiqueta: 'ingreso', fin: v => dec(v / 1e6) + ' M' }],
      anots: [{ i: 7, campo: p => p.ingreso_contratado_mes, tinta: 'var(--dato)', slot: 0,
                texto: '<b>−' + dec(cancelPlata / 1e6) + ' M</b> · 6 cancelaciones de Higiénicos Zafra' }]
    });
    blqTend = bloque({
      rotulo: 'Doce meses · dos paneles, una sola rejilla de meses',
      conclusion: t`<b>De mayo a junio la ocupación de Mercamío cayó <span class="n">${raw(dec(may.ocupacion_pct - jun.ocupacion_pct))}</span> puntos,
        de <span class="n">${raw(pc(may.ocupacion_pct))}</span> a <span class="n">${raw(pc(jun.ocupacion_pct))}</span>, y no perdió una sola cara:
        cargó el plano de TERRÓN y su inventario pasó de <span class="n">${may.espacios_comercializables}</span> a
        <span class="n">${jun.espacios_comercializables}</span> espacios. Lo que sí perdió ese mes fue ingreso:
        <span class="n">${raw(moneyM(may.ingreso_contratado_mes - jun.ingreso_contratado_mes))}</span> entre los dos meses, con
        <span class="n">${cancel.length}</span> cancelaciones de Higiénicos Zafra por <span class="n">${raw(money(cancelPlata))}</span>
        como el movimiento más grande de mayo.</b>`,
      cuerpo: '<div class="plot" data-dibujo="ses-conteos"></div><div class="plot" data-dibujo="ses-ingreso"></div>'
        + ejeMeses(serie) + t`<div class="leyenda">
          <span><i style="background:var(--dato-tenue)"></i>espacios comercializables</span>
          <span><i style="background:var(--dato)"></i>ocupados · ingreso</span>
          <span><i style="background:var(--resto-suave);border:1px solid var(--resto-borde)"></i>mes sin snapshot</span>
          <span><i style="background:var(--surface-3)"></i>mes parcial</span></div>`,
      nota: 'Las dos cosas de mayo-junio no tienen que ver entre sí y por eso van anotadas por separado, cada una sobre su panel: el escalón del inventario arriba, la cancelación abajo. Un solo gráfico las juntaría en una caída y le inventaría una causa. <b>Ocupados</b> = comercializables × ocupación %, cálculo del frontend.',
      tabla: {
        titulo: 'Ver la tabla de los doce meses',
        cols: ['mes', 'comercializables', 'ocupados', 'ocupación', 'ingreso', 'canon promedio'],
        filas: serie.map(p => [mesCorto(p.periodo),
          p.sin_dato ? '—' : NF.format(p.espacios_comercializables), p.sin_dato ? '—' : NF.format(ocupadas(p)),
          p.sin_dato ? '—' : pc(p.ocupacion_pct), p.sin_dato ? '—' : money(p.ingreso_contratado_mes),
          p.sin_dato ? '—' : money(p.canon_promedio_mensual)])
      }
    });
  }
  return t`<section class="tarjeta"><div class="rotulo">Capítulo 1 · dónde está</div>
      <p class="conclusion">${raw(conclusion)}</p>
      <div class="kpis">${raw(kpis)}</div></section>
    ${raw(blqUnid)}${raw(blqTend)}`;
}

/* ---------- capítulo 2 · qué encontramos ---------------------------------- */
function cap2() {
  const dt = det();
  if (esNuevo()) {
    const porTipo = dt.recomendaciones[0].datos.espacios_por_tipo.slice().sort((a, b) => b.total - a.total);
    const filas = porTipo.map(x => ({
      etiqueta: tipoPl(x.tipo, x.total), total: x.total, relleno: 0,
      valor: x.total + ' libres · ' + money((dt.benchmark_plataforma[x.tipo] || 0) * x.total) + '/mes'
    }));
    return bloque({
      rotulo: 'Capítulo 2 · qué encontramos',
      conclusion: '<b>No hay hallazgos que medir: sin un solo contrato no hay ocupación, ni spread, ni concentración, ni vencimientos. Lo único que hay es inventario cargado y un precio de mercado para ponerle.</b>',
      cuerpo: barrasConteo(filas, { etAncho: 150, valAncho: 210, colorResto: 'var(--libre)' })
        + '<p class="nota-graf">El backend lo trata igual: cuando el cliente no tiene contratos genera una sola recomendación (<code>arranque</code>) y no genera ninguna de las otras seis. Son dos estados de pantalla distintos, no la misma pantalla con seis tarjetas vacías.</p>',
      tabla: { titulo: 'Ver la tabla del inventario', cols: ['tipo', 'espacios', 'benchmark de la plataforma', 'valor al benchmark'],
        filas: porTipo.map(x => [tipoEs(x.tipo), String(x.total), money(dt.benchmark_plataforma[x.tipo] || 0),
          money((dt.benchmark_plataforma[x.tipo] || 0) * x.total)]) }
    });
  }

  const m = CLI.mercamio.metricas;
  const R = {}; dt.recomendaciones.forEach(r => R[r.id] = r);
  const rTerron = R['sede_subutilizada:TERRON'], rVolcan = R['concentracion_proveedor:Gaseosas Volcán S.A.'];
  const gondola = dt.resumen_por_tipo.find(x => x.tipo === 'gondola');
  const libresTot = dt.espacios.filter(e => e.estado === 'libre').length;
  const vencer = dt.recomendaciones.filter(r => r.tipo === 'contrato_por_vencer')
    .map(r => ({ ...r.datos, valor: r.valor_estimado_mensual, dias: r.datos.dias_para_vencer, canon: r.datos.canon_mensual }))
    .sort((a, b) => a.dias - b.dias);
  const riesgo = DERM.ingreso_en_riesgo_60d;
  const enSep = vencer.filter(v => v.fin <= '2026-09-30');
  const contratos = dt.espacios.filter(e => e.estado !== 'libre').length + dt.contratos_fuera_del_plano;
  const brechas = DERM.canon_vs_benchmark_por_tipo.slice().sort((a, b) =>
    (a.brecha_pct == null ? 99 : a.brecha_pct) - (b.brecha_pct == null ? 99 : b.brecha_pct));
  const sinTarifa = dt.resumen_por_tipo.filter(x => !x.tarifa_configurada).map(x => tipoEs(x.tipo));

  const h1 = bloque({ clase: 'ancho', rotulo: 'H1 · todo lo vacío está en un solo lugar',
    conclusion: t`<b>TERRÓN tiene <span class="n">${rTerron.datos.libres}</span> de los <span class="n">${libresTot}</span> espacios libres
      del cliente (<span class="n">${raw(pc(rTerron.datos.libres / libresTot * 100, 0))}</span>) y está al
      <span class="n">${raw(pc(rTerron.datos.ocupacion_pct))}</span> de ocupación,
      <span class="n">${raw(dec(rTerron.datos.ocupacion_promedio_cliente_pct - rTerron.datos.ocupacion_pct))}</span> puntos por debajo del promedio
      de Mercamío. Vender sólo ahí vale <span class="n">${raw(money(rTerron.valor_estimado_mensual))}</span> al mes.</b>`,
    cuerpo: t`<div class="fila-graf" style="grid-template-columns:132px minmax(0,1fr) 190px">
        <div class="et">TERRÓN</div>
        ${raw(svgPct(18, `<line x1="0" x2="100%" y1="9" y2="9" stroke="var(--line)" stroke-width="1"/>`
          + `<line x1="${pn(rTerron.datos.ocupacion_promedio_cliente_pct, 2)}%" x2="${pn(rTerron.datos.ocupacion_promedio_cliente_pct, 2)}%" y1="1" y2="17" stroke="var(--ink-1)" stroke-width="1"/>`
          + `<circle cx="${pn(rTerron.datos.ocupacion_pct, 2)}%" cy="9" r="5.5" fill="var(--dato)" stroke="var(--surface)" stroke-width="2"/>`,
          'Ocupación de TERRÓN, 8,3 %, contra el promedio del cliente, 42,9 %.'))}
        <div class="val">${raw(pc(rTerron.datos.ocupacion_pct))} · <b style="color:var(--ink-1)">${raw(ptsSig(rTerron.datos.ocupacion_pct - rTerron.datos.ocupacion_promedio_cliente_pct))}</b></div></div>
      <div class="eje-num" style="padding-left:132px;padding-right:190px"><span style="left:0">0 %</span>
        <span style="left:${pn(rTerron.datos.ocupacion_promedio_cliente_pct, 2)}%">promedio del cliente ${raw(pc(rTerron.datos.ocupacion_promedio_cliente_pct))}</span>
        <span style="left:100%;transform:translateX(-100%)">100 %</span></div>`,
    nota: 'No es una sede floja: es una sede que todavía no se vendió. Su plano entró en junio. Las otras seis van de 50,0 % (NAVE) a 79,4 % (CENTENARIO).' });

  const h2 = bloque({ rotulo: 'H2 · un proveedor es la mitad del negocio',
    conclusion: t`<b>Gaseosas Volcán tiene <span class="n">${rVolcan.datos.contratos}</span> de los
      <span class="n">${rVolcan.datos.contratos_activos_total}</span> contratos (<span class="n">${raw(pc(rVolcan.datos.participacion_pct))}</span>)
      y <span class="n">${raw(money(rVolcan.datos.canon_total))}</span> de los <span class="n">${raw(money(m.ingreso_contratado_mes))}</span>
      de ingreso: <span class="n">${raw(pc(rVolcan.datos.canon_total / m.ingreso_contratado_mes * 100))}</span>.
      Cinco de sus contratos vencen en los próximos 60 días.</b>`,
    cuerpo: proveedoresBarras(dt.proveedores, rVolcan.datos.contratos_activos_total, m.ingreso_contratado_mes),
    nota: 'La participación se cuenta en contratos y el peso en plata es otro número: hay que decir los dos, porque Volcán ocupa espacios caros. Los 20 proveedores de la cola van en un solo bloque; sus filas están en el capítulo 4.',
    tabla: { titulo: 'Ver los 25 proveedores', alto: 200,
      cols: ['proveedor', 'contratos', 'participación', 'canon total', 'vencen a 60 d', 'desde'],
      filas: dt.proveedores.map(p => [p.nombre, String(p.espacios), pc(p.participacion_pct), money(p.canon_total),
        String(p.contratos_por_vencer_60d), p.desde]) } });

  const filasTipo = dt.resumen_por_tipo.slice().sort((a, b) => b.libres - a.libres).map(x => ({
    etiqueta: tipoPl(x.tipo, x.total), total: x.total, relleno: x.ocupados,
    valor: x.libres + ' libres de ' + x.total
  }));
  const h3 = bloque({ rotulo: 'H3 · el inventario es góndola, y la góndola no se está vendiendo',
    conclusion: t`<b><span class="n">${gondola.total}</span> de los <span class="n">${dt.espacios.length}</span> espacios son caras de góndola
      (<span class="n">${raw(pc(gondola.total / dt.espacios.length * 100, 0))}</span>) y <span class="n">${gondola.libres}</span> de ellas están libres:
      son el <span class="n">${raw(pc(gondola.libres / libresTot * 100, 0))}</span> de todo lo vacío.</b>`,
    cuerpo: barrasConteo(filasTipo, { etAncho: 150, valAncho: 140 })
      + '<div class="leyenda" style="margin-top:6px"><span><i style="background:var(--ocupado)"></i>ocupado</span><span><i style="background:var(--libre)"></i>libre o se libera</span><span class="muted">largo = espacios de ese tipo</span></div>',
    tabla: { titulo: 'Ver la tabla por tipo', cols: ['tipo', 'espacios', 'ocupados', 'libres', 'canon promedio del cliente', 'benchmark'],
      filas: dt.resumen_por_tipo.map(x => [tipoEs(x.tipo), String(x.total), String(x.ocupados), String(x.libres),
        x.canon_promedio == null ? 'sin contratos' : money(x.canon_promedio), money(dt.benchmark_plataforma[x.tipo])]) } });

  const h4 = bloque({ rotulo: 'H4 · qué se cae y cuándo',
    conclusion: t`<b><span class="n">${vencer.length}</span> contratos vencen dentro de 60 días por
      <span class="n">${raw(money(riesgo))}</span> mensuales: el <span class="n">${raw(pc(riesgo / m.ingreso_contratado_mes * 100))}</span>
      del ingreso. <span class="n">${enSep.length}</span> se caen dentro de septiembre —el ${raw(enSep.map(v => v.fin.slice(8)).join(', el '))}—
      por <span class="n">${raw(money(enSep.reduce((a, v) => a + v.canon, 0)))}</span>, y ya cambiaron de estado a «se libera».</b>`,
    cuerpo: rielVencimientos(vencer.map(v => ({ dias: v.dias, codigo: v.codigo, fin: v.fin, canon: v.canon })), {})
      + t`<div class="venc-lista">${raw(vencer.map(v => t`<div class="venc-fila">
          <span class="d cifra">${raw(fechaCorta(v.fin))}</span>
          <span class="q">${raw(v.proveedor)} <span class="muted xxs">· ${raw(tipoEs(v.tipo))} · ${raw(v.codigo)}</span></span>
          <span class="dd xxs muted">en ${v.dias} días</span>
          <span class="v cifra">${raw(money(v.canon))}</span></div>`).join(''))}</div>`,
    nota: 'El riel llega a 60 días y no a 90 porque el backend sólo mira 60 (<code>DIAS_POR_VENCER = 60</code>): un riel de 90 dibujaría un tercio vacío que se leería como «no hay vencimientos en noviembre», y lo que pasa es que no se miran. El corte de fin de mes importa porque cambia el estado del espacio, no sólo la fecha.',
    tabla: { titulo: 'Ver la tabla de vencimientos', cols: ['vence', 'días', 'proveedor', 'código', 'tipo', 'canon mensual'],
      filas: vencer.map(v => [v.fin, String(v.dias), v.proveedor, v.codigo, tipoEs(v.tipo), money(v.canon)]) } });

  const neg = brechas.filter(b => b.brecha_pct != null && b.brecha_pct < 0);
  const pos = brechas.filter(b => b.brecha_pct != null && b.brecha_pct > 0);
  const h5 = bloque({ clase: 'ancho', rotulo: 'H5 · cómo cobra contra el mercado',
    conclusion: t`<b>Contra el promedio de la plataforma, Mercamío cobra por debajo en
      <span class="n">${neg.length}</span> tipos —${raw(neg.slice(0, 3).map(b => pcSig(b.brecha_pct) + ' en ' + tipoEs(b.tipo)).join(', '))}—
      y por encima en <span class="n">${pos.length}</span>. La brecha del lado negativo no se puede sumar en plata sin decidir
      a cuántos contratos se le aplicaría, así que no se suma.</b>`,
    cuerpo: dumbbell(brechas.map(b => ({ tipo: b.tipo, cliente: b.canon_promedio_cliente, benchmark: b.benchmark_plataforma, brecha: b.brecha_pct })))
      + '<div class="leyenda" style="margin-top:6px"><span><i style="background:var(--dato);border-radius:50%"></i>lo que cobra Mercamío</span><span><i style="border:2px solid var(--ink-1);border-radius:50%;background:var(--surface)"></i>promedio de la plataforma para ese tipo</span><span class="muted">una sola escala: pesos por mes</span></div>',
    nota: 'El benchmark es el promedio de todos los clientes legibles para ese tipo, no la tarifa de referencia de Mercamío: esa nunca sale de su base. Batea no dibuja punto de cliente porque no tiene un solo contrato — un nulo no es un cero.',
    tabla: { titulo: 'Ver la tabla de canon vs benchmark', cols: ['tipo', 'cobra el cliente', 'benchmark', 'brecha'],
      filas: brechas.map(b => [tipoEs(b.tipo), b.canon_promedio_cliente == null ? 'sin contratos' : money(b.canon_promedio_cliente),
        money(b.benchmark_plataforma), b.brecha_pct == null ? 'sin referencia' : pcSig(b.brecha_pct)]) } });

  const h6 = bloque({ rotulo: 'H6 · una medición que no se puede hacer',
    conclusion: t`<b>${raw(sinTarifa.join(' y '))} no tienen tarifa de referencia cargada: <span class="n">${m.contratos_sin_tarifa}</span>
      de los <span class="n">${contratos}</span> contratos quedan fuera del cálculo del spread (<span class="n">${raw(pcSig(m.spread_pct))}</span>),
      y de batea no hay ni un contrato, así que su precio sugerido sale del benchmark y no del cliente.</b>`,
    cuerpo: '<p class="nota-graf">No es un gráfico: es un conteo y una advertencia. Se dice, no se rellena.</p>' });

  const volcanNuevo = rVolcan.datos.contratos + gondola.libres;
  const totalNuevo = rVolcan.datos.contratos_activos_total + gondola.libres;
  const aviso = t`<div class="aviso ancho"><h3>Las dos recomendaciones que se contradicen</h3>
    <p class="conclusion"><b>La recomendación de las ${gondola.libres} góndolas propone ofrecérselas a Gaseosas Volcán como primer
      candidato; la de concentración dice que Volcán ya pesa ${raw(pc(rVolcan.datos.participacion_pct))}. Las dos son correctas.
      Dárselas a él subiría su participación al <span class="n">${raw(pc(volcanNuevo / totalNuevo * 100, 0))}</span>
      (${volcanNuevo} de ${totalNuevo} contratos).</b></p>
    <p class="xs sec">La salida está en el capítulo 3: el segundo candidato, Café Tinajo, y el tercero, Cervecería Bordón.</p></div>`;

  return t`<div class="hall">${raw(h1)}${raw(h2)}${raw(h3)}${raw(h4)}${raw(h5)}${raw(h6)}${raw(aviso)}</div>`;
}

/* ---------- capítulo 3 · qué proponemos ----------------------------------- */
const PRIO_ES = { alta: 'alta', media: 'media', baja: 'baja' };
function accionDeRec(r, dt) {
  const d = r.datos, idx = idxEspacios(dt);
  const bench = dt.benchmark_plataforma;
  const salida = { acc: '', ev: '', nota: '', escalones: [] };
  const candidatos = (lista, ojo) => {
    if (!lista || !lista.length) return '<p class="xs sec">Todavía no hay a quién ofrecérselo desde adentro: este cliente no tiene un solo proveedor. No se rellena con proveedores de otros clientes — eso cruzaría la frontera.</p>';
    return t`<div class="cands">${raw(lista.map(c => {
      const p = dt.proveedores.find(x => x.nombre === c.proveedor);
      const alerta = p && p.participacion_pct >= 40;
      return t`<div class="cand ${raw(alerta ? 'ojo' : '')}"><b>${c.proveedor}</b>
        canon promedio hoy ${raw(money(c.canon_actual))}${raw(c.mismo_tipo ? ' · ya tiene este tipo' : ' · aún no tiene este tipo')}
        ${raw(alerta ? '<br><b>ojo: ya tiene el ' + pc(p.participacion_pct) + ' del cliente</b>' : '')}</div>`;
    }).join(''))}</div>`;
  };
  const codigosPorGrupo = (codigos, porTipo) => {
    const g = porTipo
      ? Object.entries(codigos.reduce((a, c) => { const k = idx[c] ? idx[c].tipo : 'otros'; (a[k] = a[k] || []).push(c); return a; }, {})).sort((a, b) => b[1].length - a[1].length)
      : repartoPorSede(dt, codigos).map(([s, v]) => [s, v.cods]);
    return t`<div class="codigos">${raw(g.map(([k, cods]) => t`<details><summary>${raw(porTipo ? tipoPl(k, cods.length) : k)} · ${cods.length}</summary>
      <div class="lista">${raw(cods.map(c => `<code>${esc(c)}</code>`).join(''))}</div></details>`).join(''))}</div>`;
  };

  if (r.tipo === 'espacio_libre') {
    const rep = repartoPorSede(dt, d.espacios);
    const libera = d.espacios.filter(c => idx[c] && idx[c].estado === 'se_libera');
    salida.acc = 'Ofrecer ' + d.libres + ' ' + tipoPl(d.tipo, d.libres) + ' en oferta a ' + money(d.precio_sugerido) + ' c/u';
    salida.ev = rep.map(([s, v]) => v.n + ' en ' + s).join(' · ')
      + (libera.length ? ' — ' + libera.length + (libera.length === 1 ? ' de ellas se libera' : ' de ellas se liberan')
         + ' este mes (' + libera.map(c => esc(c)).join(', ') + ')' : '');
    const b = bench[d.tipo];
    const brecha = d.origen_precio === 'cliente' && b ? (d.precio_sugerido / b - 1) * 100 : null;
    salida.escalones = [
      ['El precio, contra algo', d.origen_precio === 'cliente'
        ? 'Precio = el promedio que este cliente ya cobra por ' + tipoEs(d.tipo) + ' (<code>origen_precio: cliente</code>). El promedio de la plataforma es '
          + money(b) + ': está cobrando <b>' + pc(Math.abs(brecha)) + ' ' + (brecha < 0 ? 'menos' : 'más') + ' que el mercado</b>. Al benchmark, las mismas '
          + d.libres + ' valdrían ' + money(b * d.libres) + '.'
        : 'Este cliente no tiene contratos de ' + tipoEs(d.tipo) + ': el precio sale del benchmark de la plataforma (' + money(b) + '), no de él.'],
      ['A quién · candidatos que ya tienen este tipo acá', candidatos(d.candidatos)],
      ['Los ' + d.libres + ' códigos, por sede', codigosPorGrupo(d.espacios, false)]
    ];
  } else if (r.tipo === 'sede_subutilizada') {
    salida.acc = 'Concentrar la venta en ' + d.sede + ': ' + d.libres + ' espacios libres';
    salida.ev = pc(d.ocupacion_pct) + ' de ocupación, ' + dec(d.ocupacion_promedio_cliente_pct - d.ocupacion_pct) + ' puntos por debajo del promedio del cliente';
    salida.nota = 'Estos ' + d.libres + ' espacios ya están contados en las recomendaciones por tipo de arriba: es la misma plata mirada por sede. No se suma dos veces.';
    salida.escalones = [['Los ' + d.libres + ' códigos, por tipo', codigosPorGrupo(d.espacios_libres, true)]];
  } else if (r.tipo === 'contrato_por_vencer') {
    salida.acc = 'Renovar o reasignar ' + d.codigo + ' (' + d.proveedor + ') antes del ' + fechaCorta(d.fin);
    salida.ev = tipoEs(d.tipo) + ' · vence en ' + d.dias_para_vencer + ' días'
      + (d.fin <= '2026-09-30' ? ' · dentro del periodo: el espacio ya figura como «se libera»' : '');
  } else if (r.tipo === 'concentracion_proveedor') {
    salida.acc = 'Diversificar: bajar la dependencia de ' + d.proveedor;
    salida.ev = d.contratos + ' de ' + d.contratos_activos_total + ' contratos (' + pc(d.participacion_pct) + ') y ' + money(d.canon_total) + ' de canon';
    salida.nota = 'Este número es ingreso que YA entra, no ingreso nuevo: no se suma a la oportunidad. Es exposición.';
  } else if (r.tipo === 'precio_bajo_tarifa') {
    salida.acc = 'Subir el canon de ' + d.contratos_bajo_promedio + ' contratos de ' + tipoEs(d.tipo) + ' en la próxima renovación';
    salida.ev = 'están por debajo del promedio que el propio cliente cobra por ese tipo (' + money(d.canon_promedio) + ') · brecha ' + money(d.brecha_total);
    salida.nota = 'Ojo: esto compara contra el promedio del propio cliente (dispersión interna), no contra el benchmark. La comparación contra el mercado es otra y está en el capítulo 2, H5.';
    if (d.codigos && d.codigos.length) salida.escalones = [['Los códigos', codigosPorGrupo(d.codigos, false)]];
  } else if (r.tipo === 'sin_tarifa') {
    salida.acc = 'Cargar la tarifa de referencia de ' + d.tipos.map(tipoEs).join(' y ');
    salida.ev = 'sin tarifa no hay spread: hoy quedan contratos fuera de la medición y el precio sugerido de esos tipos sale del benchmark';
    salida.nota = 'Vale $ 0 y va igual en la lista: no hay plata que ganar, hay una medición que falta.';
  } else if (r.tipo === 'arranque') {
    const porTipo = d.espacios_por_tipo.slice().sort((a, b) => b.total - a.total);
    salida.acc = 'Salir a vender los ' + porTipo.reduce((a, x) => a + x.total, 0) + ' espacios de la primera sede';
    salida.ev = porTipo.map(x => x.total + ' ' + tipoPl(x.tipo, x.total)).join(' · ');
    salida.escalones = [
      ['El precio, contra algo', 'Todos los precios salen del <b>benchmark de la plataforma</b> por tipo (<code>origen_precio: benchmark</code>): el cliente todavía no cobra nada, así que no hay promedio propio con qué compararlo.'],
      ['A quién · candidatos', candidatos([])]
    ];
  }
  return salida;
}

function cap3() {
  const dt = det();
  const recs = dt.recomendaciones;
  const porPrio = { alta: [], media: [], baja: [] };
  recs.forEach(r => porPrio[r.prioridad].push(r));
  const valOferta = dt.oportunidades.reduce((a, o) => a + o.valor_estimado_mensual, 0);
  const m = CLI[SES.slug].metricas;

  let cabecera;
  if (esNuevo()) {
    cabecera = bloque({ rotulo: 'Capítulo 3 · qué proponemos', conclusion:
      t`<b>Hay una sola cosa que proponer y vale <span class="n">${raw(money(recs[0].valor_estimado_mensual))}</span> al mes:
        salir a vender las <span class="n">${dt.oportunidades.length}</span> caras que ya están cargadas, al promedio de la plataforma
        por tipo. No hay nada que renovar, nada que diversificar y ningún precio que corregir.</b>`,
      cuerpo: '<p class="nota-graf">El backend genera <code>arranque</code> sólo cuando no hay ni un contrato, y en ese caso no genera ninguna de las otras seis recomendaciones.</p>' });
  } else {
    const partes = DERM.oportunidad_nueva_partes;
    const cifra = (rot, val, sub, partesHtml) => t`<div class="cifra-rot">
      <div class="rotulo">${rot}</div><div class="v cifra-suelta">${raw(money(val))}</div>
      <div class="xxs muted">${raw(sub)}</div>${raw(partesHtml || '')}</div>`;
    cabecera = t`<section class="tarjeta">
      <div class="rotulo">Capítulo 3 · qué proponemos</div>
      <p class="conclusion"><b>Sumar las ${recs.length} recomendaciones da ${raw(money(DERM.valor_en_juego_bruto))} y ese número no existe:
        cuenta dos veces los mismos espacios y suma como oportunidad plata que ya está entrando. Lo que hay de verdad son
        tres cifras distintas, y no se suman entre sí.</b></p>
      <div class="tres-cifras">
        ${raw(cifra('Oportunidad nueva · al mes', DERM.oportunidad_nueva,
          pc(DERM.oportunidad_nueva_sobre_ingreso_pct) + ' de lo que factura hoy (' + money(m.ingreso_contratado_mes) + ')',
          t`<ul class="partes"><li><span>${raw(money(partes.espacios_libres))}</span> espacio sin vender (${dt.oportunidades.length} espacios en oferta)</li>
            <li><span>${raw(money(partes.precio_por_debajo_del_propio_promedio))}</span> canon por debajo del propio promedio</li>
            <li class="muted">de eso, <span>${raw(money(DERM.de_la_oportunidad_nueva_esta_en_una_sola_sede))}</span> está en TERRÓN</li></ul>`))}
        ${raw(cifra('Ingreso en riesgo · 60 días', DERM.ingreso_en_riesgo_60d,
          pc(DERM.ingreso_en_riesgo_60d / m.ingreso_contratado_mes * 100) + ' del ingreso · 9 contratos', ''))}
        ${raw(cifra('Ingreso expuesto a un proveedor', DERM.ingreso_expuesto_a_un_proveedor,
          pc(DERM.ingreso_expuesto_a_un_proveedor / m.ingreso_contratado_mes * 100) + ' del ingreso · Gaseosas Volcán', ''))}
      </div>
      <p class="nota-graf">Uno es plata que podría entrar, otro plata que podría salir y el tercero plata que ya entra pero de
        una sola mano. La suma cruda (<span class="tachado">${raw(money(DERM.valor_en_juego_bruto))}</span>) cuenta TERRÓN dentro de
        las góndolas y cuenta la concentración de Volcán como si fuera ingreso nuevo.</p></section>`;
  }

  const grupo = (p) => {
    if (!porPrio[p].length) return '';
    const total = porPrio[p].reduce((a, r) => a + r.valor_estimado_mensual, 0);
    const n = porPrio[p].length;
    const haySolape = recs.some(r => r.tipo === 'sede_subutilizada' || r.tipo === 'concentracion_proveedor');
    return t`<div class="grupo-prio"><div class="cab"><span class="p">prioridad ${raw(PRIO_ES[p])}</span>
        <span class="xxs muted">${n} ${raw(n === 1 ? 'acción' : 'acciones')}${raw(total ? ' · suman ' + money(total) + '/mes' + (haySolape ? ', con los solapes que dice la nota de arriba' : '') : '')}</span></div>
      ${raw(porPrio[p].map((r, i) => {
        const a = accionDeRec(r, dt);
        return t`<details class="rec"><summary>
          <span class="idx">${i + 1}</span>
          <span><span class="acc">${raw(a.acc)}</span><span class="ev">${raw(a.ev)}</span>
            ${raw(a.nota ? '<span class="ev ojo-nota"><b>' + a.nota + '</b></span>' : '')}</span>
          <span class="vale">${raw(r.valor_estimado_mensual ? money(r.valor_estimado_mensual) : '$ 0')}<em>${raw(r.valor_estimado_mensual ? 'al mes' : 'no hay plata: falta una medición')}</em></span>
          <span class="fl" aria-hidden="true">›</span></summary>
          ${raw(a.escalones.length ? t`<div class="cuerpo">${raw(a.escalones.map(([et, html]) =>
            t`<div class="escalon"><div class="et">${et}</div><div class="xs">${raw(html)}</div></div>`).join(''))}</div>` : '')}
        </details>`;
      }).join(''))}</div>`;
  };
  return cabecera + t`<section class="tarjeta">
    <div class="rotulo">${raw(recs.length === 1 ? 'La única acción' : 'Las ' + recs.length + ' acciones')} · orden: prioridad, y dentro de cada prioridad, valor</div>
    <p class="conclusion"><b>La prioridad es una palabra y es el orden: lo de arriba es lo de esta semana. Cada línea es una acción
      con un valor, no una descripción; el detalle se abre si se pide.</b></p>
    ${raw(grupo('alta'))}${raw(grupo('media'))}${raw(grupo('baja'))}</section>`;
}

/* ---------- capítulo 4 · los datos detrás --------------------------------- */
const T4 = { tab: 'espacios', sede: '', tipo: '', estado: '', q: '' };
function cap4() {
  const dt = det();
  const sedes = dt.sedes.map(s => s.sede);
  const tipos = Array.from(new Set(dt.espacios.map(e => e.tipo))).sort();

    <div id="t4-cont"></div>

function pintaTabla4() {
  const dt = det(), c = $('#t4-cont'); if (!c) return;
  const q = T4.q.trim().toLowerCase();
  const pasa = (o) => (!T4.sede || o.sede === T4.sede) && (!T4.tipo || o.tipo === T4.tipo) && (!T4.estado || o.estado === T4.estado);
  const busca = (...xs) => !q || xs.filter(Boolean).some(x => String(x).toLowerCase().includes(q));
  let cols = [], filas = [], nota = '';
  if (T4.tab === 'espacios') {
    cols = ['código', 'sede', 'cara', 'tipo', 'zona', 'm²', 'estado', 'proveedor', 'canon', 'vence'];
    filas = dt.espacios.filter(e => pasa(e) && busca(e.codigo, e.contrato && e.contrato.proveedor, e.contrato && e.contrato.marca))
      .map(e => [e.codigo, e.sede, e.cara || '—', tipoEs(e.tipo), e.zona || '—', e.area_m2 == null ? '—' : dec(e.area_m2),
        raw('<span class="pt-estado ' + e.estado + '"></span>' + ESTADO_ES[e.estado]), e.contrato ? e.contrato.proveedor : '—', e.contrato ? money(e.contrato.canon_mensual) : '—',
        e.contrato ? e.contrato.fin : '—']);
  } else if (T4.tab === 'contratos') {
    cols = ['código', 'sede', 'tipo', 'proveedor', 'marca', 'canon mensual', 'inicio', 'fin', 'días', 'arranca en el periodo'];
    filas = dt.espacios.filter(e => e.contrato && pasa(e) && busca(e.codigo, e.contrato.proveedor, e.contrato.marca))
      .map(e => [e.codigo, e.sede, tipoEs(e.tipo), e.contrato.proveedor, e.contrato.marca, money(e.contrato.canon_mensual),
        e.contrato.inicio, e.contrato.fin, String(e.contrato.dias_para_vencer), e.contrato.arranca_en_periodo ? 'sí' : 'no']);
    nota = dt.contratos_fuera_del_plano
      ? '<b>' + dt.contratos_fuera_del_plano + ' contratos más, sobre códigos que no están en el plano</b> (<code>contratos_fuera_del_plano</code>). Suman al ingreso y no suman a la ocupación, porque no hay cara que ocupar; si esa línea no está escrita, los dos números no cierran. El endpoint publica el conteo, no la lista: uno de ellos, PALMAR-VIT-03, aparece en vencimientos por ' + money(1850000) + '.'
      : '';
  } else if (T4.tab === 'proveedores') {
    cols = ['proveedor', 'espacios', 'tipos', 'sedes', 'canon total', 'canon promedio', 'participación', 'desde', 'vencen a 60 d'];
    filas = dt.proveedores.filter(p => (!T4.sede || p.sedes.includes(T4.sede)) && (!T4.tipo || p.tipos.includes(T4.tipo)) && busca(p.nombre))
      .map(p => [p.nombre, String(p.espacios), p.tipos.map(tipoEs).join(', '), p.sedes.join(', '), money(p.canon_total),
        money(p.canon_promedio), pc(p.participacion_pct), p.desde, String(p.contratos_por_vencer_60d)]);
    if (!filas.length) nota = 'Este cliente todavía no tiene proveedores.';
  } else if (T4.tab === 'movimientos') {
    cols = ['mes', 'movimiento', 'proveedor', 'código', 'tipo', 'canon mensual', 'fecha', 'motivo'];
    filas = [];
    dt.movimientos.forEach(mm => {
      mm.entradas.forEach(x => filas.push([mesCorto(mm.mes), 'entrada', x.proveedor, x.codigo, tipoEs(x.tipo), money(x.canon_mensual), x.fecha, '—']));
      mm.salidas.forEach(x => filas.push([mesCorto(mm.mes), 'salida', x.proveedor, x.codigo, tipoEs(x.tipo), money(x.canon_mensual), x.fecha, x.motivo]));
    });
    filas = filas.filter(f => (!T4.sede || f[3].startsWith(T4.sede)) && busca(f[2], f[3]));
    DIBUJOS['ses-mov'] = w => movimientosDivergentes(w, { movimientos: dt.movimientos, etiqueta: 'Entradas y salidas de contratos por mes, en pesos.' });
    nota = 'raw:mov';
  } else {
    cols = ['sede', 'tipo', 'espacios', 'estado', 'precio sugerido', 'origen del precio', 'valor mensual', 'candidatos'];
    const g = {};
    dt.oportunidades.filter(o => pasa(o) && busca(o.codigo)).forEach(o => {
      const k = o.sede + '·' + o.tipo;
      g[k] = g[k] || { sede: o.sede, tipo: o.tipo, n: 0, libera: 0, precio: o.precio_sugerido, origen: o.origen_precio, val: 0, cand: o.candidatos.map(c => c.proveedor) };
      g[k].n++; g[k].val += o.valor_estimado_mensual; if (o.estado === 'se_libera') g[k].libera++;
    });
    filas = Object.values(g).sort((a, b) => b.val - a.val).map(x => [x.sede, tipoEs(x.tipo), String(x.n),
      x.libera ? (x.n - x.libera) + (x.n - x.libera === 1 ? ' libre' : ' libres') + ' + ' + x.libera + ' se libera' + (x.libera > 1 ? 'n' : '')
               : (x.n === 1 ? 'libre' : 'libres'), money(x.precio), x.origen,
      money(x.val), x.cand.length ? x.cand.join(', ') : 'sin candidatos']);
    nota = 'Las ' + dt.oportunidades.length + ' oportunidades se muestran agrupadas por sede × tipo: ' + Object.keys(g).length +
      ' grupos en vez de ' + dt.oportunidades.length + ' filas. Los códigos uno por uno están en la pestaña «Espacios» y en cada recomendación del capítulo 3.';
  }
  const cuerpo = filas.length
    ? t`<div class="caja-tabla"><table class="tabla-datos"><thead><tr>${raw(cols.map(x => t`<th scope="col">${x}</th>`).join(''))}</tr></thead>
        <tbody>${raw(filas.map(f => t`<tr>${raw(f.map((v, i) => t`<td class="${raw(i > 0 && /^[$\d]/.test(String(v)) ? 'num' : '')}">${v}</td>`).join(''))}</tr>`).join(''))}</tbody></table></div>`
    : '<p class="nota-graf" style="padding:12px 0">Ninguna fila con estos filtros.</p>';
  const salMax = Math.max(...dt.movimientos.map(m => m.salidas.reduce((a, x) => a + x.canon_mensual, 0)));
  const mesPeor = dt.movimientos.find(m => m.salidas.reduce((a, x) => a + x.canon_mensual, 0) === salMax);
  let grafMov = '';
  if (T4.tab === 'movimientos') {
    grafMov = salMax === 0
      ? '<p class="conclusion"><b>Doce meses sin un solo movimiento: nada entró y nada salió. La tabla está vacía porque el cliente no ha firmado todavía.</b></p>'
      : t`<p class="conclusion" style="margin-bottom:6px"><b>Doce meses de entradas y salidas, en plata:
          ${raw(mesCorto(mesPeor.mes))} fue el peor mes —${raw(money(salMax))} que salieron,
          ${mesPeor.salidas.filter(x => x.motivo === 'cancelacion').length} de ellos cancelaciones de un solo proveedor.</b></p>
        <div class="plot" data-dibujo="ses-mov"></div>
        ${raw(ejeMeses(dt.movimientos.map(m => ({ periodo: m.mes, parcial: m.mes === '2026-09', sin_dato: false }))))}
        <div class="leyenda" style="margin:6px 0 10px"><span><i style="background:var(--dato)"></i>entradas (arriba del cero)</span>
          <span><i style="background:var(--dato-tenue)"></i>salidas (abajo del cero)</span>
          <span><i style="background:var(--ink-1);height:2px;width:14px"></i>saldo neto</span>
          <span class="muted">una sola escala: pesos por mes. La polaridad la lleva la posición sobre el cero, no el color.</span></div>`;
  }
  c.innerHTML = (nota === 'raw:mov' ? grafMov : '') + cuerpo
    + (nota && nota !== 'raw:mov' ? t`<p class="nota-graf" style="margin-top:8px">${raw(nota)}</p>` : '');
  pintar();
}

/* ---------- capítulo 5 · de dónde sale ------------------------------------ */
function cap5() {
  const dt = det();
  const items = [
    ['Periodo', dt.periodo + ' (' + dt.desde + ' a ' + dt.hasta + ') — <b>mes en curso, parcial</b>: 7 de 30 días.'],
    ['Generado', dt.generado_en + (D.cartera.de_cache ? ' · de caché' : ' · lectura en vivo')],
    ['Cobertura del benchmark', 'Promedio de la plataforma por tipo sobre los clientes legibles del periodo: <b>'
      + (CONS.clientes_total - CONS.clientes_con_error) + ' de ' + CONS.clientes_total + '</b>.'],
    ['Sin dato', esNuevo() ? 'Sin contratos: todos los precios sugeridos salen del benchmark, y no hay candidatos.'
      : 'Batea no tiene contratos → su precio sugerido viene del benchmark. Batea y robatope no tienen tarifa cargada → <b>sin spread</b> para esos tipos.'],
    ['Lo que no se muestra nunca', 'La tarifa de referencia del cliente. Sólo su relación (<code>spread_pct</code>) y si existe (<code>tarifa_configurada</code>). ' + esc(D._frontera.saneado)],
    ['De dónde sale cada llamada', '<code>' + esc(D._endpoints.detalle_cliente) + '</code><br><code>' + esc(D._endpoints.cartera) + '</code> (para el «contra la cartera»)<br><code>' + esc(D._endpoints.tendencia_cliente) + '</code>'],
    ['Bitácora', esc(D._frontera.bitacora)]
  ];
  return t`<section class="tarjeta"><div class="rotulo">Capítulo 5 · de dónde sale</div>
    <p class="conclusion"><b>Este mes está a un cuarto de camino: todo lo de arriba es de ${raw(dt.generado_en.slice(0, 10))} y de
      ${CONS.clientes_total - CONS.clientes_con_error} de ${CONS.clientes_total} clientes legibles. Lo que falta, falta con nombre.</b></p>
    <dl class="proc">${raw(items.map(([k, v]) => t`<dt>${k}</dt><dd>${raw(v)}</dd>`).join(''))}</dl>
    <p style="margin-top:6px"><a class="accion-2" style="display:inline-block;text-decoration:none" href="#" data-noop="1">→ Reporte de transparencia del cliente</a>
      <span class="xxs muted"> ${raw(esc(D._endpoints.reporte_transparencia))} — ya existe y no se rediseña acá.</span></p></section>`;
}

/* ---------- armado de la pieza 2 ------------------------------------------ */
function pintaSesion() {
  const dt = det(), c = CLI[SES.slug];
  $('#s-quien').innerHTML = t`<div class="rotulo">Sesión de asesoría</div>
    <div class="nb">${raw(dt.cliente.nombre)}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip">${raw(dt.cliente.estado_cuenta)}</span>
      <span class="chip">${raw(CLASE_ES[ADO[SES.slug].clasificacion])}</span></div>
    <div class="xxs muted">${raw(mesLargo(dt.periodo))} · parcial · ${dt.sedes.length} sede${raw(dt.sedes.length > 1 ? 's' : '')} · ${dt.espacios.length} espacios</div>
    <div class="cambia-cli">${raw([['mercamio', 'Mercamío'], ['almacenes-caribe', 'Almacenes Caribe']].map(([s, n]) =>
      t`<button type="button" data-cli="${s}" aria-current="${raw(SES.slug === s ? 'true' : 'false')}">${n}</button>`).join(''))}</div>`;
  const btn = $('#s-accion');
  if (esNuevo()) {
    btn.textContent = 'Preparar el informe del cliente';
    btn.disabled = true; btn.style.opacity = '.5'; btn.style.cursor = 'default';
    btn.title = 'En este ejemplo el informe armado es el de Mercamío.';
  } else {
    btn.textContent = 'Preparar el informe del cliente';
    btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = '';
    btn.title = '';
  }
  $('#s-caps').innerHTML = CAPS.map(([tt, dd], i) =>
    t`<button type="button" data-cap="${i + 1}" aria-current="${raw(SES.cap === i + 1 ? 'true' : 'false')}">
      <span class="k">${i + 1}</span><span class="t">${tt}</span><span class="d">${dd}</span></button>`).join('');
  const panes = [cap1, cap2, cap3, cap4, cap5];
  $('#s-panes').innerHTML = panes.map((f, i) =>
    t`<div class="cap-pane" data-pane="${i + 1}" data-activa="${raw(SES.cap === i + 1 ? '1' : '0')}">${raw(f())}</div>`).join('');
  if (SES.cap === 4) pintaTabla4();
  pintar();
}

/* ═══════════════ PIEZA 3 · EL INFORME PARA EL CLIENTE ════════════════════
   La misma historia, capítulos 1→3. Sin «los datos detrás», sin nada de la
   cartera, sin la palabra «fantasma» ni el orden de la cola. Se imprime.
   ═════════════════════════════════════════════════════════════════════════ */
function pintaInforme() {
  const dt = D.detalle_cliente, m = CLI.mercamio.metricas;
  const serie = D.tendencia_cliente.serie, ago = serie[10];
  const enOferta = dt.oportunidades.length;
  const valOferta = dt.oportunidades.reduce((a, o) => a + o.valor_estimado_mensual, 0);
  const libres = dt.espacios.filter(e => e.estado === 'libre').length;
  const seLibera = dt.espacios.filter(e => e.estado === 'se_libera').length;
  const contratos = dt.espacios.filter(e => e.contrato).length + dt.contratos_fuera_del_plano;
  const terron = dt.recomendaciones.find(r => r.id === 'sede_subutilizada:TERRON');
  const gond = dt.resumen_por_tipo.find(x => x.tipo === 'gondola');
  const volcan = dt.proveedores[0];
  const brechas = DERM.canon_vs_benchmark_por_tipo.filter(b => b.brecha_pct != null).slice().sort((a, b) => a.brecha_pct - b.brecha_pct);
  const vencer = dt.recomendaciones.filter(r => r.tipo === 'contrato_por_vencer').map(r => r.datos).sort((a, b) => a.dias_para_vencer - b.dias_para_vencer);
  const altas = dt.recomendaciones.filter(r => r.prioridad === 'alta');

  DIBUJOS['inf-unidades'] = w => unidadesPorSede(w, { sedes: dt.sedes, espacios: dt.espacios, modo: 'agregado' });

  const kpi = (rot, val, sub) => t`<div class="tile"><div class="rotulo">${rot}</div>
    <div class="v cifra-suelta">${raw(val)}</div><div class="contra">${raw(sub)}</div></div>`;

  const s1 = t`<section><h2>1 · Dónde está Mercamío este mes</h2>
    <div class="kpis">
      ${raw(kpi('Ingreso contratado', money(m.ingreso_contratado_mes),
        '<b class="delta">' + moneySig(m.ingreso_contratado_mes - ago.ingreso_contratado_mes) + '</b> · <b class="delta">'
        + pcSig((m.ingreso_contratado_mes - ago.ingreso_contratado_mes) / ago.ingreso_contratado_mes * 100)
        + '</b> contra agosto (' + money(ago.ingreso_contratado_mes) + '). El mes va por la mitad.'))}
      ${raw(kpi('Ocupación', pc(m.ocupacion_pct), (m.espacios_comercializables - libres - seLibera) + ' ocupados + ' + seLibera
        + ' que se liberan, de ' + m.espacios_comercializables + '. Agosto: ' + pc(ago.ocupacion_pct) + ' · <b class="delta">'
        + ptsSig(m.ocupacion_pct - ago.ocupacion_pct) + '</b>'))}
      ${raw(kpi('Contratos activos', String(contratos), volcan.espacios + ' de ellos son de un solo proveedor.'))}
      ${raw(kpi('Espacios en oferta', enOferta + ' de ' + m.espacios_comercializables,
        pc(enOferta / m.espacios_comercializables * 100) + ' del inventario. Valen <b>' + money(valOferta) + '</b> al mes al precio que usted ya cobra.'))}
    </div>
    <p class="conclusion"><b>Sus ${dt.sedes.length} sedes no rinden igual: TERRÓN, que entró en junio, está al
      ${raw(pc(terron.datos.ocupacion_pct))} y tiene ${terron.datos.libres} de los ${libres} espacios libres.</b></p>
    <div data-dibujo="inf-unidades"></div>
    <div class="leyenda"><span><i style="background:var(--ocupado)"></i>ocupado</span>
      <span><i style="background:var(--libre)"></i>libre o se libera</span>
      <span class="muted">el largo de la barra son los espacios de la sede; el relleno, los que están vendidos</span></div>
    ${raw(tablaEquiv({ titulo: 'La misma información en tabla', cols: ['sede', 'espacios', 'ocupados', 'libres', 'ocupación'],
      filas: dt.sedes.slice().sort((a, b) => a.ocupacion_pct - b.ocupacion_pct)
        .map(s => [s.sede, String(s.espacios), String(s.ocupados), String(s.libres), pc(s.ocupacion_pct)]) }))}
  </section>`;

  const s2 = t`<section><h2>2 · Qué encontramos</h2>
    <div class="acciones-informe">
      <div class="acc-inf"><span class="i">a</span><span><span class="q">Casi todo lo vacío está en una sola sede</span>
        <span class="p">TERRÓN tiene ${terron.datos.libres} de los ${libres} espacios libres y está al ${raw(pc(terron.datos.ocupacion_pct))} de ocupación,
          ${raw(dec(terron.datos.ocupacion_promedio_cliente_pct - terron.datos.ocupacion_pct))} puntos por debajo de su propio promedio.</span></span>
        <span class="v">${raw(money(terron.valor_estimado_mensual))}<em>al mes si se vende</em></span></div>
      <div class="acc-inf"><span class="i">b</span><span><span class="q">El inventario es góndola y la góndola no se está vendiendo</span>
        <span class="p">${gond.total} de sus ${dt.espacios.length} espacios son caras de góndola y ${gond.libres} están libres:
          el ${raw(pc(gond.libres / libres * 100, 0))} de todo lo vacío.</span></span>
        <span class="v">${gond.libres}<em>caras libres</em></span></div>
      <div class="acc-inf"><span class="i">c</span><span><span class="q">Cobra por debajo del mercado en ${brechas.filter(b => b.brecha_pct < 0).length} tipos</span>
        <span class="p">Contra el promedio de la plataforma (el de todos los supermercados que usan RECABRA, sin nombres):
          ${raw(brechas.filter(b => b.brecha_pct < 0).map(b => pcSig(b.brecha_pct) + ' en ' + tipoEs(b.tipo)).join(', '))}.
          Por encima en ${raw(brechas.filter(b => b.brecha_pct > 0).map(b => tipoEs(b.tipo)).join(' y '))}.</span></span>
        <span class="v">${raw(pcSig(brechas[0].brecha_pct))}<em>la brecha más grande</em></span></div>
      <div class="acc-inf"><span class="i">d</span><span><span class="q">${vencer.length} contratos se caen antes de noviembre</span>
        <span class="p">${raw(vencer.filter(v => v.fin <= '2026-09-30').length)} de ellos dentro de septiembre
          (${raw(vencer.filter(v => v.fin <= '2026-09-30').map(v => fechaCorta(v.fin)).join(', '))}).</span></span>
        <span class="v">${raw(money(DERM.ingreso_en_riesgo_60d))}<em>al mes en juego</em></span></div>
      <div class="acc-inf"><span class="i">e</span><span><span class="q">Más de la mitad del ingreso viene de un solo proveedor</span>
        <span class="p">${raw(volcan.nombre)} tiene ${volcan.espacios} de sus ${contratos} contratos
          (${raw(pc(volcan.participacion_pct))}) y ${raw(pc(volcan.canon_total / m.ingreso_contratado_mes * 100))} del ingreso.
          ${volcan.contratos_por_vencer_60d} de esos contratos vencen en los próximos 60 días.</span></span>
        <span class="v">${raw(money(volcan.canon_total))}<em>al mes de un solo cliente</em></span></div>
    </div>
    ${raw(tablaEquiv({ titulo: 'Lo que cobra usted contra el promedio de la plataforma, por tipo',
      cols: ['tipo de espacio', 'lo que usted cobra', 'promedio de la plataforma', 'diferencia'],
      filas: DERM.canon_vs_benchmark_por_tipo.map(b => [tipoEs(b.tipo),
        b.canon_promedio_cliente == null ? 'sin contratos de este tipo' : money(b.canon_promedio_cliente),
        money(b.benchmark_plataforma), b.brecha_pct == null ? 'sin referencia' : pcSig(b.brecha_pct)]) }))}
  </section>`;

  const s3 = t`<section><h2>3 · Qué proponemos para ${raw(mesLargo(dt.periodo))}</h2>
    <p class="conclusion"><b>Seis acciones para este mes. Las tres primeras son espacio que hoy no factura; las tres últimas son
      ingreso que ya tiene y que se le puede caer en las próximas cuatro semanas.</b></p>
    <div class="acciones-informe">${raw(altas.map((r, i) => {
      const a = accionDeRec(r, dt);
      return t`<div class="acc-inf"><span class="i">${i + 1}</span>
        <span><span class="q">${raw(a.acc)}</span><span class="p">${raw(a.ev)}</span></span>
        <span class="v">${raw(money(r.valor_estimado_mensual))}<em>al mes</em></span></div>`;
    }).join(''))}</div>
    <div class="tres-cifras" style="margin-top:12px">
      <div class="cifra-rot"><div class="rotulo">Oportunidad nueva · al mes</div>
        <div class="v cifra-suelta">${raw(money(DERM.oportunidad_nueva))}</div>
        <div class="xxs muted">${raw(pc(DERM.oportunidad_nueva_sobre_ingreso_pct))} de lo que factura hoy</div>
        <ul class="partes"><li><span>${raw(money(DERM.oportunidad_nueva_partes.espacios_libres))}</span> espacio sin vender</li>
          <li><span>${raw(money(DERM.oportunidad_nueva_partes.precio_por_debajo_del_propio_promedio))}</span> canon por debajo de su propio promedio</li></ul></div>
      <div class="cifra-rot"><div class="rotulo">Ingreso en riesgo · 60 días</div>
        <div class="v cifra-suelta">${raw(money(DERM.ingreso_en_riesgo_60d))}</div>
        <div class="xxs muted">${vencer.length} contratos por vencer</div></div>
      <div class="cifra-rot"><div class="rotulo">Ingreso de un solo proveedor</div>
        <div class="v cifra-suelta">${raw(money(DERM.ingreso_expuesto_a_un_proveedor))}</div>
        <div class="xxs muted">${raw(pc(volcan.canon_total / m.ingreso_contratado_mes * 100))} del ingreso del mes</div></div>
    </div>
    <p class="nota-graf">Las tres cifras no se suman entre sí: una es plata que podría entrar, otra plata que podría salir y la
      tercera plata que ya entra, pero de una sola mano.</p>
  </section>`;

  $('#i-hoja').innerHTML = t`<header style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px">
      <div><div class="kicker">RECABRA · informe de asesoría</div>
        <h1 style="margin-top:6px">${raw(dt.cliente.nombre)}</h1>
        <div class="sm sec">${raw(mesLargo(dt.periodo))} · del ${raw(dt.desde)} al ${raw(dt.hasta)} · mes en curso</div></div>
      <button type="button" class="accion no-print" id="btn-imprimir">Imprimir el informe</button></header>
    <p class="conclusion" style="font-size:var(--t-base)"><b>Mercamío tiene ${enOferta} espacios sin vender de
      ${dt.espacios.length} y ${raw(money(valOferta))} mensuales sobre la mesa: el
      ${raw(pc(valOferta / m.ingreso_contratado_mes * 100, 0))} de lo que factura hoy. Dos de cada tres de esos espacios están
      en Mercamío TERRÓN.</b></p>
    ${raw(s1)}${raw(s2)}${raw(s3)}
    <div class="pie"><span><b>Periodo:</b> ${raw(dt.periodo)} (parcial)</span>
      <span><b>Generado:</b> ${raw(dt.generado_en)}</span>
      <span><b>Precios de referencia:</b> promedio de la plataforma por tipo, anónimo</span>
      <span><b>RECABRA</b> · gestión de espacios comerciales</span></div>
    <p class="xxs muted">Todo lo que en la consola se ve al pasar el mouse, en este informe está escrito.</p>`;
}

/* ═══════════════════════════ arranque ════════════════════════════════════ */
function irA(pieza) {
  $$('.pieza').forEach(p => p.dataset.activa = (p.id === 'pz-' + pieza) ? '1' : '0');
  $$('.piezas button').forEach(b => b.setAttribute('aria-current', String(b.dataset.pieza === pieza)));
  pintar();
}
function init() {
  /* periodo: el ejemplo trae un solo periodo con detalle, y se dice */
  const sel = $('#periodo');
  sel.innerHTML = SERIE_C.slice().reverse().map(p =>
    t`<option value="${p.periodo}"${raw(p.periodo === '2026-09' ? ' selected' : ' disabled')}>${raw(mesLargo(p.periodo))}${raw(p.sin_dato ? ' · sin snapshot' : '')}</option>`).join('');
  sel.title = 'Este ejemplo trae un periodo con detalle: 2026-09.';

  pintaTitular(); pintaCola(); pintaLado();
  pintaSesion(); pintaInforme(); pintar();

  document.addEventListener('click', ev => {
    const b = ev.target.closest('button, a[data-noop]');
    if (!b) return;
    if (b.dataset.noop) { ev.preventDefault(); return; }
    if (b.dataset.pieza) return irA(b.dataset.pieza);
    if (b.dataset.sesion) { SES.slug = b.dataset.sesion; SES.cap = 1; pintaSesion(); irA('sesion'); return; }
    if (b.dataset.va === 'operativo') { const d = $('#cajon-operativo'); d.open = true; d.scrollIntoView({ block: 'nearest' }); return; }
    if (b.dataset.cli) { if (SES.slug === b.dataset.cli) return; SES.slug = b.dataset.cli; SES.cap = 1; pintaSesion(); return; }
    if (b.dataset.cap) {
      SES.cap = +b.dataset.cap;
      $$('#s-caps button').forEach(x => x.setAttribute('aria-current', String(+x.dataset.cap === SES.cap)));
      $$('.cap-pane').forEach(p => p.dataset.activa = (+p.dataset.pane === SES.cap) ? '1' : '0');
      if (SES.cap === 4) pintaTabla4();
      pintar(); return;
    }
    if (b.dataset.tab) { T4.tab = b.dataset.tab; $$('.tabs button').forEach(x => x.setAttribute('aria-current', String(x.dataset.tab === T4.tab))); pintaTabla4(); return; }
    if (b.id === 's-accion') { irA('informe'); return; }
    if (b.id === 'btn-imprimir') { window.print(); return; }
    if (b.id === 'tema-btn') {
      const osc = document.documentElement.dataset.tema === 'oscuro';
      document.documentElement.dataset.tema = osc ? 'claro' : 'oscuro';
      b.textContent = osc ? 'Oscuro' : 'Claro';
      b.setAttribute('aria-pressed', String(!osc));
      return;
    }
  });
  const onFiltro = ev => {
    const id = ev.target.id || '';
    if (!/^f-(sede|tipo|estado|q)$/.test(id)) return;
    T4[id.slice(2)] = ev.target.value;
    pintaTabla4();
  };
  document.addEventListener('input', onFiltro);
  document.addEventListener('change', onFiltro);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

</script>
