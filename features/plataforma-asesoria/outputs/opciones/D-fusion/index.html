<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RECABRA · La fusión</title>
<style>
/* ============================================================================
   D · LA FUSIÓN
   Organización y UX de C (capítulos, rail, tarjetas de acción rotuladas,
   chips grises, riel de vencimientos rotulado en plata, las dos barras por
   proveedor). Presentación del dato de A (la referencia DENTRO del dibujo,
   la ruta del dato en mono bajo cada frase, la escalera de cuatro escalones,
   las anotaciones sobre la línea, el informe en 3 páginas con el titular a
   todo el ancho). El detalle que escala de B (una fila de filtros arriba,
   pestañas con conteo) — pero vive en UN panel lateral al que se llega desde
   cualquier cifra de cualquier capítulo.

   TOKENS — copiados de frontend/src/tema.css (primitivos + semánticos), con
   la escala tipográfica de vender.css. Lo único nuevo son --dato y
   --dato-tenue: la tinta de dato, que no es ninguno de los cuatro estados.
   ========================================================================== */
:root{
  --n-1000:#04070A; --n-900:#0B1116; --n-850:#101820; --n-800:#16212A;
  --n-700:#1F2C36;  --n-400:#788994; --n-000:#FFFFFF;
  --p-000:#FFFFFF; --p-050:#F7F8F5; --p-100:#EFF1ED; --p-200:#E4E7E1;
  --y-400:#FFE067; --y-500:#FFD028; --y-700:#8A6100;

  --f-display:"Helvetica Neue","Segoe UI Variable Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  --f-text:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;

  /* la escala del producto (vender.css). Nada por encima de 30 px. */
  --t-3xs:10px; --t-2xs:11.5px; --t-xs:12.5px; --t-sm:13.5px;
  --t-base:15px; --t-md:17.5px; --t-lg:21px; --t-xl:30px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px; --hair:1px;
  --dur-1:130ms; --dur-2:240ms; --ease:cubic-bezier(.22,.68,.24,1);

  /* semánticos · CLARO (por defecto) */
  --bg:#EFF1ED; --surface:#FFFFFF; --surface-2:#F7F8F5; --surface-3:#E4E7E1;
  --line-soft:#F0F1F1; --line:#DDDEDE; --line-strong:#BBBCBE;
  --ink-1:#0A1014; --ink-2:#4A5B65; --ink-3:#54646E;
  /* --ink-4 (#68788A) EXISTE en tema.css y NO se usa para texto: da 3,98:1
     sobre el papel --bg. Todo texto secundario va con --ink-3 (5,39:1). */

  --libre:#00805A; --libre-suave:#E0F0EB; --libre-borde:#9ECFC0; --libre-txt:#006B4C;
  --entra:#CE8A0A; --entra-suave:#F9F1E2; --entra-borde:#ECD3A2; --entra-txt:#8A5A06;
  --ocupado:#D8342E; --ocupado-suave:#FAE7E6; --ocupado-borde:#F0B2B0; --ocupado-txt:#B32720;
  --resto:#AAB3BE; --resto-suave:#ECEEF1; --resto-borde:#D5D9DF;

  --signal:#F2B300; --signal-borde:#A87C00; --on-signal:#120E00;

  --dato:#2E63C8; --dato-tenue:#8FB3E8; --dato-medio:#5B85D6;

  --sh-1:0 1px 2px rgba(16,21,30,.07);
  --sh-2:0 10px 28px -14px rgba(16,21,30,.24),0 2px 6px rgba(16,21,30,.05);
  --sh-3:-18px 0 48px -18px rgba(16,21,30,.30);
}
html[data-tema="oscuro"]{
  color-scheme:dark;
  --bg:#04070A; --surface:#0B1116; --surface-2:#101820; --surface-3:#16212A;
  --line-soft:#1A1F24; --line:#262B30; --line-strong:#3E4347;
  --ink-1:#EDF3F2; --ink-2:#9DAEB6; --ink-3:#8FA0A9;

  --libre:#00BE86; --libre-suave:#092D28; --libre-borde:#065A45; --libre-txt:#00BE86;
  --entra:#F5A524; --entra-suave:#302918; --entra-borde:#6D4F1C; --entra-txt:#F5A524;
  --ocupado:#F4544E; --ocupado-suave:#301C1F; --ocupado-borde:#6D2D2E; --ocupado-txt:#F4544E;
  --resto:#33414F; --resto-suave:#1B242D; --resto-borde:#293541;

  --signal:#FFD028; --signal-borde:transparent; --on-signal:#0A0C06;
  --dato:#4C89E8; --dato-tenue:#2F5EA6; --dato-medio:#3E72C4;

  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 12px 34px -14px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.4);
  --sh-3:-18px 0 48px -18px rgba(0,0,0,.8);
}

/* ── base ───────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink-1);
  font-family:var(--f-text); font-size:var(--t-sm); line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
body.documento{overflow:auto;height:auto}
h1,h2,h3,h4,p,ul,ol,figure,table{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid var(--dato);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cifra{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
.rotulo{font-family:var(--f-mono);font-size:var(--t-3xs);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.sec{color:var(--ink-2)} .ter{color:var(--ink-3)}
.oculto{display:none !important}
.solo-lector{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── barra superior · 48 px ─────────────────────────────────────────────── */
.barra{height:48px;flex:0 0 48px;background:var(--surface);border-bottom:var(--hair) solid var(--line);
  display:flex;align-items:center;gap:var(--s4);padding:0 var(--s4);position:relative;z-index:30}
.marca{font-family:var(--f-display);font-weight:800;font-size:var(--t-sm);letter-spacing:-.01em;white-space:nowrap}
.marca span{font-weight:400;color:var(--ink-3)}
.piezas{display:flex;gap:2px;background:var(--surface-2);border:var(--hair) solid var(--line);
  border-radius:var(--r-pill);padding:2px}
.piezas button{padding:4px 13px;border-radius:var(--r-pill);font-size:var(--t-xs);font-weight:600;color:var(--ink-2)}
.piezas button[aria-current="true"]{background:var(--surface);color:var(--ink-1);box-shadow:var(--sh-1)}
.barra .der{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.ctrl{border:var(--hair) solid var(--line);border-radius:var(--r-sm);padding:4px 8px;
  font-size:var(--t-xs);background:var(--surface-2);color:var(--ink-1)}
select.ctrl{padding-right:22px}

/* ── vistas ─────────────────────────────────────────────────────────────── */
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.vista{flex:1 1 auto;min-height:0;display:none;flex-direction:column;padding:var(--s3) var(--s4) var(--s4)}
.vista[data-on="1"]{display:flex}
.vista.doc{overflow:auto;display:none}
.vista.doc[data-on="1"]{display:block}
.cabecera{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);
  flex:0 0 auto;padding-bottom:var(--s3);flex-wrap:wrap}
.cabecera h1{font-family:var(--f-display);font-weight:800;font-size:var(--t-md);letter-spacing:-.015em;line-height:1.2}
.cabecera .sub{color:var(--ink-3);font-size:var(--t-2xs);margin-top:2px}

/* ── la frase-conclusión y su ruta ──────────────────────────────────────── */
.frase{font-family:var(--f-display);font-size:var(--t-md);font-weight:800;line-height:1.3;
  letter-spacing:-.012em;max-width:96ch}
.frase.chica{font-size:var(--t-base);line-height:1.34;max-width:88ch}
.frase em{font-style:normal;font-family:var(--f-mono);font-weight:700;font-size:.94em;letter-spacing:-.02em}
.ruta{font-family:var(--f-mono);font-size:var(--t-3xs);color:var(--ink-3);margin-top:5px;
  word-break:break-word;line-height:1.4}
.nota{font-size:var(--t-xs);color:var(--ink-2);max-width:92ch;line-height:1.45}
.nota b{color:var(--ink-1)}

/* ── tarjetas ───────────────────────────────────────────────────────────── */
.caja{background:var(--surface);border:var(--hair) solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
.caja.plana{background:transparent;border:0;padding:0}

/* ── chips · TODOS grises o en tinta. El rojo/ámbar/verde SÓLO para los
      tres estados del espacio. ─────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-pill);
  font-family:var(--f-mono);font-size:var(--t-3xs);font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;border:var(--hair) solid var(--line);background:var(--surface-2);
  color:var(--ink-2);white-space:nowrap}
.chip .pt{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.chip.fuerte{border-color:var(--ink-2);color:var(--ink-1)}
.chip.libre{background:var(--libre-suave);border-color:var(--libre-borde);color:var(--libre-txt)}
.chip.entra{background:var(--entra-suave);border-color:var(--entra-borde);color:var(--entra-txt)}
.chip.ocupado{background:var(--ocupado-suave);border-color:var(--ocupado-borde);color:var(--ocupado-txt)}
.chip.resto{background:var(--resto-suave);border-color:var(--resto-borde);color:var(--ink-2)}

.orden{font-family:var(--f-mono);font-weight:700;font-size:var(--t-2xs);color:var(--surface);
  background:var(--ink-1);width:20px;height:20px;border-radius:var(--r-xs);
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.orden.suave{background:var(--surface-3);color:var(--ink-2)}

/* ── botones ────────────────────────────────────────────────────────────── */
.btn-signal{background:var(--signal);color:var(--on-signal);border:var(--hair) solid var(--signal-borde);
  border-radius:var(--r-md);padding:7px 14px;font-size:var(--t-xs);font-weight:700;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-signal:hover{filter:brightness(1.05)}
.btn{border:var(--hair) solid var(--line);border-radius:var(--r-sm);padding:5px 11px;
  font-size:var(--t-xs);font-weight:600;background:var(--surface-2);color:var(--ink-1);white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.lupa::before{content:"⌕ ";font-weight:400;color:var(--ink-3)}
.enlace{color:var(--dato);font-weight:600;text-decoration:none;border-bottom:1px solid transparent;cursor:pointer}
.enlace:hover{border-bottom-color:var(--dato)}

/* ── el rail de capítulos (de C) ────────────────────────────────────────── */
.ses{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:172px minmax(0,1fr);gap:var(--s5)}
.rail{border-left:2px solid var(--line);display:flex;flex-direction:column;gap:1px;align-self:start}
.rail button{display:block;width:100%;padding:6px 11px;margin-left:-2px;border-left:2px solid transparent;
  font-size:var(--t-2xs);color:var(--ink-3);line-height:1.3}
.rail button b{display:block;color:var(--ink-2);font-weight:700;font-size:var(--t-xs)}
.rail button[aria-current="true"]{border-left-color:var(--dato);color:var(--ink-2)}
.rail button[aria-current="true"] b{color:var(--ink-1)}
.rail button:hover b{color:var(--ink-1)}
.rail .rail-pie{margin-top:var(--s3);padding:0 11px;font-size:var(--t-3xs);color:var(--ink-3);line-height:1.45}

.caps{position:relative;min-height:0;display:flex;flex-direction:column}
.cap{display:none;flex-direction:column;gap:var(--s2);min-height:0;height:100%;overflow:auto}
.cap[data-on="1"]{display:flex}
.cap-cab{flex:0 0 auto}

/* ── rejillas de capítulo ───────────────────────────────────────────────── */
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:var(--s4);min-height:0;flex:1 1 auto}
.dos.izq-ancha{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:var(--s2);min-height:0;min-width:0}

/* ── el conmutador de módulos ───────────────────────────────────────────── */
.modos{display:flex;gap:3px;flex-wrap:wrap;flex:0 0 auto}
.modos button{padding:4px 10px;border-radius:var(--r-pill);border:var(--hair) solid var(--line);
  background:var(--surface-2);font-size:var(--t-2xs);font-weight:600;color:var(--ink-2)}
.modos button[aria-current="true"]{background:var(--ink-1);color:var(--surface);border-color:var(--ink-1)}
.panelito{background:var(--surface);border:var(--hair) solid var(--line);border-radius:var(--r-lg);
  padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);min-height:0;flex:0 1 auto;overflow:auto}

/* ── la cifra grande: UNA por pantalla, 30 px como máximo ───────────────── */
.grande{font-family:var(--f-mono);font-variant-numeric:proportional-nums;font-weight:700;
  font-size:var(--t-xl);line-height:1.05;letter-spacing:-.035em;display:block}
.delta{display:flex;align-items:baseline;gap:6px;font-size:var(--t-xs);margin-top:5px;flex-wrap:wrap}
.delta .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:var(--t-sm)}

/* ── figuras ────────────────────────────────────────────────────────────── */
figure{margin:0;min-width:0}
.fig{width:100%;height:auto;display:block;overflow:visible}

/* ── tablas ─────────────────────────────────────────────────────────────── */
.tbl{font-size:var(--t-xs)}
.tbl th,.tbl td{text-align:left;padding:4px 9px;border-bottom:var(--hair) solid var(--line-soft);vertical-align:top}
.tbl thead th{font-family:var(--f-mono);font-size:var(--t-3xs);font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:var(--hair) solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:2}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td .mono{white-space:nowrap}
.tbl tbody tr:nth-child(even){background:var(--surface-2)}
.tbl caption{text-align:left;font-size:var(--t-2xs);color:var(--ink-3);padding:0 0 6px}
.tbl.compacta th,.tbl.compacta td{padding:3px 8px}
.scroll-x{overflow-x:auto;max-width:100%}

.comp{border:var(--hair) solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.comp table{font-size:var(--t-xs)}
.comp th,.comp td{padding:4px 9px;border-bottom:var(--hair) solid var(--line-soft);text-align:left}
.comp tr:last-child th,.comp tr:last-child td{border-bottom:0}
.comp thead th{font-family:var(--f-mono);font-size:var(--t-3xs);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;line-height:1.25}
.comp td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.comp .tachado{color:var(--ink-3);text-decoration:line-through}

/* ── la cola de llamadas ────────────────────────────────────────────────── */
.cola{display:flex;flex-direction:column;border-top:var(--hair) solid var(--line);min-height:0;overflow:auto}
.fila{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,2fr) 134px 64px;
  grid-template-rows:auto auto;gap:2px var(--s2);align-items:center;padding:4px;
  border-bottom:var(--hair) solid var(--line-soft)}
.fila .orden{grid-row:1/3}
.fila .met{grid-column:2/6;grid-row:2;font-family:var(--f-mono);font-size:var(--t-3xs);color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila:hover{background:var(--surface-2)}
.fila .nom{font-weight:700;font-size:var(--t-xs);min-width:0}
.fila .razon{font-size:var(--t-2xs);color:var(--ink-2);min-width:0;line-height:1.3}
.fila .razon .ch{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}
.fila .plata{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.fila .plata b{display:block;font-size:var(--t-xs);line-height:1.25}
.fila .plata .r{font-family:var(--f-mono);font-size:var(--t-3xs);color:var(--ink-3);letter-spacing:.04em;
  text-transform:uppercase;line-height:1.2;display:block}
.fila .ir{text-align:right}

/* ── hallazgos y acciones: la lista-módulo de la izquierda ──────────────── */
.lista{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:auto;flex:0 1 auto}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:var(--s2);align-items:start;
  padding:5px var(--s2);border:var(--hair) solid var(--line);border-radius:var(--r-md);
  background:var(--surface);width:100%;transition:border-color var(--dur-1) var(--ease)}
.item:hover{border-color:var(--line-strong)}
.item[aria-current="true"]{border-color:var(--dato);box-shadow:inset 3px 0 0 var(--dato)}
.item .tit{font-size:var(--t-xs);font-weight:700;line-height:1.25;display:block}
.item .ev{font-size:var(--t-2xs);color:var(--ink-2);margin-top:1px;line-height:1.3;display:block}
.item .val{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;
  font-size:var(--t-2xs);font-weight:700;white-space:nowrap}
.item .val span{display:block;font-size:var(--t-3xs);font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}

/* ── el aviso · y el cruce entre dos acciones que se contradicen ────────── */
.aviso{border:var(--hair) solid var(--line);border-left:3px solid var(--ink-2);border-radius:var(--r-sm);
  background:var(--surface-2);padding:6px var(--s3);font-size:var(--t-2xs);color:var(--ink-2);line-height:1.4}
.aviso b{color:var(--ink-1)}
.aviso.cruce{border-left-color:var(--ocupado)}

/* ── la escalera de la acción (los cuatro escalones de A) ───────────────── */
.esc{display:flex;flex-direction:column;gap:var(--s2)}
.esc-l{display:grid;grid-template-columns:78px minmax(0,1fr);gap:var(--s2);font-size:var(--t-xs);color:var(--ink-2);
  align-items:baseline}
.esc-l .k{font-family:var(--f-mono);font-size:var(--t-3xs);font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);padding-top:1px}
.esc-l b{color:var(--ink-1)}
.cands{display:flex;gap:5px;flex-wrap:wrap}
.cand{border:var(--hair) solid var(--line);border-radius:var(--r-sm);padding:3px 8px;font-size:var(--t-2xs);
  background:var(--surface-2);display:inline-flex;gap:6px;align-items:baseline}
.cand b{font-size:var(--t-xs)}
.cand.ojo{border-color:var(--line-strong);background:var(--surface-3)}
.cand .adv{color:var(--ink-1);font-weight:700}

/* ── las tres cifras del valor en juego ─────────────────────────────────── */
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.vbox{border:var(--hair) solid var(--line);border-radius:var(--r-md);padding:var(--s2) var(--s3);background:var(--surface-2)}
.vbox.eje{border-color:var(--dato)}
.vbox .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700;
  font-size:var(--t-lg);letter-spacing:-.03em;display:block;line-height:1.15}
.vbox .r{display:block;margin-bottom:3px}
.vbox .partes{font-size:var(--t-3xs);color:var(--ink-2);margin-top:4px;line-height:1.45;font-family:var(--f-text);
  letter-spacing:0;text-transform:none}

/* ── el pie de «de dónde sale» ──────────────────────────────────────────── */
.pie{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2) var(--s4);
  font-size:var(--t-xs);color:var(--ink-2)}
.pie>div{border-top:var(--hair) solid var(--line);padding-top:5px}
.pie b.k{display:block;font-family:var(--f-mono);font-size:var(--t-3xs);letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:2px}

/* ── EL PANEL LATERAL · la única superficie de detalle ──────────────────── */
.panel{position:fixed;inset:0;z-index:60;display:none}
.panel[data-on="1"]{display:block}
.panel-fondo{position:absolute;inset:0;background:rgba(10,16,20,.34)}
html[data-tema="oscuro"] .panel-fondo{background:rgba(0,0,0,.58)}
.panel-caja{position:absolute;top:0;right:0;bottom:0;width:min(880px,70vw);background:var(--surface);
  border-left:var(--hair) solid var(--line);box-shadow:var(--sh-3);display:flex;flex-direction:column}
.panel-cab{flex:0 0 auto;padding:var(--s3) var(--s4);border-bottom:var(--hair) solid var(--line);
  display:flex;align-items:flex-start;gap:var(--s3)}
.panel-cab h2{font-family:var(--f-display);font-size:var(--t-base);font-weight:800;letter-spacing:-.01em;line-height:1.25}
.panel-cab .sub{font-size:var(--t-2xs);color:var(--ink-3);margin-top:3px;max-width:78ch;line-height:1.4}
.panel-cerrar{margin-left:auto;border:var(--hair) solid var(--line);border-radius:var(--r-sm);
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:var(--t-sm);
  color:var(--ink-2);background:var(--surface-2);flex:0 0 auto}
.panel-cuerpo{flex:1 1 auto;min-height:0;overflow:auto;padding:var(--s3) var(--s4) var(--s5)}
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:var(--s2);
  border-bottom:var(--hair) solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.filtros select,.filtros input{font-size:var(--t-2xs);padding:4px 7px;border-radius:var(--r-sm);
  border:var(--hair) solid var(--line);background:var(--surface);color:var(--ink-1)}
.filtros .cuenta{margin-left:auto;font-family:var(--f-mono);font-size:var(--t-3xs);color:var(--ink-3)}
.tabs{display:flex;gap:2px;border-bottom:var(--hair) solid var(--line);flex-wrap:wrap;margin-top:var(--s2);
  position:sticky;top:30px;background:var(--surface);z-index:2}
.tabs button{padding:6px 10px;font-size:var(--t-2xs);font-weight:600;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-current="true"]{color:var(--ink-1);border-bottom-color:var(--ink-1)}
.tabs button .c{font-family:var(--f-mono);color:var(--ink-3);font-weight:600}
.mas{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;font-size:var(--t-2xs);color:var(--ink-3)}
.codigos{display:grid;grid-template-columns:repeat(auto-fill,minmax(16ch,1fr));gap:2px 10px;
  font-family:var(--f-mono);font-size:var(--t-2xs);color:var(--ink-2);margin-top:var(--s2)}

/* ── EL INFORME · documento, no pantalla. A4 vertical, tres páginas. ────── */
.informe{background:var(--surface);border:var(--hair) solid var(--line);border-radius:var(--r-lg);
  max-width:940px;margin:0 auto;padding:var(--s6) var(--s6) var(--s5)}
.informe .memb{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s4);
  border-bottom:2px solid var(--ink-1);padding-bottom:var(--s2)}
/* el titular a TODO el ancho: es la frase que el gerente lee primero */
.informe .titular{font-family:var(--f-display);font-weight:800;font-size:var(--t-xl);line-height:1.14;
  letter-spacing:-.028em;margin:var(--s3) 0 var(--s2);max-width:none}
.informe .titular em{font-style:normal;font-family:var(--f-mono);font-size:.9em;letter-spacing:-.04em}
.informe .bajada{font-size:var(--t-base);color:var(--ink-2);max-width:88ch;line-height:1.45}
.informe h2{font-family:var(--f-display);font-weight:800;font-size:var(--t-md);letter-spacing:-.015em;
  margin-top:var(--s4);padding-top:6px;border-top:var(--hair) solid var(--line)}
.informe h3{font-size:var(--t-sm);font-weight:700;margin-top:var(--s3)}
.informe p{font-size:var(--t-sm);color:var(--ink-2);max-width:80ch;margin-top:6px;line-height:1.45}
.informe p b{color:var(--ink-1)}
.informe .accion-i{border-top:var(--hair) solid var(--line);padding:var(--s2) 0;display:flex;
  gap:var(--s4);align-items:flex-start}
.informe .accion-i .t{font-size:var(--t-base);font-weight:700;line-height:1.35}
.informe .accion-i p{margin-top:4px;font-size:var(--t-xs);max-width:76ch}

/* ── responsive: escritorio primero; el celular, razonable ─────────────── */
@media(max-width:1120px){
  body{overflow:auto;height:auto}
  .app{height:auto}
  .vista{display:none}
  .vista[data-on="1"]{display:block}
  .ses{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;border-left:0;border-bottom:2px solid var(--line);overflow-x:auto}
  .rail button{border-left:0;border-bottom:2px solid transparent;margin:0 0 -2px;white-space:nowrap;width:auto}
  .rail button[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--dato)}
  .rail .rail-pie{display:none}
  .cap,.lista,.cola,.panelito{overflow:visible}
  .dos,.dos.izq-ancha{grid-template-columns:minmax(0,1fr)}
  .panel-caja{width:100%}
  .tres,.pie{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:760px){
  .barra{height:auto;flex:0 0 auto;flex-wrap:wrap;padding:6px var(--s3);gap:6px var(--s3)}
  .barra .der{margin-left:0;flex-wrap:wrap}
  .marca span{display:none}
  select.ctrl{max-width:170px}
  .comp{overflow-x:auto}
  .fila{grid-template-columns:22px 1fr;gap:4px var(--s2)}
  .fila .razon,.fila .plata,.fila .ir{grid-column:2;text-align:left}
  .informe{padding:var(--s4) var(--s3)}
  .informe .titular{font-size:var(--t-lg)}
  .tbl{display:block;overflow-x:auto}
}

@media print{
  .barra,.rail,.panel,.no-print,#v-cartera,#v-sesion{display:none !important}
  html,body{height:auto;overflow:visible;background:#fff}
  .app{height:auto;display:block}
  .vista.doc[data-on="1"]{display:block;padding:0;overflow:visible}
  .informe{border:0;border-radius:0;padding:0;max-width:none}
  .informe h2{break-after:avoid}
  .tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
  .accion-i,.vbox,figure,table{break-inside:avoid}
  @page{size:A4 portrait;margin:13mm}
}
</style>
</head>

<script>
"use strict";
const D = JSON.parse(document.getElementById("datos").textContent);
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));

/* ── formato ────────────────────────────────────────────────────────────── */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const miles  = n => Math.round(n).toLocaleString("de-DE");
const pesos  = n => (n<0?"−":"")+"$ "+miles(Math.abs(n));
const pesosF = n => (n<0?"−":"+")+"$ "+miles(Math.abs(n));
const pesosM = n => (n<0?"−":"")+"$ "+(Math.abs(n)/1e6).toFixed(1).replace(".",",")+" M";
const dec  = (n,d=1) => n==null? "—" : n.toFixed(d).replace(".",",").replace("-","−");
const pct  = (n,d=1) => n==null? "sin referencia" : dec(n,d)+" %";
const pctF = (n,d=1) => n==null? "—" : (n>0?"+":n<0?"−":"")+dec(Math.abs(n),d)+" %";
const num  = n => n==null? "—" : miles(n);
const MES  = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fecha  = s => { if(!s) return "—"; const [a,m,d]=s.split("-"); return (+d)+" "+MES[+m-1]+" "+a; };
const fechaC = s => { if(!s) return "—"; const [a,m,d]=s.split("-"); return (+d)+" de "+MESL[+m-1]; };
const mesCorto = p => { const [a,m]=p.split("-"); return MES[+m-1]+" "+a.slice(2); };
const mesLargo = p => { const [a,m]=p.split("-"); return MESL[+m-1]+" "+a; };

const TIPO = {gondola:"cara de góndola", punta:"punta de góndola", isla:"isla",
  nevera_refrescos:"nevera de bebidas", cross:"exhibición de piso", robatope:"robatope",
  batea:"batea", stand_frutas:"stand de frutas", fuera_del_plano:"fuera del plano",
  isla_fria:"isla fría", nevera_carnes:"nevera de carnes", mueble:"mueble", ristra:"ristra", impulsador:"impulsador"};
const TIPOP = {gondola:"caras de góndola", punta:"puntas de góndola", isla:"islas",
  nevera_refrescos:"neveras de bebidas", cross:"exhibiciones de piso", robatope:"robatopes",
  batea:"bateas", stand_frutas:"stands de frutas"};
const tnom  = t => TIPO[t] || t;
const tnomp = (t,n) => n===1 ? tnom(t) : (TIPOP[t] || tnom(t));
const ESTADO = {libre:"libre", se_libera:"se libera", ocupado:"ocupado"};
const SENAL  = {sin_dato:"sin dato", fantasma:"fantasma", spread_negativo:"cobra por debajo",
  ocupacion_baja:"ocupación baja", sin_tarifa:"sin tarifa", nueva:"nueva"};
const CLASE  = {activa:"activa", dormida:"dormida", fantasma:"fantasma", sin_cuentas:"sin cuentas", nueva:"nueva"};

/* ═══════════════════════════════════════════════════════════════════════════
   SVG · el kit de formas. Regla de A que atraviesa todo el kit: LA REFERENCIA
   VA DENTRO DEL DIBUJO — la clave, el umbral, el promedio y la palabra de
   cada color se escriben sobre el gráfico, nunca en una leyenda de al lado.
   Ninguno usa dos escalas. Ninguno es una torta ni un anillo.
   ═════════════════════════════════════════════════════════════════════════ */
function fig(w,h,inner,label){
  return `<svg class="fig" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}"
    preserveAspectRatio="xMidYMid meet" style="max-height:${h}px">${inner}</svg>`;
}
const AX = 'stroke="var(--line)" stroke-width="1" fill="none"';
const GR = 'stroke="var(--line-soft)" stroke-width="1" fill="none"';
const TX = 'fill="var(--ink-3)" font-size="11" font-family="var(--f-mono)"';
const TL = 'fill="var(--ink-2)" font-size="11" font-family="var(--f-text)"';
const TF = 'fill="var(--ink-1)" font-size="11.5" font-family="var(--f-text)" font-weight="600"';

/* clave dentro del dibujo: cuadraditos + palabra, arriba a la derecha */
function claveSVG(x, y, items, anchor){
  let g = "", cx = x;
  const ancho = it => (it.t.length*6.4) + 20;
  const total = items.reduce((a,it)=>a+ancho(it)+10,0);
  if(anchor==="end") cx = Math.max(2, x - total);
  items.forEach(it=>{
    if(it.linea)      g += `<rect x="${cx}" y="${y-2}" width="14" height="3" rx="1.5" fill="${it.c}"/>`;
    else if(it.tick)  g += `<rect x="${cx+5}" y="${y-6}" width="2" height="11" rx="1" fill="${it.c}"/>`;
    else              g += `<rect x="${cx}" y="${y-6}" width="10" height="10" rx="2" fill="${it.c}" stroke="${it.b||"none"}" stroke-width="1"/>`;
    g += `<text x="${cx+(it.linea?18:14)}" y="${y+3.5}" ${TX} fill="var(--ink-2)">${esc(it.t)}</text>`;
    cx += ancho(it)+10;
  });
  return g;
}

/* ── 1 · dos líneas de conteo sobre el eje de meses ─────────────────────────
   El denominador se mueve tres veces en cuatro meses: una línea de % dibuja un
   derrumbe que no ocurrió. Dos conteos en UNA escala de espacios ponen el
   escalón en el dato. ──────────────────────────────────────────────────── */
function gLineas(serie, anot, alto){
  const W=880, H=alto||250, L=46, R=126, T=alto?54:58, B=30;
  const pw=W-L-R, ph=H-T-B;
  const pts = serie.map((s,i)=>({...s, i, ocup: s.occ==null?null:Math.round(s.occ*s.esp/100)}));
  const max = Math.max(...pts.map(p=>p.esp||0))*1.10;
  const x = i => L + (pw*i)/(pts.length-1);
  const y = v => T + ph - (ph*v)/max;
  const linea = (get,color,wd) => {
    let segs=[], cur=[];
    pts.forEach(p=>{ const v=get(p); if(v==null){ if(cur.length)segs.push(cur); cur=[]; } else cur.push([x(p.i),y(v)]); });
    if(cur.length)segs.push(cur);
    return segs.map(s=>`<polyline points="${s.map(a=>a.join(",")).join(" ")}" fill="none" stroke="${color}"
      stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join("");
  };
  let g="";
  for(let k=0;k<=4;k++){ const v=max*k/4; g+=`<line x1="${L}" y1="${y(v)}" x2="${L+pw}" y2="${y(v)}" ${GR}/>
    <text x="${L-7}" y="${y(v)+4}" text-anchor="end" ${TX}>${miles(v)}</text>`; }
  g+=`<line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" ${AX}/>`;
  pts.forEach(p=>{ if(p.i%2===0||p.i===pts.length-1)
    g+=`<text x="${x(p.i)}" y="${T+ph+15}" text-anchor="middle" ${TX}>${esc(mesCorto(p.p))}</text>`; });
  pts.filter(p=>p.sd).forEach(p=>{
    g+=`<line x1="${x(p.i)}" y1="${T}" x2="${x(p.i)}" y2="${T+ph}" stroke="var(--line)" stroke-width="1"/>
        <text x="${x(p.i)+5}" y="${T+ph-6}" ${TX}>sin dato</text>`;
  });
  g+= linea(p=>p.esp,"var(--dato-tenue)") + linea(p=>p.ocup,"var(--dato)");
  const last = pts[pts.length-1];
  g+=`<circle cx="${x(last.i)}" cy="${y(last.esp)}" r="4" fill="var(--surface)" stroke="var(--dato-tenue)" stroke-width="2"/>
      <circle cx="${x(last.i)}" cy="${y(last.ocup)}" r="4" fill="var(--surface)" stroke="var(--dato)" stroke-width="2"/>
      <text x="${x(last.i)+9}" y="${y(last.esp)+4}" ${TL}>${miles(last.esp)} comercializables</text>
      <text x="${x(last.i)+9}" y="${y(last.ocup)+4}" ${TF}>${miles(last.ocup)} ocupados</text>
      <text x="${x(last.i)}" y="${T+ph+27}" text-anchor="middle" ${TX}>parcial</text>`;
  anot.forEach((a,k)=>{
    const px=x(a.i), lane = 12 + (a.lane!=null?a.lane:k)*17, anchor = px>L+pw-210 ? "end":"start", dx = anchor==="end"?-6:6;
    g+=`<line x1="${px}" y1="${lane+5}" x2="${px}" y2="${y(serie[a.i].esp)-7}" stroke="var(--ink-3)" stroke-width="1"/>
        <text x="${px+dx}" y="${lane+3}" text-anchor="${anchor}" ${TF}>${esc(a.t)}</text>`;
  });
  return fig(W,H,g,"Espacios comercializables y espacios ocupados, mes a mes. Una sola escala: espacios.");
}

/* ── 2 · la plata, en su propio panel, sobre la misma rejilla de meses ──── */
function gIngreso(serie, anot, alto){
  const W=880, H=alto||210, L=46, R=126, T=44, B=28;
  const pw=W-L-R, ph=H-T-B;
  const vals=serie.map(s=>s.ing).filter(v=>v!=null);
  const max=Math.max(...vals)*1.05, min=Math.min(...vals)*0.92;
  const x=i=>L+(pw*i)/(serie.length-1), y=v=>T+ph-(ph*(v-min))/(max-min);
  let g="";
  for(let k=0;k<=3;k++){ const v=min+(max-min)*k/3;
    g+=`<line x1="${L}" y1="${y(v)}" x2="${L+pw}" y2="${y(v)}" ${GR}/>
        <text x="${L-7}" y="${y(v)+4}" text-anchor="end" ${TX}>${(v/1e6).toFixed(0)} M</text>`; }
  g+=`<line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" ${AX}/>`;
  serie.forEach((s,i)=>{ if(i%2===0||i===serie.length-1)
    g+=`<text x="${x(i)}" y="${T+ph+15}" text-anchor="middle" ${TX}>${esc(mesCorto(s.p))}</text>`; });
  let cur=[],segs=[];
  serie.forEach((s,i)=>{ if(s.ing==null){ if(cur.length)segs.push(cur); cur=[]; } else cur.push([x(i),y(s.ing)]); });
  if(cur.length)segs.push(cur);
  g+=segs.map(s=>`<polyline points="${s.map(a=>a.join(",")).join(" ")}" fill="none" stroke="var(--dato)"
      stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join("");
  const li=serie.length-1;
  g+=`<circle cx="${x(li)}" cy="${y(serie[li].ing)}" r="4" fill="var(--surface)" stroke="var(--dato)" stroke-width="2"/>
      <text x="${x(li)+9}" y="${y(serie[li].ing)+4}" ${TF}>${pesos(serie[li].ing)}</text>
      <text x="${x(li)}" y="${T+ph+27}" text-anchor="middle" ${TX}>parcial</text>`;
  serie.filter(s=>s.sd).forEach(s=>{ const i=serie.indexOf(s);
    g+=`<line x1="${x(i)}" y1="${T}" x2="${x(i)}" y2="${T+ph}" stroke="var(--line)" stroke-width="1"/>
        <text x="${x(i)+5}" y="${T+11}" ${TX}>sin dato</text>`; });
  anot.forEach((a,k)=>{
    const px=x(a.i), lane=12+(a.lane!=null?a.lane:k)*17, anchor=px>L+pw-240?"end":"start", dx=anchor==="end"?-6:6;
    g+=`<line x1="${px}" y1="${lane+5}" x2="${px}" y2="${y(serie[a.i].ing)-7}" stroke="var(--ink-3)" stroke-width="1"/>
        <text x="${px+dx}" y="${lane+3}" text-anchor="${anchor}" ${TF}>${esc(a.t)}</text>`;
  });
  return fig(W,H,g,"Ingreso contratado mes a mes. Una sola escala: pesos.");
}

/* ── 3 · el mapa de unidades: una marca por espacio, agrupadas por sede ──
   Hace dos trabajos con un dibujo: el conteo por estado y el ranking de sedes
   (el largo de la fila ES el número de espacios). ──────────────────────── */
function gMapa(espacios, sedes, promedio, opts){
  opts = opts||{};
  const orden={ocupado:0, se_libera:1, libre:2};
  const porSede={}; espacios.forEach(e=>{ (porSede[e.s]=porSede[e.s]||[]).push(e); });
  const filas = sedes.slice().sort((a,b)=>a.ocupacion_pct-b.ocupacion_pct);
  const maxN = Math.max(...filas.map(s=>s.espacios));
  const P=7, MW=5, LX=96, RW=opts.compacto?4:126, RH=opts.compacto?18:22, GAP=opts.compacto?5:7;
  const TOP = opts.compacto?4:26;
  const W = LX + maxN*P + RW + 6;
  const H = TOP + filas.length*(RH+GAP) + (promedio!=null?16:4);
  let g="";
  if(!opts.compacto){
    g += claveSVG(W-4, 10, [
      {c:"var(--ocupado)", b:"var(--ocupado-borde)", t:"ocupado"},
      {c:"var(--entra)",   b:"var(--entra-borde)",   t:"se libera este mes"},
      {c:"var(--libre)",   b:"var(--libre-borde)",   t:"libre"}], "end");
  }
  filas.forEach((s,r)=>{
    const y = TOP + r*(RH+GAP);
    const lista=(porSede[s.sede]||[]).slice().sort((a,b)=> (orden[a.e]-orden[b.e]) || a.c.localeCompare(b.c));
    g+=`<text x="0" y="${y+RH-6}" font-size="11" font-weight="700" fill="var(--ink-1)"
         font-family="var(--f-text)">${esc(s.sede)}</text>`;
    lista.forEach((e,i)=>{
      const col = e.e==="libre"?"var(--libre)": e.e==="se_libera"?"var(--entra)":"var(--ocupado)";
      const bor = e.e==="libre"?"var(--libre-borde)": e.e==="se_libera"?"var(--entra-borde)":"var(--ocupado-borde)";
      const sel = opts.resaltar && opts.resaltar.has(e.c);
      g+=`<rect x="${LX+i*P}" y="${y}" width="${MW}" height="${RH-3}" rx="1.5"
           fill="${opts.resaltar?(sel?col:"var(--resto-suave)"):col}"
           stroke="${opts.resaltar?(sel?bor:"var(--resto-borde)"):bor}" stroke-width="1"
           ><title>${esc(e.c)} · ${esc(tnom(e.t))} · ${ESTADO[e.e]}${e.k?" · "+esc(e.k.pr):""}</title></rect>`;
    });
    if(promedio!=null){
      const tx = LX + (promedio/100)*s.espacios*P;
      g+=`<line x1="${tx}" y1="${y-3}" x2="${tx}" y2="${y+RH-1}" stroke="var(--ink-1)" stroke-width="1.5"/>`;
    }
    if(!opts.compacto)
      g+=`<text x="${LX+maxN*P+8}" y="${y+RH-6}" font-size="11" font-family="var(--f-mono)"
           fill="var(--ink-2)" font-variant-numeric="tabular-nums">${s.ocupados} / ${s.espacios} · ${dec(s.ocupacion_pct)} %</text>`;
  });
  if(promedio!=null && !opts.compacto)
    g+=`<line x1="${LX}" y1="${H-11}" x2="${LX+7}" y2="${H-11}" stroke="var(--ink-1)" stroke-width="0"/>
        <rect x="${LX}" y="${H-16}" width="2" height="11" rx="1" fill="var(--ink-1)"/>
        <text x="${LX+8}" y="${H-7}" ${TX} fill="var(--ink-2)">dónde terminaría lo ocupado si la sede estuviera en el promedio del cliente, ${dec(promedio)} %</text>`;
  return fig(W,H,g,"Mapa de espacios por sede: una marca por espacio, ordenadas de peor a mejor ocupación.");
}

/* ── 4 · barras de sede con la referencia DENTRO del dibujo (injerto de A) ──
   Largo = espacios de la sede (unidades, no %); el relleno son LOS TRES
   ESTADOS, nunca dos: ocupado · se libera este mes · libre. La marca negra es
   dónde terminaría lo ocupado al promedio del cliente. Con barras de % ARRAYÁN
   (8/12) y VILLA (16/24) dibujarían lo mismo, y no son el mismo negocio. ─── */
function gSedes(sedes, promedio, espacios){
  const W=880, L=104, R=150, T=30, RH=27;
  const por={}; espacios.forEach(e=>{ const o=por[e.s]=por[e.s]||{o:0,s:0,l:0};
    o[e.e==="ocupado"?"o":e.e==="se_libera"?"s":"l"]++; });
  const filas = sedes.slice().sort((a,b)=>a.ocupacion_pct-b.ocupacion_pct);
  const pw=W-L-R, H=T+filas.length*RH+24;
  const max=Math.max(...filas.map(s=>s.espacios))*1.02, x=v=>L+pw*v/max;
  let g = claveSVG(W-2, 12, [
    {c:"var(--ocupado)", b:"var(--ocupado-borde)", t:"ocupado"},
    {c:"var(--entra)",   b:"var(--entra-borde)",   t:"se libera este mes"},
    {c:"var(--libre)",   b:"var(--libre-borde)",   t:"libre"},
    {c:"var(--ink-1)",   tick:true, t:"al promedio del cliente, "+dec(promedio)+" %"}], "end");
  filas.forEach((s,i)=>{
    const y=T+i*RH, bh=15, c=por[s.sede]||{o:0,s:0,l:0};
    g+=`<text x="${L-10}" y="${y+bh-3}" text-anchor="end" font-size="11.5" font-weight="700"
         fill="var(--ink-1)" font-family="var(--f-text)">${esc(s.sede)}</text>`;
    let ax=L;
    [[c.o,"var(--ocupado)","var(--ocupado-borde)"],[c.s,"var(--entra)","var(--entra-borde)"],
     [c.l,"var(--libre)","var(--libre-borde)"]].forEach(([n,col,bor])=>{
      if(!n) return; const w=Math.max(1.5,(pw*n/max));
      g+=`<rect x="${ax}" y="${y}" width="${w}" height="${bh}" rx="2" fill="${col}" stroke="${bor}" stroke-width="1"/>`;
      ax+=w; });
    const tx=x(s.espacios*promedio/100);
    g+=`<line x1="${tx}" y1="${y-3}" x2="${tx}" y2="${y+bh+3}" stroke="var(--ink-1)" stroke-width="1.5"/>`;
    g+=`<text x="${x(s.espacios)+9}" y="${y+bh-3}" ${TX} fill="var(--ink-1)">${s.ocupados} de ${s.espacios} · ${dec(s.ocupacion_pct)} %${c.s?" · "+c.s+" se libera"+(c.s>1?"n":""):""}</text>`;
  });
  g+=`<text x="${L}" y="${H-6}" ${TX}>el largo de la barra son los espacios de la sede — no un porcentaje</text>`;
  return fig(W,H,g,"Ocupación por sede, ordenada de peor a mejor. Largo = espacios; relleno = los tres estados.");
}

/* ── 5 · dos barras por proveedor (de C): participación en CONTRATOS y peso
   en PLATA, sobre un único eje de %. Son dos cosas y hay que decir las dos. */
function gProveedores(rows, umbral){
  const W=880, L=196, R=104, T=32, RH=31;
  const pw=W-L-R, H=T+rows.length*RH+30;
  const max=60, x=v=>L+(pw*v)/max;
  let g="";
  for(let v=0;v<=60;v+=10){ g+=`<line x1="${x(v)}" y1="${T-8}" x2="${x(v)}" y2="${T+rows.length*RH-8}" ${GR}/>
    <text x="${x(v)}" y="${T-13}" text-anchor="middle" ${TX}>${v} %</text>`; }
  rows.forEach((r,i)=>{
    const y=T+i*RH;
    g+=`<text x="${L-9}" y="${y+8}" text-anchor="end" font-size="11.5" font-weight="${r.otros?400:700}"
         fill="${r.otros?"var(--ink-2)":"var(--ink-1)"}" font-family="var(--f-text)">${esc(r.n)}</text>`;
    g+=`<rect x="${L}" y="${y-1}" width="${Math.max(2,x(r.ct)-L)}" height="9" rx="2.5" fill="${r.otros?"var(--resto)":"var(--dato)"}"/>`;
    g+=`<rect x="${L}" y="${y+10}" width="${Math.max(2,x(r.pl)-L)}" height="9" rx="2.5" fill="${r.otros?"var(--resto-borde)":"var(--dato-tenue)"}"/>`;
    g+=`<text x="${x(r.ct)+6}" y="${y+7}" ${TX} fill="var(--ink-1)">${dec(r.ct)} % · ${r.c} contratos</text>`;
    g+=`<text x="${x(r.pl)+6}" y="${y+18}" ${TX}>${dec(r.pl)} % · ${pesosM(r.v)}</text>`;
  });
  g+=`<line x1="${x(umbral)}" y1="${T-8}" x2="${x(umbral)}" y2="${T+rows.length*RH-8}" stroke="var(--ink-1)" stroke-width="1.5"/>`;
  g+=`<text x="${L}" y="${H-6}" ${TX}>barra de arriba: contratos · barra de abajo: plata</text>`;
  g+=`<text x="${W-2}" y="${H-6}" text-anchor="end" ${TF}>la línea negra es el umbral de concentración, ${umbral} %</text>`;
  return fig(W,H,g,"Participación de cada proveedor sobre los contratos y sobre el ingreso, con el umbral marcado.");
}

/* ── 6 · dumbbell canon del cliente ↔ benchmark de la plataforma ───────── */
function gDumbbell(rows, quien){
  const W=880, L=226, R=112, T=34, RH=29;
  const pw=W-L-R, H=T+rows.length*RH+22;
  const max=Math.max(...rows.flatMap(r=>[r.cli||0,r.ben]))*1.06;
  const x=v=>L+(pw*v)/max;
  let g="";
  for(let k=0;k<=4;k++){ const v=max*k/4;
    g+=`<line x1="${x(v)}" y1="${T-9}" x2="${x(v)}" y2="${T+rows.length*RH-14}" ${GR}/>
        <text x="${x(v)}" y="${T-14}" text-anchor="middle" ${TX}>${v===0?"0":"$ "+(v/1e6).toFixed(1).replace(".",",")+" M"}</text>`; }
  rows.forEach((r,i)=>{
    const y=T+i*RH;
    g+=`<text x="${L-11}" y="${y+3}" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--ink-1)"
         font-family="var(--f-text)">${esc(tnom(r.t))}</text>`;
    g+=`<text x="${L-11}" y="${y+15}" text-anchor="end" font-size="10" fill="var(--ink-3)"
         font-family="var(--f-mono)">${r.libres} libres de ${r.total}</text>`;
    if(r.cli!=null){
      const a=Math.min(x(r.cli),x(r.ben)), b=Math.max(x(r.cli),x(r.ben));
      g+=`<line x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="var(--dato-tenue)" stroke-width="2" stroke-linecap="round"/>`;
      g+=`<circle cx="${x(r.ben)}" cy="${y}" r="4.5" fill="var(--dato-tenue)" stroke="var(--surface)" stroke-width="2"/>`;
      g+=`<circle cx="${x(r.cli)}" cy="${y}" r="5" fill="var(--dato)" stroke="var(--surface)" stroke-width="2"/>`;
      g+=`<text x="${W-R+9}" y="${y+4}" ${TX} fill="var(--ink-1)">${pctF(r.br)}</text>`;
    }else{
      g+=`<circle cx="${x(r.ben)}" cy="${y}" r="4.5" fill="var(--dato-tenue)" stroke="var(--surface)" stroke-width="2"/>`;
      g+=`<text x="${x(r.ben)+10}" y="${y+4}" ${TX}>sin contratos de este tipo — no hay brecha que medir</text>`;
    }
  });
  g += claveSVG(W-2, H-5, [
    {c:"var(--dato)",       t:(quien||"lo que cobra Mercamío")},
    {c:"var(--dato-tenue)", t:"promedio de la plataforma"}], "end");
  g += `<text x="${L-11}" y="${H-5}" text-anchor="end" ${TX}>ordenado por brecha</text>`;
  return fig(W,H,g,"Canon promedio del cliente frente al promedio de la plataforma, por tipo, ordenado por brecha.");
}

/* ── 7 · el riel de 60 días, con la plata rotulada sobre cada hito (de C) ─
   60 y no 90: el backend no mira más allá (DIAS_POR_VENCER = 60). ─────── */
function gRiel(items, hoy, finPeriodo){
  const W=880, L=30, R=30, T=76, H=136;
  const pw=W-L-R;
  const t0=Date.parse(hoy), t1=t0+60*864e5;
  const x=d=>L+pw*(Date.parse(d)-t0)/(t1-t0);
  let g=`<line x1="${L}" y1="${T}" x2="${L+pw}" y2="${T}" stroke="var(--line-strong)" stroke-width="1"/>`;
  const hitos=[[hoy,"hoy · 7 sep",0,"start"],[finPeriodo,"fin del periodo · 30 sep",1,"middle"],["2026-11-06","+60 días · 6 nov",0,"end"]];
  hitos.forEach(([d,t,fuerte,an])=>{
    const px=x(d);
    g+=`<line x1="${px}" y1="${T-8}" x2="${px}" y2="${T+8}" stroke="${fuerte?"var(--ink-1)":"var(--line-strong)"}" stroke-width="${fuerte?1.5:1}"/>
        <text x="${px}" y="${T+24}" text-anchor="${an}" ${fuerte?TF:TX}>${esc(t)}</text>`;
  });
  items.forEach(it=>{
    const px=x(it.f), y=T;
    if(it.selibera)
      g+=`<rect x="${px-5.5}" y="${y-5.5}" width="11" height="11" rx="2" fill="var(--entra)" stroke="var(--surface)" stroke-width="2"><title>${esc(it.c)} · ${esc(it.pr)} · ${fecha(it.f)}</title></rect>`;
    else
      g+=`<circle cx="${px}" cy="${y}" r="5.5" fill="var(--dato)" stroke="var(--surface)" stroke-width="2"><title>${esc(it.c)} · ${esc(it.pr)} · ${fecha(it.f)}</title></circle>`;
    if(it.rot){
      const lane = it.lane||0;
      g+=`<line x1="${px}" y1="${y-8}" x2="${px}" y2="${30-lane*16}" stroke="var(--ink-3)" stroke-width="1"/>
          <text x="${px}" y="${26-lane*16}" text-anchor="middle" ${TF}>${esc(it.rot)}</text>`;
    }
  });
  g += claveSVG(W-2, T+46, [
    {c:"var(--entra)", b:"var(--entra-borde)", t:"ya está en «se libera»"},
    {c:"var(--dato)",  t:"vence después del periodo"}], "end");
  g += `<text x="${L}" y="${T+49}" ${TX}>la cifra sobre el hito es el canon mensual que se cae</text>`;
  return fig(W,H,g,"Contratos que vencen en los próximos 60 días, sobre un eje de tiempo.");
}

/* ── 8 · barras divergentes de movimientos. La polaridad la lleva la
   POSICIÓN sobre el cero, no el tono: no queda un par divergente libre que no
   colisione con el rojo «ocupado» (ΔE 10,7, bajo el piso de 15). ──────── */
function gMovimientos(mov, alto){
  const W=880, L=58, R=22, T=30, B=40, H=alto||248;
  const pw=W-L-R, ph=H-T-B, y0=T+ph/2;
  const d=mov.map(m=>({m:m.m, e:m.ent.reduce((a,x)=>a+x.v,0), s:m.sal.reduce((a,x)=>a+x.v,0)}));
  const max=Math.max(...d.flatMap(v=>[v.e,v.s]))*1.20;
  const slot=pw/d.length, bw=Math.min(22,slot-14);
  const y=v=>y0-(ph/2)*v/max;
  let g="";
  [max/2,max,-max/2,-max].forEach(v=>{ g+=`<line x1="${L}" y1="${y(v)}" x2="${L+pw}" y2="${y(v)}" ${GR}/>
    <text x="${L-7}" y="${y(v)+4}" text-anchor="end" ${TX}>${(v>0?"+":"−")+"$ "+(Math.abs(v)/1e6).toFixed(0)+" M"}</text>`; });
  d.forEach((v,i)=>{
    const cx=L+slot*i+slot/2;
    g+=`<rect x="${cx-bw/2}" y="${y(v.e)}" width="${bw}" height="${Math.max(1,y0-2-y(v.e))}" rx="2.5" fill="var(--dato)"><title>${esc(mesCorto(v.m))} entradas ${pesos(v.e)}</title></rect>`;
    g+=`<rect x="${cx-bw/2}" y="${y0+2}" width="${bw}" height="${Math.max(1,y(-v.s)-y0-2)}" rx="2.5" fill="var(--dato-tenue)"><title>${esc(mesCorto(v.m))} salidas ${pesos(v.s)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-14}" text-anchor="middle" ${TX}>${esc(mesCorto(v.m))}</text>`;
  });
  g+=`<line x1="${L}" y1="${y0}" x2="${L+pw}" y2="${y0}" stroke="var(--ink-1)" stroke-width="1.5"/>`;
  g+=`<text x="${L+3}" y="${T-9}" ${TX} fill="var(--ink-2)">entradas, arriba del cero</text>`;
  g+=`<text x="${L+3}" y="${H-24}" ${TX} fill="var(--ink-2)">salidas, abajo del cero</text>`;
  const peor=d.reduce((a,b)=>b.s>a.s?b:a), iPeor=d.indexOf(peor), ult=d.length-1;
  g+=`<text x="${L+slot*iPeor+slot/2}" y="${y(-peor.s)+14}" text-anchor="middle" ${TF}>−${pesos(peor.s).replace("$ ","$ ")}</text>`;
  g+=`<text x="${L+slot*ult+slot/2}" y="${y(d[ult].e)-7}" text-anchor="middle" ${TF}>+${pesos(d[ult].e).replace("$ ","$ ")}</text>`;
  return fig(W,H,g,"Entradas y salidas de contratos por mes, en pesos. Una sola escala.");
}

/* ── 9 · medidor: una razón contra un límite. Para la CARTERA, no unidades:
   513 marcas (3.000 con 30 clientes) no señalan ningún lugar al que ir. ─ */
function gMedidor(v, ref, refRot){
  const W=880, H=62, T=16, bh=22;
  let g=`<rect x="0" y="${T}" width="${W}" height="${bh}" rx="4" fill="var(--surface-3)"/>
         <rect x="0" y="${T}" width="${W*v/100}" height="${bh}" rx="4" fill="var(--dato)"/>`;
  g+=`<line x1="${W*ref/100}" y1="${T-8}" x2="${W*ref/100}" y2="${T+bh+8}" stroke="var(--ink-1)" stroke-width="2"/>
      <text x="${W*ref/100+8}" y="${T+bh+22}" ${TF}>${esc(refRot)}</text>`;
  g+=`<text x="${W*v/100+10}" y="${T+16}" fill="var(--ink-1)" font-weight="700" font-size="13"
        font-family="var(--f-mono)">${dec(v)} %</text>`;
  g+=`<text x="0" y="${T-6}" ${TX}>0 %</text>`;
  g+=`<text x="${W}" y="${T-6}" text-anchor="end" ${TX}>100 % de los ${miles(513)} espacios comercializables</text>`;
  return fig(W,H,g,"Ocupación de la cartera contra el mes anterior comparable.");
}

/* ── 10 · puntos de spread sobre un eje con el cero marcado. Los nulos NO se
   dibujan en el cero: se cuentan aparte, con la razón. ────────────────── */
function gSpread(rows){
  const W=880, L=180, R=204, T=32, RH=28;
  const pw=W-L-R, H=T+rows.length*RH+22;
  const min=-22, max=6, x=v=>L+pw*(v-min)/(max-min);
  let g="";
  for(let v=-20;v<=5;v+=5){ g+=`<line x1="${x(v)}" y1="${T-11}" x2="${x(v)}" y2="${T+rows.length*RH-16}" ${GR}/>
    <text x="${x(v)}" y="${T-16}" text-anchor="middle" ${TX}>${v>0?"+"+v:v} %</text>`; }
  g+=`<line x1="${x(0)}" y1="${T-11}" x2="${x(0)}" y2="${T+rows.length*RH-16}" stroke="var(--ink-1)" stroke-width="1.5"/>
      <text x="${x(0)}" y="${T+rows.length*RH+1}" text-anchor="middle" ${TF}>cobra lo que dice su tarifa</text>`;
  rows.forEach((r,i)=>{
    const y=T+i*RH;
    g+=`<text x="${L-12}" y="${y+4}" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--ink-1)"
         font-family="var(--f-text)">${esc(r.n)}</text>`;
    g+=`<line x1="${x(0)}" y1="${y}" x2="${x(r.v)}" y2="${y}" stroke="var(--dato-tenue)" stroke-width="2"/>`;
    g+=`<circle cx="${x(r.v)}" cy="${y}" r="5" fill="var(--dato)" stroke="var(--surface)" stroke-width="2"/>`;
    g+=`<text x="${W-R+10}" y="${y+4}" ${TX} fill="var(--ink-1)">${pctF(r.v)}</text>`;
    g+=`<text x="${W-R+64}" y="${y+4}" ${TX}>${esc(r.d)}</text>`;
  });
  g+=`<text x="${L}" y="${H-6}" ${TX}>negativo = cobra menos que su propia tarifa de referencia</text>`;
  return fig(W,H,g,"Spread por cliente: cuánto cobra cada uno contra su propia tarifa.");
}

/* ── 11 · barras de conteo. Sin porcentaje: la cartera NO publica el total de
   contratos por cliente, y un porcentaje sin denominador es inventado. ── */
function gBarras(rows, unidad, nota){
  const W=880, L=194, R=170, T=14, RH=25;
  const pw=W-L-R, H=T+rows.length*RH+(nota?18:4);
  const max=Math.max(...rows.map(r=>r.v))*1.04, x=v=>L+pw*v/max;
  let g="";
  rows.forEach((r,i)=>{ const y=T+i*RH;
    g+=`<text x="${L-11}" y="${y+13}" text-anchor="end" font-size="11.5" fill="var(--ink-1)"
         font-family="var(--f-text)" font-weight="${i===0?700:400}">${esc(r.n)}</text>`;
    g+=`<rect x="${L}" y="${y+4}" width="${Math.max(2,x(r.v)-L)}" height="13" rx="3" fill="${i===0?"var(--dato)":"var(--dato-tenue)"}"/>`;
    g+=`<text x="${x(r.v)+7}" y="${y+14}" ${TX} fill="var(--ink-1)">${r.v} ${esc(unidad)}${r.d?" · "+esc(r.d):""}</text>`;
  });
  if(nota) g+=`<text x="${L}" y="${H-4}" ${TX}>${esc(nota)}</text>`;
  return fig(W,H,g,"Ranking por número de "+unidad+".");
}

/* ── 12 · el inventario por tipo: unidades apiladas que suman el total ─── */
function gTipos(tipos, sel, espacios){
  const W=880, L=150, R=218, T=26, RH=25;
  const por={}; espacios.forEach(e=>{ const o=por[e.t]=por[e.t]||{o:0,s:0,l:0};
    o[e.e==="ocupado"?"o":e.e==="se_libera"?"s":"l"]++; });
  const filas = tipos.slice().sort((a,b)=>b.total-a.total);
  const pw=W-L-R, H=T+filas.length*RH+8;
  const max=Math.max(...filas.map(t=>t.total))*1.02;
  let g = claveSVG(W-2, 10, [
    {c:"var(--ocupado)", b:"var(--ocupado-borde)", t:"ocupado"},
    {c:"var(--entra)",   b:"var(--entra-borde)",   t:"se libera este mes"},
    {c:"var(--libre)",   b:"var(--libre-borde)",   t:"libre"}], "end");
  filas.forEach((t,i)=>{
    const y=T+i*RH, bh=14, c=por[t.tipo]||{o:0,s:0,l:0};
    g+=`<text x="${L-11}" y="${y+bh-2}" text-anchor="end" font-size="11.5" font-weight="${t.tipo===sel?700:400}"
         fill="var(--ink-1)" font-family="var(--f-text)">${esc(tnom(t.tipo))}</text>`;
    let ax=L;
    [[c.o,"var(--ocupado)","var(--ocupado-borde)"],[c.s,"var(--entra)","var(--entra-borde)"],
     [c.l,"var(--libre)","var(--libre-borde)"]].forEach(([n,col,bor])=>{
      if(!n) return; const w=Math.max(1.5,(pw*n/max));
      g+=`<rect x="${ax}" y="${y}" width="${w}" height="${bh}" rx="2" fill="${col}" stroke="${bor}" stroke-width="1"/>`;
      ax+=w; });
    g+=`<text x="${L+pw*t.total/max+8}" y="${y+bh-2}" ${TX} fill="var(--ink-1)">${t.libres} en oferta de ${t.total}${t.canon_promedio?" · "+pesos(t.canon_promedio):" · sin canon propio"}</text>`;
  });
  return fig(W,H,g,"Espacios por tipo: cuántos hay, cuántos ocupados, cuántos se liberan y cuántos libres.");
}

/* ═══════════════════════════════════════════════════════════════════════════
   LAS CUENTAS DEL FRONTEND — todo lo que el endpoint NO devuelve va acá, con
   su fórmula a la vista. Ninguna cifra se inventa: se despeja y se rotula.
   ═════════════════════════════════════════════════════════════════════════ */
const C=D.cartera, CON=C.consolidado, DET=D.det, NUE=D.nuevo, DER=D.der, M=DER.mercamio;
const cli = s => C.clientes.find(c=>c.slug===s);
const ado = s => D.adopcion.clientes.find(c=>c.slug===s);
const HOY="2026-09-07", FINP=C.periodo.hasta;

const tcAgo=D.tc[10], tcSep=D.tc[11];
const ocupAgo=Math.round(tcAgo.occ*tcAgo.esp/100), ocupSep=Math.round(tcSep.occ*tcSep.esp/100);
/* Guadual es el único cliente que cambió de estado entre los dos cierres: la
   diferencia entera se le atribuye a él, y eso se escribe. */
const GUA={esp:tcAgo.esp-tcSep.esp, ing:52300000, ocup:ocupAgo-ocupSep};
const agoComp={esp:tcSep.esp, ing:tcAgo.ing-GUA.ing, ocup:ocupAgo-GUA.ocup};
agoComp.occ=100*agoComp.ocup/agoComp.esp;
const deltaIng=tcSep.ing-agoComp.ing, deltaIngPct=100*deltaIng/agoComp.ing;
const deltaOcc=tcSep.occ-agoComp.occ;
const SUPER_APROX = Math.round((109520000/0.826-109520000)/1e5)*1e5;

const contratosDe = s => { const m=cli(s).metricas; return m && m.canon_promedio_mensual
  ? Math.round(m.ingreso_contratado_mes/m.canon_promedio_mensual) : null; };

[DET,NUE].forEach(x=>x.recs.forEach(r=>{ if(r.d && r.d.candidatos)
  r.d.candidatos = r.d.candidatos.map(c=>({p:c.proveedor, v:c.canon_actual, mt:c.mismo_tipo})); }));

const ESP=DET.espacios;
const nEstado = e => ESP.filter(x=>x.e===e).length;
const LIBRES=nEstado("libre"), SELIB=nEstado("se_libera"), OCUP=nEstado("ocupado");
const EN_OFERTA=LIBRES+SELIB;
const NCON=contratosDe("mercamio");
const rec = id => DET.recs.find(r=>r.id===id);
const recsTipo = t => DET.recs.filter(r=>r.tipo===t);
const V0=DET.prov[0];
const CANON_TOT=DET.prov.reduce((a,p)=>a+p.ct,0);
const MET=cli("mercamio").metricas;
const tmAgo=D.tm[10];

/* 148 oportunidades → 30 grupos (sede × tipo). La unidad que se muestra no es
   el espacio, es el grupo. */
const GRUPOS=(()=>{ const g={};
  DET.opo.forEach(o=>{ const k=o.s+"|"+o.t;
    (g[k]=g[k]||{s:o.s,t:o.t,n:0,v:0,lib:0,sel:0,ps:o.ps,op:o.op,cand:o.cand,cods:[]});
    g[k].n++; g[k].v+=o.v; g[k][o.e==="libre"?"lib":"sel"]++; g[k].cods.push(o.c); });
  return Object.values(g).sort((a,b)=>b.v-a.v); })();
const gruposDeTipo = t => GRUPOS.filter(g=>g.t===t).sort((a,b)=>b.n-a.n);
const repartoTexto = t => gruposDeTipo(t).map(g=>`${g.n} en ${g.s}`).join(" · ");

const VENC = recsTipo("contrato_por_vencer").map(r=>r.d).sort((a,b)=>a.fin.localeCompare(b.fin));
const VENC_SEP = VENC.filter(v=>v.fin<=FINP);
const BM = M.canon_vs_benchmark_por_tipo.map(x=>{ const t=DET.tipos.find(y=>y.tipo===x.tipo);
  return {t:x.tipo, cli:x.canon_promedio_cliente, ben:x.benchmark_plataforma, br:x.brecha_pct,
          libres:t.libres, total:t.total, tar:t.tarifa_configurada}; })
  .sort((a,b)=> (a.br==null?1:b.br==null?-1:a.br-b.br));
const GON=DET.tipos.find(t=>t.tipo==="gondola");
const PROV_ORD=DET.prov.slice().sort((a,b)=>b.pp-a.pp||b.ct-a.ct);
const OTROS=PROV_ORD.slice(5);
const ROWS_PROV=PROV_ORD.slice(0,5).map(p=>({n:p.n,c:p.esp,ct:p.pp,pl:100*p.ct/CANON_TOT,v:p.ct}))
  .concat([{n:`otros ${OTROS.length} proveedores`, c:OTROS.reduce((a,p)=>a+p.esp,0),
    ct:OTROS.reduce((a,p)=>a+p.pp,0), pl:100*OTROS.reduce((a,p)=>a+p.ct,0)/CANON_TOT,
    v:OTROS.reduce((a,p)=>a+p.ct,0), otros:true}]);

/* ═══════════════════════════════════════════════════════════════════════════
   EL PANEL LATERAL · la única superficie de detalle de toda la aplicación.

function abrirPanel(rot, tit, sub, html){

/* ── una tabla que se entrega por tandas ────────────────────────────────── */
const TANDA=40;
let TB=null;
function tablaLarga(id, cols, filas, caption){
  TB={id, cols, filas, n:0};
  return `<table class="tbl compacta" id="${id}">${caption?`<caption>${caption}</caption>`:""}
    <thead><tr>${cols.map(c=>`<th${c.n?' class="n"':""}>${esc(c.t)}</th>`).join("")}</tr></thead>
    <tbody></tbody></table>
    <div class="mas" id="mas-${id}"></div>`;
}
function pintarTanda(){
  if(!TB) return;
  const t=$("#"+TB.id); if(!t) return;
  const tb=t.querySelector("tbody");
  const hasta=Math.min(TB.n+TANDA, TB.filas.length);
  let h="";
  for(let i=TB.n;i<hasta;i++){
    h+="<tr>"+TB.filas[i].map((c,j)=>`<td${TB.cols[j]&&TB.cols[j].n?' class="n"':""}>${c}</td>`).join("")+"</tr>";
  }
  tb.insertAdjacentHTML("beforeend",h);
  TB.n=hasta;
  const pie=$("#mas-"+TB.id);
  if(!pie) return;
  pie.innerHTML = TB.n>=TB.filas.length
    ? `<span>${TB.filas.length} de ${TB.filas.length} filas — no queda ninguna</span>`
    : `<button class="btn" id="btn-mas">Mostrar ${Math.min(TANDA,TB.filas.length-TB.n)} más</button>
       <span>${TB.n} de ${TB.filas.length} filas · el resto llega al rodar o al pedirlo — nunca se dibujan las ${TB.filas.length} de una vez</span>`;
}
PC.addEventListener("scroll",()=>{
  if(TB && TB.n<TB.filas.length && PC.scrollTop+PC.clientHeight > PC.scrollHeight-140) pintarTanda();
},{passive:true});

/* ── una tabla corta, entera (tablas equivalentes de los gráficos) ──────── */
function tablaCorta(cols, filas, caption){
  return `<table class="tbl compacta">${caption?`<caption>${caption}</caption>`:""}
    <thead><tr>${cols.map(c=>`<th${c.n?' class="n"':""}>${esc(c.t)}</th>`).join("")}</tr></thead>
    <tbody>${filas.map(r=>"<tr>"+r.map((c,j)=>`<td${cols[j]&&cols[j].n?' class="n"':""}>${c}</td>`).join("")+"</tr>").join("")}</tbody></table>`;
}

}

/* ── LAS CINCO TABLAS DEL DETALLE, contra UNA sola rebanada (de B) ──────── */
const TABS=[["espacios","Espacios"],["contratos","Contratos"],["proveedores","Proveedores"],
            ["movimientos","Movimientos"],["oportunidades","Oportunidades"]];
function pasa(o){
  if(F.sede && o.sede!==F.sede) return false;
  if(F.tipo && o.tipo!==F.tipo) return false;
  if(F.estado && o.estado!==F.estado) return false;
  if(F.q && !o.txt.toLowerCase().includes(F.q.toLowerCase())) return false;
  return true;
}
function rebanada(){
  const espF=ESP.filter(e=>pasa({sede:e.s,tipo:e.t,estado:e.e,txt:[e.c,e.z,e.k?e.k.pr:"",e.k?e.k.m:""].join(" ")}));
  const conF=espF.filter(e=>e.k);
  const provF=DET.prov.filter(p=>(!F.sede||p.sedes.includes(F.sede)) && (!F.tipo||p.tipos.includes(F.tipo))
    && (!F.q||p.n.toLowerCase().includes(F.q.toLowerCase())));
  const opoF=GRUPOS.filter(g=>pasa({sede:g.s,tipo:g.t,estado:"",txt:g.s+" "+g.t+" "+g.cods.join(" ")}))
    .filter(g=>!F.estado || (F.estado==="libre"?g.lib:F.estado==="se_libera"?g.sel:false));
  const movF=DET.mov.map(mm=>({m:mm.m,
      ent:mm.ent.filter(x=>pasa({sede:x.c.split("-")[0],tipo:x.t,estado:"",txt:x.pr+" "+x.c})),
      sal:mm.sal.filter(x=>pasa({sede:x.c.split("-")[0],tipo:x.t,estado:"",txt:x.pr+" "+x.c}))}))
    .filter(mm=>mm.ent.length||mm.sal.length);
  return {espF,conF,provF,opoF,movF};
}
function cuentaTab(k,R){
  return k==="espacios"?R.espF.length : k==="contratos"?R.conF.length : k==="proveedores"?R.provF.length
    : k==="oportunidades"?R.opoF.length : R.movF.reduce((a,m)=>a+m.ent.length+m.sal.length,0);

function chipEstado(e){

}

  } else if(F.tab==="proveedores"){

      R.provF.slice().sort((a,b)=>b.pp-a.pp).map(p=>[esc(p.n), p.esp, pct(p.pp), pesos(p.ct), pct(100*p.ct/CANON_TOT),
        p.tipos.map(t=>esc(tnom(t))).join(", "), p.sedes.length, `<span class="mono">${esc(p.desde)}</span>`, p.v60]),

        g.cand.length?g.cand.map(c=>esc(c.proveedor||c.p)).join(", "):"<span class='ter'>sin candidatos</span>",

  } else {

      ...mm.sal.map(x=>[esc(mesCorto(mm.m)), `<span class="chip">salida</span>`, esc(x.pr), `<span class="mono">${esc(x.c)}</span>`,

  PC.innerHTML=`
    <div class="filtros" role="group" aria-label="Filtros de las cinco tablas">
      <span class="rotulo">Filtros</span>
      <select id="f-sede" aria-label="Sede"><option value="">todas las sedes</option>${
        sedes.map(s=>`<option${F.sede===s?" selected":""}>${esc(s)}</option>`).join("")}</select>
      <select id="f-tipo" aria-label="Tipo"><option value="">todos los tipos</option>${
        tipos.map(t=>`<option value="${esc(t)}"${F.tipo===t?" selected":""}>${esc(tnom(t))}</option>`).join("")}</select>
      <select id="f-estado" aria-label="Estado"><option value="">todos los estados</option>${

      <input id="f-q" type="search" placeholder="código, proveedor, marca…" value="${esc(F.q)}" aria-label="Buscar" style="min-width:170px">

    <div class="tabs" role="tablist">${TABS.map(([k,n])=>

    "Ocupados = ocupación % × comercializables, redondeado — <b>cálculo del frontend</b>. El mes sin snapshot no se rellena.",
    tablaCorta([{t:"Mes"},{t:"Comercializables",n:1},{t:"Ocupados",n:1},{t:"Ocupación",n:1},{t:"Ingreso contratado",n:1},{t:"Origen"}],
      D.tc.map(s=>[esc(mesCorto(s.p)), s.sd?"sin dato":num(s.esp), s.sd?"—":num(Math.round(s.occ*s.esp/100)),
        s.sd?"—":pct(s.occ), s.sd?"—":pesos(s.ing), s.sd?"sin snapshot":(s.parcial?"parcial":"cierre")]))],
  tm: ()=>["Tendencia de Mercamío · 12 meses",
    "Las dos cosas de mayo-junio no tienen que ver entre sí: el escalón del inventario (+108 caras) y la cancelación de Higiénicos Zafra.",
    tablaCorta([{t:"Mes"},{t:"Comercializables",n:1},{t:"Ocupados",n:1},{t:"Ocupación",n:1},{t:"Ingreso contratado",n:1},{t:"Origen"}],
      D.tm.map(s=>[esc(mesCorto(s.p)), s.sd?"sin dato":num(s.esp), s.sd?"—":num(Math.round(s.occ*s.esp/100)),
        s.sd?"—":pct(s.occ), s.sd?"—":pesos(s.ing), s.sd?"sin snapshot":(s.parcial?"parcial":"cierre")]))],
  sedes: ()=>["Ocupación por sede", "Ordenadas de peor a mejor, que es el orden de la llamada. Los tres estados van separados: «se libera» no es «libre» todavía, y tiene fecha.",
    tablaCorta([{t:"Sede"},{t:"Espacios",n:1},{t:"Ocupado",n:1},{t:"Se libera",n:1},{t:"Libre",n:1},{t:"Ocupación",n:1},{t:"Contra el promedio",n:1},{t:""}],
      DET.sedes.slice().sort((a,b)=>a.ocupacion_pct-b.ocupacion_pct).map(s=>{
        const e=ESP.filter(x=>x.s===s.sede);

  prov: ()=>["Los 25 proveedores de Mercamío", "Ordenados por participación sobre los contratos. La columna «% del ingreso» es el otro número: son dos cosas.",
    tablaCorta([{t:"Proveedor"},{t:"Contratos",n:1},{t:"Participación",n:1},{t:"Canon total",n:1},{t:"% del ingreso",n:1},{t:"Desde"},{t:"Vencen 60 d",n:1}],
      PROV_ORD.map(p=>[esc(p.n), p.esp, pct(p.pp), pesos(p.ct), pct(100*p.ct/CANON_TOT), fecha(p.desde), p.v60]))],
  bm: ()=>["Canon del cliente contra el promedio de la plataforma", "La batea no tiene un solo contrato: no hay promedio propio que comparar. Un nulo no es un cero.",
    tablaCorta([{t:"Tipo"},{t:"Total",n:1},{t:"Libres",n:1},{t:"Canon del cliente",n:1},{t:"Benchmark",n:1},{t:"Brecha",n:1},{t:"Tarifa cargada"}],
      BM.map(r=>[esc(tnom(r.t)), r.total, r.libres, r.cli==null?"sin contratos":pesos(r.cli), pesos(r.ben),
        r.br==null?"no medible":pctF(r.br), r.tar?"sí":"<b>no</b>"]))],
  venc: ()=>["Los nueve contratos que vencen en 60 días", "Ordenados por fecha. Los tres primeros vencen dentro de septiembre y por eso su espacio <b>ya cambió de estado</b>.",
    tablaCorta([{t:"Vence"},{t:"Días",n:1},{t:"Proveedor"},{t:"Espacio"},{t:"Tipo"},{t:"Canon",n:1},{t:"Estado hoy"}],
      VENC.map(v=>{ const e=ESP.find(x=>x.c===v.codigo);

    tablaCorta([{t:"Mes"},{t:"Entradas",n:1},{t:"$ entradas",n:1},{t:"Salidas",n:1},{t:"$ salidas",n:1},{t:"Cancelaciones",n:1},{t:"Saldo",n:1}],
      DET.mov.map(x=>{ const e=x.ent.reduce((a,y)=>a+y.v,0), s=x.sal.reduce((a,y)=>a+y.v,0);

  tipos: ()=>["El inventario por tipo", "Cuántos hay, en qué estado están y a cuánto los cobra este cliente. Los tres estados, siempre tres.",
    tablaCorta([{t:"Tipo"},{t:"Total",n:1},{t:"Ocupado",n:1},{t:"Se libera",n:1},{t:"Libre",n:1},{t:"Canon del cliente",n:1},{t:"Benchmark",n:1},{t:"Tarifa"},{t:""}],
      DET.tipos.slice().sort((a,b)=>b.total-a.total).map(t=>[esc(tnom(t.tipo)), t.total,
        ESP.filter(x=>x.t===t.tipo&&x.e==="ocupado").length, ESP.filter(x=>x.t===t.tipo&&x.e==="se_libera").length,

        t.canon_promedio?pesos(t.canon_promedio):"sin contratos", pesos(DET.bench[t.tipo]), t.tarifa_configurada?"sí":"<b>no</b>",
        `<button class="btn" data-detalle='{"tipo":"${esc(t.tipo)}"}'>ver sus espacios</button>`]))],
  spread: ()=>["Spread por cliente", "Negativo = cobra menos que su propia tarifa de referencia. Los nulos se cuentan, no se dibujan en el cero.",

      C.clientes.map(c=>[esc(c.nombre),

        c.metricas? pesos(c.metricas.ingreso_contratado_mes):"sin dato",
        c.metricas? c.metricas.contratos_sin_tarifa : "—",
        c.metricas? (c.metricas.tarifa_configurada?"sí":"<b>no</b>") : "—"]))],
  topprov: ()=>["Los proveedores de la cartera", "Cinco conteos, sin porcentaje: la cartera publica el top 5 por cliente pero <b>no el total de contratos de cada cliente</b>. Un porcentaje sin denominador publicado es un número inventado.",
    tablaCorta([{t:"Proveedor"},{t:"Contratos en la cartera",n:1},{t:"En cuántos clientes está en el top 5",n:1}],
      CON.top_proveedores.map(p=>[esc(p.nombre), p.contratos_activos,
        C.clientes.filter(c=>c.metricas && c.metricas.top_proveedores.some(x=>x.nombre===p.nombre)).length]))],
  cohortes: ()=>["Cohortes por mes de alta", "Con 1 o 2 clientes por cohorte, «0 %» y «100 %» son la misma información que «0 de 2» y «1 de 1»: <b>manda el conteo</b>. Cinco filas: es una tabla, no un gráfico.",
    tablaCorta([{t:"Mes de alta"},{t:"Clientes",n:1},{t:"Siguen entrando a 30 días",n:1},{t:"Clasificación"}],
      D.adopcion.cohortes.map(c=>[`<span class="mono">${esc(c.cohorte)}</span>`, c.clientes,
        `${Math.round(c.retencion_30d_pct*c.clientes/100)} de ${c.clientes} <span class="ter">${dec(c.retencion_30d_pct,0)} %${c.clientes<=2?" · n = "+c.clientes:""}</span>`,
        [["activa",c.activa],["dormida",c.dormida],["fantasma",c.fantasma],["sin cuentas",c.sin_cuentas],["nueva",c.nueva]]
          .filter(x=>x[1]).map(x=>`${x[1]} ${x[0]}`).join(" · ")]))],
  composicion: ()=>["Por qué el delta grande va contra la columna del medio",
    "La primera columna no se esconde: se muestra tachada y se explica. La diferencia se le atribuye entera a <b>Mercado El Guadual</b>, el único cliente que cambió de estado entre los dos cierres — <b>cálculo del frontend</b>, no un dato del endpoint.",
    tablaCorta([{t:""},{t:"agosto publicado",n:1},{t:"agosto a igual composición",n:1},{t:"septiembre",n:1}],
      [["Clientes en la cuenta",`<span class="tachado">6</span>`,"5",`5 <span class="ter">+1 sin dato</span>`],
       ["Espacios comercializables",`<span class="tachado">${num(tcAgo.esp)}</span>`,num(agoComp.esp),num(tcSep.esp)],
       ["Ocupación",`<span class="tachado">${pct(tcAgo.occ)}</span>`,pct(agoComp.occ),pct(tcSep.occ)],
       ["Ingreso contratado",`<span class="tachado">${pesos(tcAgo.ing)}</span>`,pesos(agoComp.ing),pesos(tcSep.ing)]]
      .map(r=>[r[0],r[1],r[2],r[3]]))],
  operativo: ()=>["Operaciones · fuera de la historia",
    "Estados de cuenta y solicitudes de supresión existen y tienen su lugar, pero no son análisis: son las <b>dos únicas cosas que se pueden escribir</b> en toda la plataforma. Lo único que sube a la historia es el chip de estado en la fila del cliente.",
    tablaCorta([{t:"Cliente"},{t:"Estado"},{t:"Motivo"},{t:"Cambiado"}],
      D.estados.map(e=>[esc(e.nombre), `<span class="chip">${esc(e.estado)}</span>`, esc(e.motivo||"—"),
        `<span class="mono">${e.cambiado_en?esc(e.cambiado_en.slice(0,10)):"—"}</span>`]))
    + `<h3 style="font-size:var(--t-sm);font-weight:700;margin-top:var(--s4)">Solicitudes de supresión (ley 1581) · 1 pendiente, 1 atendida</h3>`
    + tablaCorta([{t:"#"},{t:"Cliente"},{t:"Motivo"},{t:"Estado"},{t:"Creada"}],
      D.supresiones.map(s=>[`<span class="mono">#${s.id}</span>`, esc(cli(s.cliente_slug)?cli(s.cliente_slug).nombre:s.cliente_slug),
        esc(s.motivo), `<span class="chip">${esc(s.estado)}</span>`, `<span class="mono">${esc(s.creado_en.slice(0,10))}</span>`]))],
  endpoints: ()=>["Los endpoints de estas tres pantallas",
    "La sesión sale de <b>dos llamadas</b>, no de una: el detalle del cliente y las métricas de la cartera. El «contra la cartera» del capítulo 1 viene de la segunda — y por eso <b>no puede ir en el informe del cliente</b>.",
    tablaCorta([{t:"Clave"},{t:"Llamada"}], Object.entries(D.endpoints).map(([k,v])=>
      [`<span class="mono">${esc(k)}</span>`,`<span class="mono">${esc(v)}</span>`]))],
  frontera: ()=>["Lo que nunca sale de la base del cliente",
    "Reglas de frontera del backend, escritas tal cual las trae el ejemplo.",
    `<ul style="font-size:var(--t-xs);color:var(--ink-2);line-height:1.6;padding-left:var(--s4);list-style:disc">
      ${D.frontera.nunca_sale.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
     <p class="nota" style="margin-top:var(--s3)"><b>Saneado:</b> ${esc(D.frontera.saneado)}<br>
      <b>Sólo lectura:</b> ${esc(D.frontera.solo_lectura)}<br>
      <b>Bitácora:</b> ${esc(D.frontera.bitacora)}</p>`],
  caribe_tipos: ()=>["Almacenes Caribe · qué hay y a cuánto lo cobra el resto de la plataforma",
    "<b>Todos los precios salen del benchmark</b> (<span class='mono'>origen_precio: benchmark</span>): el cliente no tiene promedio propio porque no tiene contratos.",
    (()=>{ const r=NUE.recs[0];
      const filas=r.d.espacios_por_tipo.map(t=>({...t, ben:NUE.bench[t.tipo], v:t.total*NUE.bench[t.tipo]})).sort((a,b)=>b.v-a.v);
      return tablaCorta([{t:"Tipo"},{t:"Espacios",n:1},{t:"Benchmark por espacio",n:1},{t:"Potencial al mes",n:1}],
        filas.map(t=>[esc(tnom(t.tipo)), t.total, pesos(t.ben), pesos(t.v)])
        .concat([["<b>Total</b>",`<b>${NUE.espacios.length}</b>`,"",`<b>${pesos(r.v)}</b>`]])); })()]
};
function verTabla(clave){
  const f=TABLAS[clave]; if(!f) return;
  const [tit,sub,html]=f();
  abrirPanel("Tabla equivalente", tit, sub, html);
}

function panelModulo(m){
  return `<div class="panelito">
    <p class="frase chica">${m.frase}</p>
    <p class="ruta">${esc(m.ruta)}</p>
    <figure>${m.fig()}</figure>
    <p class="nota">${m.nota}</p>
    ${m.tabla?`<div>${botonTabla(m.tabla)}</div>`:""}
    ${m.extra||""}
  </div>`;
}

function vistaCartera(){
  const plata={
    "mercado-el-guadual":{n:"—", r:"sin cifra"},
    "tiendas-la-vereda":{n:pesos(48360000), r:"en riesgo · "+pct(100*48360000/CON.ingreso_contratado_mes)},
    "superandes":{n:"≈ "+pesos(SUPER_APROX), r:"sin cobrar · aprox."},
    "mercamio":{n:pesos(M.oportunidad_nueva), r:"sin vender"},
    "provisiones-tolima":{n:"sin referencia", r:"no medible"},
    "almacenes-caribe":{n:pesos(NUE.recs[0].v), r:"al benchmark"}
  };
  const filas=DER.cartera.orden_por_necesidad_de_asesoria.map(o=>{
    const c=cli(o.slug), a=ado(o.slug), m=c.metricas, p=plata[o.slug], nc=contratosDe(o.slug);
    const acceso = a.dias_sin_acceso==null ? (a.usuarios_con_cuenta===0?"sin cuentas creadas":"nunca entró")
      : a.dias_sin_acceso===0 ? "entró hoy" : a.dias_sin_acceso+" días sin acceso";
    const met = (m ? `${num(m.espacios_comercializables)} espacios · ${m.sedes_con_plano} ${m.sedes_con_plano===1?"sede":"sedes"} · ${pct(m.ocupacion_pct)} ocup.${nc?" · ≈ "+nc+" contratos":""}`
      : "base ilegible este periodo") + ` · cuenta ${c.estado_cuenta} · ${acceso}`;
    const abre = o.slug==="mercamio"||o.slug==="almacenes-caribe";
    return `<div class="fila" data-slug="${o.slug}">
      <span class="orden${o.puesto<=4?"":" suave"}">${o.puesto}</span>
      <div class="nom">${esc(c.nombre)}</div>
      <div class="razon"><span class="chip" style="margin-right:5px">${esc(SENAL[o.senal])}</span>${esc(o.razon)}</div>
      <div class="plata"><b>${esc(p.n)}</b><span class="r">${esc(p.r)}</span></div>
      <div class="ir">${abre?`<button class="btn" data-sesion="${o.slug}">Sesión →</button>`
        :`<span class="ter" style="font-size:var(--t-3xs)">sin detalle</span>`}</div>
      <div class="met">${esc(met)}</div>
    </div>`;
  }).join("");

  return `
  <div class="cabecera">
    <div><h1>La cartera · ${esc(mesLargo(C.periodo.anio_mes))}</h1>
      <div class="sub">Consola del operador · ${CON.clientes_total} clientes, ${CON.clientes_total-CON.clientes_con_error} leídos y
        ${CON.clientes_con_error} con error · mes en curso, parcial · generado ${esc(C.generado_en.slice(11,16))} UTC</div></div>
    <button class="btn-signal" data-sesion="mercamio">Abrir la sesión de Mercamío →</button>
  </div>

  <div class="caja" style="flex:0 0 auto;padding:var(--s3);display:grid;
       grid-template-columns:minmax(0,1.35fr) minmax(0,.85fr) minmax(0,1.5fr);gap:var(--s5);align-items:start">
    <div>
      <p class="frase">La cartera factura <em>${pesos(CON.ingreso_contratado_mes)}</em> sobre
        <em>${num(CON.espacios_comercializables)}</em> espacios en <em>${CON.sedes_con_plano}</em> sedes, al
        <em>${pct(CON.ocupacion_pct)}</em>. Contra agosto parece perder ${pesosM(tcAgo.ing-tcSep.ing)} y
        ${dec(tcAgo.occ-tcSep.occ)} puntos, y <b>no perdió nada</b>: Mercado El Guadual no se dejó leer y salió de
        las dos puntas de la cuenta.</p>
      <p class="ruta">cartera.consolidado · tendencia_cartera.serie[2026-08] y [2026-09]</p>
    </div>
    <div><span class="rotulo">Ingreso contratado del mes</span>
      <span class="grande">${pesos(CON.ingreso_contratado_mes)}</span>
      <div class="delta"><span class="n">${pesosF(deltaIng)}</span><span class="n">${pctF(deltaIngPct)}</span></div>
      <p class="ruta" style="margin-top:4px">contra agosto a igual composición · canon promedio ${pesos(CON.canon_promedio_mensual)}</p></div>
    <div>
      <span class="rotulo">La corrección de composición</span>
      <p class="nota" style="margin-top:3px"><b>Agosto publicado</b>
        <span class="mono tachado">${pesos(tcAgo.ing)} · ${pct(tcAgo.occ)} · 6 clientes</span> →

function candChips(cands, ojoProv){
  /* el candidato con la advertencia de concentración va ÚLTIMO: la lista de
     candidatos no puede ofrecer primero al que el hallazgo H2 desaconseja. */
  const orden = cands.slice().sort((a,b)=> (a.p===ojoProv?1:0)-(b.p===ojoProv?1:0));
  return `<div class="cands">${orden.map(c=>{
    const ojo=c.p===ojoProv;
    return `<span class="cand${ojo?" ojo":""}"><b>${esc(c.p)}</b>
      <span class="ter mono">canon hoy ${pesos(c.v)}</span>
      ${c.mt?"":`<span class="ter">— todavía no tiene este tipo</span>`}
      ${ojo?`<span class="adv">⚠ ya pesa ${pct(V0.pp)}</span>`:""}</span>`;}).join("")}</div>`;
}
