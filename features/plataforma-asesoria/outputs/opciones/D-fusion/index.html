/* ═══════════════════════════════════════════════════════════════════════════
   NAVEGACIÓN Y ESTADO
   ═════════════════════════════════════════════════════════════════════════ */
const VS={cartera:$("#v-cartera"), sesion:$("#v-sesion"), informe:$("#v-informe")};
function pintaCartera(){ VS.cartera.innerHTML=vistaCartera(); }
function pintaSesion(){ VS.sesion.innerHTML=vistaSesion(); }
function pintaCap(){
  $$(".cap").forEach(s=>{
    const n=+s.dataset.cap;
    s.dataset.on = n===CAP ? "1":"0";
    if(n===CAP && !s.innerHTML.trim()) s.innerHTML=CAPFN[n-1]();
  });
  $$(".rail button").forEach(b=>b.setAttribute("aria-current", String(+b.dataset.cap===CAP)));
}
function repintaCap(){ const s=$(`.cap[data-cap="${CAP}"]`); if(s) s.innerHTML=CAPFN[CAP-1](); }
function ir(p){
  Object.entries(VS).forEach(([k,el])=>el.dataset.on = k===p?"1":"0");
  $$(".piezas button").forEach(b=>b.setAttribute("aria-current", String(b.dataset.pieza===p)));
  document.body.classList.toggle("documento", p==="informe");
  if(p==="sesion" && !VS.sesion.innerHTML.trim()) pintaSesion();
  if(p==="informe" && !VS.informe.innerHTML.trim()) VS.informe.innerHTML=vistaInforme();
  window.scrollTo(0,0);
}

/* el selector de periodo MANDA sobre las tres piezas — y por eso los meses
   sin dato están deshabilitados: el control no puede prometer lo que no hay. */
(function(){
  const sel=$("#periodo");
  sel.innerHTML = D.tc.slice().reverse().map(s=>
    `<option value="${s.p}"${s.p==="2026-09"?" selected":" disabled"}>${mesLargo(s.p)}${
      s.p==="2026-09"?" · parcial":(s.sd?" · sin snapshot":" · sin detalle cargado")}</option>`).join("");
  sel.title="Este ejemplo trae un solo periodo con detalle: 2026-09. Cambiar el rótulo sin cambiar el dato sería mentir.";
})();

/* ── un solo escuchador para toda la aplicación ─────────────────────────── */
document.addEventListener("click", e=>{
  const t=e.target;
  if(t.closest("[data-noop]")){ e.preventDefault(); return; }
  const cerrar=t.closest("[data-cerrar]"); if(cerrar){ cerrarPanel(); return; }
  const pieza=t.closest("[data-pieza]"); if(pieza){ ir(pieza.dataset.pieza); return; }
  const ses=t.closest("[data-sesion]");
  if(ses){ CLIENTE=ses.dataset.sesion; CAP=1; MOD1="sedes"; HALL="h1"; ACC=1; pintaSesion(); ir("sesion"); return; }
  const cap=t.closest("[data-cap]"); if(cap && cap.tagName==="BUTTON"){ CAP=+cap.dataset.cap; pintaCap(); return; }
  const m1=t.closest("[data-mod1]"); if(m1){ MOD1=m1.dataset.mod1; repintaCap(); return; }
  const mc=t.closest("[data-modc]"); if(mc){ MODC=mc.dataset.modc; pintaCartera(); return; }
  const it=t.closest("[data-item]");
  if(it){ const [k,v]=it.dataset.item.split(":");
    if(k==="hall") HALL=v; else ACC=+v; repintaCap(); return; }
  const tb=t.closest("[data-tabla]"); if(tb){ verTabla(tb.dataset.tabla); return; }
  const dt=t.closest("[data-detalle]"); if(dt){ verDetalle(JSON.parse(dt.dataset.detalle)); return; }
  const cd=t.closest("[data-cod]");
  if(cd){ const o=JSON.parse(cd.dataset.cod);
    const g = o.tipo ? gruposDeTipo(o.tipo) : GRUPOS.filter(x=>x.s===o.sede).sort((a,b)=>b.n-a.n);
    verCodigos(g, o.titulo); return; }
  const cds=t.closest("[data-codigos]");
  if(cds){ const [s,tp]=cds.dataset.codigos.split("|");
    verCodigos(GRUPOS.filter(g=>g.s===s&&g.t===tp)); return; }
  if(t.id==="btn-mas"){ pintarTanda(); return; }
  const tab=t.closest("[data-tab]"); if(tab){ F.tab=tab.dataset.tab; pintarDetalle(); return; }
  if(t.id==="f-limpiar"){ F.sede=F.tipo=F.estado=F.q=""; pintarDetalle(); return; }
  if(t.id==="imprimir"){ window.print(); return; }
  if(t.id==="ord-plata"){
    const cola=$("#cola"); if(!cola) return;
    const val={mercamio:M.oportunidad_nueva, "almacenes-caribe":NUE.recs[0].v, "tiendas-la-vereda":48360000,
      superandes:SUPER_APROX, "provisiones-tolima":-1, "mercado-el-guadual":-2};
    const filas=$$(".fila",cola), por = t.dataset.on!=="1";
    if(por){ filas.map(f=>[f,val[f.dataset.slug]]).sort((a,b)=>b[1]-a[1]).forEach(([f])=>cola.appendChild(f));
      t.textContent="Volver al orden por riesgo"; t.dataset.on="1"; }
    else { filas.slice().sort((a,b)=>+$(".orden",a).textContent-+$(".orden",b).textContent).forEach(f=>cola.appendChild(f));
      t.textContent="Ordenar por plata"; t.dataset.on="0"; }
    return;
  }
});
document.addEventListener("input", e=>{
  const id=e.target.id;
  if(id==="f-sede"||id==="f-tipo"||id==="f-estado"||id==="f-q"){
    F[id==="f-q"?"q":id.slice(2)]=e.target.value; pintarDetalle(); return;
  }
});
document.addEventListener("change", e=>{
  if(e.target.id==="sel-cliente"){ CLIENTE=e.target.value; CAP=1; MOD1="sedes"; HALL="h1"; ACC=1; pintaSesion(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && PANEL.dataset.on==="1") cerrarPanel(); });

/* ── tema: claro por defecto, oscuro a un clic ──────────────────────────── */
$("#tema").addEventListener("click",()=>{
  const osc=document.documentElement.getAttribute("data-tema")==="oscuro";
  if(osc) document.documentElement.removeAttribute("data-tema");
  else document.documentElement.setAttribute("data-tema","oscuro");
  $("#tema").textContent = osc?"Oscuro":"Claro";
  $("#tema").setAttribute("aria-label", osc?"Cambiar a tema oscuro":"Cambiar a tema claro");
  try{ localStorage.setItem("recabra-tema", osc?"claro":"oscuro"); }catch(_){}
});
try{ if(localStorage.getItem("recabra-tema")==="oscuro"){
  document.documentElement.setAttribute("data-tema","oscuro"); $("#tema").textContent="Claro"; } }catch(_){}

/* ── arranque ───────────────────────────────────────────────────────────── */
pintaCartera();
</script>
