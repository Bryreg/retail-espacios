<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO de la landing (Fase 9). Va acá, en el HTML servido, y no puesto por
         JavaScript: quien comparte el enlace en un WhatsApp o en un correo tiene
         que ver de qué se trata sin que nadie ejecute nada. `/` sin sesión es la
         landing pública; el resto de la aplicación vive detrás del ingreso y no
         se indexa igual. El texto es el de `features/landing/outputs/copy.md`
         §1, literal. -->
    <title>RECABRA — Espacios comerciales de tu supermercado</title>
    <meta
      name="description"
      content="Qué mueble está libre, quién lo ocupa, a cuánto y hasta cuándo. RECABRA lleva la venta de espacios de exhibición de tu supermercado, sede por sede."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="RECABRA" />
    <meta property="og:title" content="RECABRA — Espacios comerciales de tu supermercado" />
    <meta
      property="og:description"
      content="Dibujás el plano de cada sede, marcás qué muebles se alquilan y vendés tocando el mapa. Contratos, tarifas, vencimientos y montaje con foto."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://retail-espacios.onrender.com/" />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary_large_image" />
<!-- La imagen de la tarjeta (auditoría P3-14): 1200 × 630, la portada con
         el plano isométrico de EJEMPLO y la leyenda de estados (ningún dato de
         un cliente). Es una captura de la landing de este repo; se rehace con
         `node scripts/generar-og.mjs` (ver el comentario del script). La URL
         es absoluta porque así la piden los que leen OG (WhatsApp, Slack). -->
    <meta property="og:image" content="https://retail-espacios.onrender.com/og-recabra.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Plano isométrico de un supermercado de ejemplo, con los muebles pintados según estén libres, por liberarse u ocupados."
    />
    <meta name="twitter:image" content="https://retail-espacios.onrender.com/og-recabra.png" />

    <!-- CERO FUENTES WEB (Fase 10). Acá había un `preconnect` a
         fonts.googleapis.com, otro a fonts.gstatic.com y la hoja de Chivo +
         Archivo Narrow. Se fueron con las dos familias: el interior pasó a las
         tres pilas de sistema de la landing (`--f-display`, `--f-text`,
         `--f-mono`, en `src/tema.css`), que es lo que la landing ya usaba.

         Las dos razones por las que ese par estaba elegido están contestadas
         por escrito en `features/diseno-interior/outputs/tema.md` §3.2 — la del
         «900 de verdad» refutada (el total del contrato es una CIFRA y le toca
         el tratamiento mono, no un peso de titular) y la de la condensada
         respetada como medición y resuelta ensanchando la COLUMNA en `ch`, que
         es la regla del dueño: se ajusta la columna, no la tipografía.

         Lo que se gana: dos orígenes externos menos, dos descargas bloqueantes
         menos en el primer render, y un LCP de la landing que ya no espera a
         una hoja de estilos de un tercero. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
