name: CI · Deploy

# The live site is on Render, which builds from `main` on its own the moment a
# commit lands (see render.yaml) — nothing here triggers it and nothing here can
# break it.
#
# The VPS job below is the repo's other deployment path (docker-compose.prod.yml
# + nginx/retail.conf). It is real, but its secrets were never configured, so it
# failed on every single push from June onwards and turned the checks permanently
# red — which is how a genuine failure would have gone unnoticed. It is opt-in
# now: set the repository variable DEPLOY_TARGET to "vps" (Settings → Secrets and
# variables → Actions → Variables) together with VPS_HOST, VPS_USER and
# VPS_SSH_KEY, and it runs. Leave it unset and it is skipped, not failed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20          # matches the Dockerfile's frontend stage
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps because that is what the Dockerfile uses, and CI has
      # to install the same tree production builds from. The conflict is real:
      # @react-three/drei@10 wants @react-three/fiber@^9 and this project is
      # pinned to fiber@8 (the 3D editor is written against v8). Plain `npm ci`
      # fails outright here.
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend
      # Las suites puras del frontend: geometría, nomenclatura, disponibilidad y
      # el estado comercial. Corren sin navegador —transpilan el .ts con el
      # esbuild que ya trae vite y afirman en node— y tardan seis segundos.
      # Estuvieron fuera de CI hasta acá, que es como una suite se pudre: la
      # escribe alguien, pasa en su máquina y nadie se entera cuando deja de
      # pasar. Lo que fijan es justo lo que no se cae solo — que un contrato se
      # pinte en SU sede, que la fusión reemplace en vez de rellenar — y de eso
      # nadie se entera hasta que alguien vende mal.
      - name: Pruebas puras
        run: npm run probar
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    # La suite tardaba ~25 min en serie; en paralelo (`-n auto`, abajo), bastante
    # menos. Sin tope, un job trabado esperaba las 6 h que da GitHub sin decir
    # nada (el PR #80 estuvo 100 min «corriendo» con todo verde adentro): pasado
    # este tiempo falla y muestra su log.
    timeout-minutes: 60
    # Postgres de verdad (auditoría P1-9): los candados contra la doble venta
    # (`services/candado.py`) en SQLite no hacen nada, y las carreras de dos
    # hilos, el candado de líder del mantenimiento, el `statement_timeout` y el
    # respaldo de la plataforma se saltaban sin `DATABASE_URL_PG_PRUEBA`. Es
    # una base descartable: las pruebas la vacían y la vuelven a armar.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prueba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # test_ingresos_12 compara los modelos contra el commit 6dd2f4c con
          # `git show`: con el clon superficial por defecto ese commit no existe.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"    # matches the Dockerfile's runtime stage
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      # El cliente de Postgres de la MISMA versión mayor que el servicio (16).
      # El `pg_dump`/`pg_restore` por defecto del runner es más nuevo y vuelca
      # `SET transaction_timeout`, que un servidor 16 rechaza: la prueba de ida
      # y vuelta del respaldo fallaba por la máquina, no por el código.
      - name: Cliente de Postgres 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_restore ]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y postgresql-client-16
          fi
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_restore --version
      # En paralelo (auditoría P3-12): cada prueba arma sus bases en una carpeta
      # temporal propia (`tests/conftest.py`), así que los procesos de
      # `pytest-xdist` ya no se pisan `recabra_<slug>.db`. Las pruebas contra
      # Postgres comparten la base `prueba` y van todas al mismo proceso
      # (`xdist_group("postgres")` + `--dist loadgroup`).
      #
      # Y ninguna prueba de Postgres puede saltarse acá: si
      # `DATABASE_URL_PG_PRUEBA` dejara de llegar, se saltarían en verde. `-rs`
      # lista los motivos de cada salto; el de ésas dice «Postgres descartable».
      - name: pytest
        working-directory: backend
        shell: bash
        env:
          JWT_SECRET: ci-secret
          # Cada prueba crea su base SQLite en el directorio temporal, y cada
          # CREATE TABLE del arranque hace fsync: en memoria (tmpfs) la suite
          # tarda ~25 % menos (local: 31 → 24 min, las mismas 1613 pasan).
          TMPDIR: /dev/shm
          DATABASE_URL_PG_PRUEBA: postgresql://postgres:postgres@127.0.0.1:5432/prueba
        run: |
          python -m pytest -n auto --dist loadgroup -rs 2>&1 | tee salida-pytest.txt
          if grep -q "Postgres descartable" salida-pytest.txt; then
            echo "::error::Se saltaron pruebas de Postgres: el servicio no llegó a la suite."
            exit 1
          fi

  deploy-vps:
    name: Deploy al VPS vía SSH
    needs: [frontend, backend]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_TARGET == 'vps'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy al VPS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/retail-espacios

            echo "── Pulling rama main ──"
            git fetch origin main
            git checkout main
            git pull origin main

            echo "── Build de imagen (el contenedor actual sigue vivo) ──"
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "── Reemplazando contenedor ──"
            docker compose -f docker-compose.prod.yml up -d --force-recreate app

            echo "── Health check (espera hasta 60s) ──"
            for i in $(seq 1 12); do
              sleep 5
              if docker exec retail_prod curl -sf http://localhost:8000/api/health/ready > /dev/null 2>&1; then
                echo "✅ Contenedor healthy"
                break
              fi
              echo "  Intento $i/12..."
              if [ $i -eq 12 ]; then
                echo "❌ Health check falló — logs:"
                docker compose -f docker-compose.prod.yml logs --tail 80 app
                exit 1
              fi
            done

            echo "── Reload nginx ──"
            docker exec nginx nginx -s reload 2>/dev/null || nginx -s reload 2>/dev/null || true

            echo "── Limpieza de imágenes antiguas ──"
            docker image prune -f

            echo "✅ Producción desplegada"
