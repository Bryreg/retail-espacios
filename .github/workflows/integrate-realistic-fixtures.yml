name: Integrate realistic fixture designs

on:
  push:
    branches:
      - codex/auditar-repositorio-para-visualizacion-3d
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/auditar-repositorio-para-visualizacion-3d
          fetch-depth: 1

      - name: Normalize StoreEditor3D source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/StoreEditor3D/StoreEditor3D.tsx')
          s = p.read_text(encoding='utf-8')
          if '\\n' in s and s.count('\n') <= 2:
              decoded = s.replace('\\r\\n', '\n').replace('\\n', '\n')
              p.write_text(decoded, encoding='utf-8')
              print(f'Decoded StoreEditor3D to {decoded.count(chr(10)) + 1} lines.')
          else:
              print(f'StoreEditor3D already normalized: {s.count(chr(10)) + 1} lines.')
          PY

      - name: Repair gondola JSX wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/StoreEditor3D/StoreEditor3D.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''          {!isWall && (\n            <mesh position={[0, sy + shelfT * 0.5 + 0.019, d / 2 - 0.010]} castShadow>\n              <boxGeometry args={[w - 0.07, 0.038, 0.009]} />\n              <meshStandardMaterial color={G_RAIL} metalness={0.48} roughness={0.34} transparent opacity={op} />\n            </mesh>\n            <mesh position={[0, sy + shelfT * 0.5 + 0.019, d / 2 + 0.0005]}>\n              <boxGeometry args={[w - 0.13, 0.023, 0.004]} />\n              <meshStandardMaterial color="#f6f4ed" metalness={0.02} roughness={0.72} transparent opacity={op} />\n            </mesh>\n          )}'''
          new = '''          {!isWall && (\n            <>\n              <mesh position={[0, sy + shelfT * 0.5 + 0.019, d / 2 - 0.010]} castShadow>\n                <boxGeometry args={[w - 0.07, 0.038, 0.009]} />\n                <meshStandardMaterial color={G_RAIL} metalness={0.48} roughness={0.34} transparent opacity={op} />\n              </mesh>\n              <mesh position={[0, sy + shelfT * 0.5 + 0.019, d / 2 + 0.0005]}>\n                <boxGeometry args={[w - 0.13, 0.023, 0.004]} />\n                <meshStandardMaterial color="#f6f4ed" metalness={0.02} roughness={0.72} transparent opacity={op} />\n              </mesh>\n            </>\n          )}'''
          if old not in s:
              raise SystemExit('expected gondola JSX block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Repair remaining TypeScript integration errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/StoreEditor3D/StoreEditor3D.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('switch (fixture.type) {', 'switch (String(fixture.type)) {')
          p.write_text(s, encoding='utf-8')

          r = Path('frontend/src/components/StoreEditor3D/RealisticFixtureRenderer.tsx')
          rs = r.read_text(encoding='utf-8')
          rs = rs.replace('import React from "react";\n', '')
          rs = rs.replace('gondolaType?: string;', 'gondolaType?: "double" | "wall";')
          rs = rs.replace('case "gondola": return <RealisticGondola w={w} d={d} h={h} ghost={ghost} />;', 'case "gondola": return <RealisticGondola w={w} d={d} h={h} ghost={ghost} gondolaType={gondolaType} />;')
          r.write_text(rs, encoding='utf-8')
          PY

      - name: Wire realistic renderer into StoreEditor3D
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/StoreEditor3D/StoreEditor3D.tsx')
          s = p.read_text(encoding='utf-8')
          old_import = 'import { RealisticGondola, RealisticPunta, RealisticRobatope, RealisticRistra, RealisticCross, RealisticMetro, RealisticMueble } from "./RealisticFixtureDesigns";'
          new_import = 'import { RealisticFixtureRenderer } from "./RealisticFixtureRenderer";'
          s = s.replace(old_import, new_import)
          replacements = {
            'case "gondola": return <RealisticGondola w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;': 'case "gondola": return <RealisticFixtureRenderer type="gondola" w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} gondolaType={fixture.gondolaType} planogram={fixture.planogram} />;',
            'case "punta": return <RealisticPunta w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;': 'case "punta": return <RealisticFixtureRenderer type="punta" w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;',
            'case "robatope": return <RealisticRobatope w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;': 'case "robatope": return <RealisticFixtureRenderer type="robatope" w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;',
            'case "ristra": return <RealisticRistra w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;': 'case "ristra": return <RealisticFixtureRenderer type="ristra" w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;',
            'case "cross": return <RealisticCross w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;': 'case "cross": return <RealisticFixtureRenderer type="cross" w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;',
            'case "metro": return <RealisticMetro w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;': 'case "metro": return <RealisticFixtureRenderer type="metro" w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;',
            'case "mueble": return <RealisticMueble w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;': 'case "mueble": return <RealisticFixtureRenderer type="mueble" w={fixture.w} d={fixture.d} h={fixture.h} ghost={ghost} />;',
          }
          for old, new in replacements.items():
              s = s.replace(old, new, 1)
          required = [
            'case "gondola": return <RealisticFixtureRenderer',
            'case "punta": return <RealisticFixtureRenderer',
            'case "robatope": return <RealisticFixtureRenderer',
            'case "ristra": return <RealisticFixtureRenderer',
            'case "cross": return <RealisticFixtureRenderer',
            'case "metro": return <RealisticFixtureRenderer',
            'case "mueble": return <RealisticFixtureRenderer',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('missing renderer cases: ' + ', '.join(missing))
          p.write_text(s, encoding='utf-8')
          PY

      - name: Typecheck and build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
        working-directory: frontend

      - name: Commit normalized source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/StoreEditor3D/StoreEditor3D.tsx frontend/src/components/StoreEditor3D/RealisticFixtureRenderer.tsx
          if git diff --cached --quiet; then
            echo 'No source normalization changes needed.'
            exit 0
          fi
          git commit -m 'fix: normalize and validate realistic fixture source'
          git push origin HEAD:codex/auditar-repositorio-para-visualizacion-3d
