name: Respaldo nocturno

# El respaldo de TODA la plataforma (auditoría P0-3): el registro —clientes,
# cuentas, membresías, facturación de la plataforma— y la base de cada
# supermercado, cada noche.
#
# **Desde adentro de Render.** La base no acepta conexiones de afuera (y así
# tiene que quedar), así que este job no se conecta a ella: le pide el archivo
# al servicio (`POST /api/interno/respaldo`, con el mismo token que el
# mantenimiento), que sí ve la base por la red interna, y guarda lo que vuelve.
#
#   1. El servicio corre `backend/scripts/respaldar_plataforma.py` (`pg_dump -Fc`
#      de cada base + MANIFIESTO.json), lo empaqueta en un .tar y lo cifra con
#      `gpg --symmetric` (AES256) y la frase de RESPALDO_PASSPHRASE, que vive en
#      RENDER. Sin la frase el archivo no sirve: guardala también FUERA de
#      Render y de GitHub (un gestor de contraseñas).
#   2. Acá se sube como artefacto (30 días) y, si están los secrets del bucket,
#      también a S3/R2.
#
# Secrets de GitHub (Settings → Secrets and variables → Actions → Secrets):
#   MANTENIMIENTO_TOKEN     el mismo que la variable del servicio en Render (obligatorio)
#   RESPALDO_S3_BUCKET      opcional: s3://bucket/carpeta
#   RESPALDO_S3_ENDPOINT    opcional: el endpoint S3 de R2 (https://<cuenta>.r2.cloudflarestorage.com)
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION   con el bucket ("auto" en R2)
# En Render (el servicio → Environment): MANTENIMIENTO_TOKEN y RESPALDO_PASSPHRASE.
#
# Sin MANTENIMIENTO_TOKEN se SALTEA con un aviso, no falla. Con él puesto,
# cualquier falla pone el workflow en rojo y GitHub avisa por correo.

on:
  schedule:
    # 06:41 UTC = 01:41 en Colombia: de madrugada, fuera de horario de tienda.
    # Minuto impar a propósito: a la hora en punto GitHub encola todo junto.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldo:
    name: Pedirle el respaldo cifrado al servicio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Desde adentro de Render (la base no acepta conexiones de afuera): el
      # servicio vuelca y cifra (`POST /api/interno/respaldo`, con el token del
      # mantenimiento) y acá sólo se guarda lo que devuelve. La frase de
      # cifrado vive en Render (`RESPALDO_PASSPHRASE`), no en GitHub.
      MANTENIMIENTO_TOKEN: ${{ secrets.MANTENIMIENTO_TOKEN }}
      MANTENIMIENTO_URL: ${{ vars.MANTENIMIENTO_URL || 'https://retail-espacios.onrender.com' }}
      RESPALDO_S3_BUCKET: ${{ secrets.RESPALDO_S3_BUCKET }}
      RESPALDO_S3_ENDPOINT: ${{ secrets.RESPALDO_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
    steps:
      - name: ¿Está configurado?
        id: listo
        run: |
          if [ -z "$MANTENIMIENTO_TOKEN" ]; then
            echo "::notice title=Respaldo salteado::Falta el secret MANTENIMIENTO_TOKEN (ver docs/operacion.md)."
            echo "si=no" >> "$GITHUB_OUTPUT"
          else
            echo "si=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Pedir el respaldo
        if: steps.listo.outputs.si == 'si'
        id: cifrado
        run: |
          # Despertarlo primero (liveness, no toca la base).
          curl -sS --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 \
               -o /dev/null "$MANTENIMIENTO_URL/api/health" || true
          CODIGO=$(curl -sS --max-time 1500 -D cabeceras.txt -o respaldo.bin -w '%{http_code}' -X POST \
               -H "X-Mantenimiento-Token: $MANTENIMIENTO_TOKEN" \
               "$MANTENIMIENTO_URL/api/interno/respaldo")
          echo "HTTP $CODIGO"
          if [ "$CODIGO" != "200" ]; then
            cat respaldo.bin; echo
            if [ "$CODIGO" = "404" ]; then
              echo "::error::El servicio no tiene MANTENIMIENTO_TOKEN configurado (404)."
            fi
            exit 1
          fi
          NOMBRE=$(grep -i '^content-disposition' cabeceras.txt | sed -E 's/.*filename="?([^";]+)"?.*/\1/' | tr -d '\r')
          FALLAS=$(grep -i '^x-respaldo-fallas' cabeceras.txt | awk '{print $2}' | tr -d '\r')
          BASES=$(grep -i '^x-respaldo-bases' cabeceras.txt | awk '{print $2}' | tr -d '\r')
          case "$NOMBRE" in recabra-respaldo-*.tar.gpg) ;; *) echo "::error::Nombre inesperado: $NOMBRE"; exit 1;; esac
          # Que sea de verdad un archivo cifrado con gpg (no un error en texto).
          if ! file respaldo.bin | grep -qi 'PGP\|GPG'; then
            echo "::error::Lo que devolvió el servicio no es un archivo gpg."; exit 1
          fi
          mv respaldo.bin "$NOMBRE"
          ls -l "$NOMBRE"
          echo "$BASES bases, $FALLAS fallas"
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "fallas=$FALLAS" >> "$GITHUB_OUTPUT"

      - name: Subir como artefacto (30 días)
        if: steps.listo.outputs.si == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cifrado.outputs.nombre }}
          path: ${{ steps.cifrado.outputs.nombre }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0   # ya está comprimido y cifrado

      - name: Subir al bucket (S3/R2, opcional)
        if: steps.listo.outputs.si == 'si' && env.RESPALDO_S3_BUCKET != ''
        run: |
          EXTRA=""
          if [ -n "$RESPALDO_S3_ENDPOINT" ]; then EXTRA="--endpoint-url $RESPALDO_S3_ENDPOINT"; fi
          aws s3 cp $EXTRA "${{ steps.cifrado.outputs.nombre }}" \
              "${RESPALDO_S3_BUCKET%/}/${{ steps.cifrado.outputs.nombre }}"

      # Una base que no se pudo volcar no deja sin respaldo a las demás (ya se
      # guardó lo que llegó), pero el job tiene que quedar rojo para que se vea.
      - name: ¿Faltó alguna base?
        if: steps.listo.outputs.si == 'si' && steps.cifrado.outputs.fallas != '0'
        run: |
          echo "::error::${{ steps.cifrado.outputs.fallas }} base(s) no se pudieron respaldar: ver el log del servicio en Render."
          exit 1
