# Alembic, sólo aditivo (auditoría P1-8). La app NO necesita este archivo: el
# arranque migra todas las bases con `app/migraciones.py` (registro + cada
# cliente). Sirve para escribir una migración nueva a mano:
#
#   cd backend && alembic revision -m "agrega tal cosa"
#
# y para mirar la base de DATABASE_URL (`alembic current`, `alembic history`).
# Para migrar TODAS las bases desde la consola: `python -m app.migraciones`.
[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = .
# Los nombres de archivo empiezan por la fecha: se leen en orden.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
